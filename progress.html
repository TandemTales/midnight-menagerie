<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Menagerie — Build Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Grenze:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07060d;--ink2:#0e0c18;--ink3:#161226;--line:#2a2442;
  --flame:#f8c96b;--flame2:#ffb64a;--spectre:#6fd9ec;--rose:#f26d78;
  --txt:#f4efe4;--mid:#b6adc4;--lo:#7d748d;--green:#7fd68a;
}
*{box-sizing:border-box}
body{margin:0;background:
   radial-gradient(1100px 620px at 18% -8%, #1d1733 0%, transparent 62%),
   radial-gradient(900px 520px at 88% 6%, #10222b 0%, transparent 58%),
   var(--ink);
  color:var(--txt);font-family:Grenze,Georgia,serif;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 90px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px}
h1{font-family:Cinzel,serif;font-size:clamp(26px,3.4vw,46px);margin:0;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff6e2,#f8c96b 55%,#b87826);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-shadow:0 0 42px rgba(255,182,74,.22)}
.sub{color:var(--mid);font-size:15px;margin-top:6px;max-width:62ch;line-height:1.5}
.meta{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lo);line-height:1.9}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 10px var(--green);margin-right:7px;animation:p 1.9s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.bar{height:8px;border-radius:6px;background:#181329;overflow:hidden;border:1px solid var(--line);margin:18px 0 30px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2a7f99,#6fd9ec 45%,#f8c96b);
  transition:width .8s cubic-bezier(.16,1,.3,1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--ink3),var(--ink2));border:1px solid var(--line);
  border-radius:12px;padding:15px 16px 14px;position:relative;overflow:hidden;
  transition:border-color .3s, transform .3s}
.card:hover{border-color:#463c6b;transform:translateY(-2px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lo)}
.card[data-s="done"]::before{background:var(--green);box-shadow:0 0 14px var(--green)}
.card[data-s="building"]::before{background:var(--flame2);box-shadow:0 0 14px var(--flame2);animation:p 1.6s infinite}
.card[data-s="reviewing"]::before{background:var(--spectre);box-shadow:0 0 14px var(--spectre);animation:p 1.6s infinite}
.card[data-s="rework"]::before{background:var(--rose);box-shadow:0 0 14px var(--rose)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cn{font-family:Cinzel,serif;font-size:16px;letter-spacing:.04em}
.st{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;
  letter-spacing:.12em;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--lo);white-space:nowrap}
.st.done{color:var(--green);border-color:#2c5e35}
.st.building{color:var(--flame2);border-color:#5e4520}
.st.reviewing{color:var(--spectre);border-color:#245666}
.st.rework{color:var(--rose);border-color:#6b2630}
.cd{color:var(--lo);font-size:13px;margin:7px 0 10px;line-height:1.45}
.gap{font-size:13px;color:var(--rose);border-left:2px solid #6b2630;padding-left:9px;margin-top:9px;line-height:1.45}
.vd{font-size:13px;color:var(--green);border-left:2px solid #2c5e35;padding-left:9px;margin-top:9px;line-height:1.45}
.rd{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--lo);margin-top:9px}
h2{font-family:Cinzel,serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--lo);margin:42px 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.feed{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8}
.feed div{padding:5px 0;border-bottom:1px solid rgba(22,18,36,.5);display:flex;gap:14px}
.feed time{color:#5a5270;flex:none}
.feed span{color:var(--mid)}
a.play{display:inline-block;margin-top:4px;font-family:Cinzel,serif;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:#1a1526;background:linear-gradient(180deg,#ffe2a8,#e0a23c);
  padding:9px 20px;border-radius:6px;text-decoration:none;box-shadow:0 6px 22px rgba(224,162,60,.24)}
a.play:hover{filter:brightness(1.1)}
</style></head><body>
<div class="wrap">
  <header>
    <div>
      <h1>Midnight Menagerie</h1>
      <div class="sub" id="headline">…</div>
      <div style="margin-top:14px"><a class="play" href="/game/index.html">Play the current build →</a></div>
    </div>
    <div class="meta">
      <div><span class="dot"></span><span id="wave">—</span></div>
      <div id="updated">—</div>
      <div id="counts">—</div>
    </div>
  </header>
  <div class="bar"><i id="pbar" style="width:0%"></i></div>
  <div class="grid" id="grid"></div>
  <h2>Activity</h2>
  <div class="feed" id="feed"></div>
</div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function cardHTML(p) {
  const gap = p.gap ? '<div class="gap"><b>Biggest gap:</b> ' + esc(p.gap) + '</div>' : '';
  const vd  = (p.verdict && !p.gap) ? '<div class="vd">' + esc(p.verdict) + '</div>' : '';
  const rd  = p.round ? '<div class="rd">round ' + p.round + '</div>' : '';
  return '<div class="card" data-s="' + esc(p.status) + '">' +
    '<div class="ch"><div class="cn">' + esc(p.name) + '</div>' +
    '<div class="st ' + esc(p.status) + '">' + esc(p.status) + '</div></div>' +
    '<div class="cd">' + esc(p.desc) + '</div>' + gap + vd + rd + '</div>';
}

async function tick() {
  try {
    const d = await (await fetch('/progress.json?t=' + Date.now())).json();
    document.getElementById('headline').textContent = d.headline || '';
    document.getElementById('wave').textContent = 'Wave ' + d.wave + ' — ' + (d.waveLabel || '');
    document.getElementById('updated').textContent = 'updated ' + String(d.updated || '').replace('T', ' ');
    const done = d.pieces.filter(p => p.status === 'done').length;
    document.getElementById('counts').textContent = done + ' / ' + d.pieces.length + ' pieces signed off';
    document.getElementById('pbar').style.width = (100 * done / d.pieces.length) + '%';
    document.getElementById('grid').innerHTML = d.pieces.map(cardHTML).join('');
    document.getElementById('feed').innerHTML = (d.events || []).slice().reverse().slice(0, 80)
      .map(e => '<div><time>' + esc(String(e.t || '').replace('T', ' ').slice(5)) +
                '</time><span>' + esc(e.msg) + '</span></div>').join('');
  } catch (e) { console.warn(e); }
}
tick(); setInterval(tick, 4000);
</script></body></html>
