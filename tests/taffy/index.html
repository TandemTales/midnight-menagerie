<!doctype html>
<meta charset="utf-8">
<title>Taffy — a Gummy is marked, and playing one counts</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; background: #14121a; color: #d8d4e0; padding: 20px; }
  .pass { color: #7fd08a; } .fail { color: #ff8080; } h2 { color: #c9a9ff; margin: 18px 0 6px; }
</style>
<h1>Taffy</h1>
<div id="out"></div>
<script type="module">
/**
 * Taffy had no suite. She is the Companion whose whole archetype is COPIES, and
 * two of the three things that make a copy a copy were not wired:
 *
 *   - `gummy()` spawned with `{ flags: { gummy: true } }` and `engine.addCard`
 *     reads `meta`, never `flags` — so `U.flag(card, 'gummy')` was undefined on
 *     every Gummy ever made. `copyable()` let a Gummy be copied and `gummy()`
 *     would not refuse a Gummy source, which is the "cannot copy itself" rule
 *     the archetype rests on.
 *   - `gummyPlayed` is read by two cards and was incremented by exactly one
 *     OTHER card, so both read a number that was almost always zero.
 *
 * CONTRACTS trap 12: a card that resolves without throwing is not a card that
 * works. Nothing here asserts that an effect ran; each check asserts what it
 * changed.
 */
import { RNG } from '../../game/src/core/rng.js';
import { CombatEngine } from '../../game/src/combat/engine.js';
import { makeDummySetup } from '../../game/src/combat/dummy.js';
import { installTrackers, trackerCtx, flag, got } from '../../game/src/data/companions/_util.js';
import * as CARDS from '../../game/src/data/cards.js';

const passes = [], fails = [];
const out = document.getElementById('out');
const check = (ok, what, detail = '') => (ok ? passes : fails).push(what + (detail ? ` — ${detail}` : ''));
const say = (html, cls) => { const d = document.createElement('div'); d.className = cls || ''; d.innerHTML = html; out.appendChild(d); };

async function taffy() {
  const e = new CombatEngine(makeDummySetup(new RNG(51), {
    companion: 'taffy', deck: CARDS.startingDeckFor('taffy'), maxHp: 72,
  }));
  await e.startCombat();
  installTrackers(e, 'taffy');
  return e;
}
async function play(e, id, target) {
  e.addCard(CARDS.cardById(id), 'hand', {});
  const card = e.piles.hand[e.piles.hand.length - 1];
  e.player.energy = 9;
  await e.playCard(card.uid, target ? target.id : undefined);
  return card;
}
/** Every card in hand that carries the Gummy marker. */
const gummies = (e) => e.piles.hand.filter(c => flag(c, 'gummy'));

try {
  say('<h2>A Gummy is MARKED as one</h2>');
  {
    const e = await taffy();
    const before = gummies(e).length;
    // Sample Size copies a Common from hand into hand.
    e.addCard(CARDS.cardById('taffy/gummy-jab'), 'hand', {});
    await play(e, 'taffy/sample-size');
    const made = gummies(e);
    check(made.length > before,
      'copying a Trick really puts a marked Gummy in hand',
      `${before} -> ${made.length}`);
    if (made.length) {
      check(flag(made[0], 'gummy') === true,
        'and the marker is on the CARD, not just in its keywords',
        String(flag(made[0], 'gummy')));
      check((made[0].def.keywords || []).includes('vanish'),
        'and it vanishes, the way a copy should');
    }
  }

  say('<h2>and playing one COUNTS</h2>');
  {
    const e = await taffy();
    const c0 = trackerCtx(e, null);
    check(got(c0, 'gummyPlayed') === 0, 'setup: nothing played yet',
      String(got(c0, 'gummyPlayed')));

    e.addCard(CARDS.cardById('taffy/gummy-jab'), 'hand', {});
    await play(e, 'taffy/sample-size');
    const g = gummies(e)[0];
    check(!!g, 'setup: a Gummy is in hand');
    if (g) {
      const t = e.livingEnemies()[0];
      e.player.energy = 9;
      await e.playCard(g.uid, t.id);
      check(got(trackerCtx(e, null), 'gummyPlayed') === 1,
        'playing a Gummy really increments gummyPlayed',
        String(got(trackerCtx(e, null), 'gummyPlayed')));
    }
  }

  say('<h2>and a Gummy cannot be copied again</h2>');
  {
    const e = await taffy();
    e.addCard(CARDS.cardById('taffy/gummy-jab'), 'hand', {});
    await play(e, 'taffy/sample-size');
    const g = gummies(e)[0];
    check(!!g, 'setup: a Gummy exists');
    if (g) {
      const n = gummies(e).length;
      // Sample Size filters on `copyable`, which refuses a Gummy. With the
      // marker missing it accepted one, and a copy of a copy is unbounded.
      e.piles.hand = e.piles.hand.filter(c => flag(c, 'gummy') || c.id === 'taffy/sample-size');
      await play(e, 'taffy/sample-size');
      check(gummies(e).length === n,
        'a Gummy is not a legal source — no copy of a copy',
        `${n} -> ${gummies(e).length}`);
    }
  }

  say('<h2>a Stretched Trick is Retained until it is played</h2>');
  {
    /* "A Stretched Trick continues to Retain whenever it is in hand" (chapter
       07). `stretch()` could only grant the one-turn Retain, so a Trick held into
       its second turn was discarded before it reached 3 Stretch, and Jawbreaker
       Drop's discount at full Stretch could never be reached. */
    const { counter } = await import('../../game/src/data/companions/_util.js');
    const e = await taffy();
    const drop = CARDS.cardById('taffy/jawbreaker-drop');
    e.addCard(drop, 'hand', {});
    const k = e.piles.hand[e.piles.hand.length - 1];
    e.piles.hand = [k];                       // Long Pull's only legal target
    await play(e, 'taffy/long-pull');
    check(counter(k, 'stretch') === 1, 'Long Pull Stretches the held Trick', `stretch=${counter(k, 'stretch')}`);
    await e.endTurn();
    await e.endTurn();
    check(e.piles.hand.includes(k), 'two turn ends later it is still in hand',
      `hand: ${e.piles.hand.map(c => c.id).join(', ')}`);
    check(counter(k, 'stretch') === 3, 'at full Stretch', `stretch=${counter(k, 'stretch')}`);
    check(e.costOf(k) === drop.cost - drop.nums.n, 'where Jawbreaker Drop costs its discount less',
      `costs ${e.costOf(k)}, printed ${drop.cost}`);
  }

  say('<h2>A Power keeps the best copy played</h2>');
  {
    /* Family Pack's surcharge {n} (1, upgraded 0) was captured by the
       install-once closure, so Family Pack then Family Pack+ still charged 1. */
    const gummyCost = async (seq) => {
      const e = await taffy();
      for (const up of seq) {
        e.addCard(CARDS.cardById('taffy/family-pack'), 'hand', { upgraded: up });
        const card = e.piles.hand[e.piles.hand.length - 1];
        e.player.energy = 9;
        await e.playCard(card.uid);
      }
      await e.endTurn();
      await play(e, 'taffy/sugar-bonk', e.livingEnemies()[0]);
      const g = e.piles.discard.find(k => flag(k, 'gummy') && k.def && k.def.id === 'taffy/sugar-bonk');
      return g ? e.costOf(g) : null;
    };
    const printed = CARDS.cardById('taffy/sugar-bonk').cost;
    const base = await gummyCost([false]), both = await gummyCost([false, true]);
    check(base === printed + 1, 'Family Pack: the Gummy copy costs 1 more', `printed ${printed}, Gummy ${base}`);
    check(both === printed, 'Family Pack then Family Pack+ charges the upgraded 0 more', `printed ${printed}, Gummy ${both}`);
  }

  say('<h2>Same Again copies the last Trick you played</h2>');
  {
    /* It read `tf(c).lastPlayed`, which nothing in the tree ever wrote, so the
       Uncommon did nothing at all, base or upgraded (tests/base-effects). */
    const e = await taffy();
    await play(e, 'taffy/sugar-bonk', e.livingEnemies()[0]);
    const before = gummies(e).length;
    await play(e, 'taffy/same-again');
    const made = gummies(e);
    check(made.length === before + 1 && made[made.length - 1].def.id === 'taffy/sugar-bonk',
      'after Sugar Bonk, Same Again puts a Gummy Sugar Bonk in hand',
      `gummies in hand: ${made.map(k => k.def.id).join(', ') || 'none'}`);
    const e2 = await taffy();
    const g0 = gummies(e2).length;
    await play(e2, 'taffy/same-again');
    check(gummies(e2).length === g0, 'played first, it copies nothing - not even itself',
      `gummies in hand: ${gummies(e2).map(k => k.def.id).join(', ') || 'none'}`);
    const e3 = await taffy();
    await play(e3, 'taffy/sugar-bonk', e3.livingEnemies()[0]);
    await play(e3, 'taffy/same-again');
    const g = gummies(e3)[0];
    if (g) { e3.player.energy = 9; await e3.playCard(g.uid, e3.livingEnemies()[0].id); }
    const n3 = gummies(e3).length;
    await play(e3, 'taffy/same-again');
    check(gummies(e3).length === n3, 'a Gummy is never the source, and it works once each turn',
      `${n3} -> ${gummies(e3).length}`);
  }

  /* tests/base-effects: six Belly and Gummy Tricks that did something other
     than their text once the board could reach them. */
  const emptyHand = (e) => { for (const k of e.piles.hand.slice()) e.discardCard(k, 'test'); };
  const toBelly = (e, id) => { const k = e.addCard(CARDS.cardById(id), 'stash', {}); k.meta.belly = true; return k; };
  const where = (e, k) => e.piles.pileOf(k);

  say('<h2>Regurgitate discounts the one you CHOOSE</h2>');
  {
    const e = await taffy(); emptyHand(e);
    const a = toBelly(e, 'taffy/pinch-off'), b = toBelly(e, 'taffy/sugar-bonk');
    e.setChoiceResolver((req) => [req.pool.length - 1]);   // pick the LAST one offered
    await play(e, 'taffy/regurgitate');
    check(where(e, a) === 'hand' && where(e, b) === 'hand' && e.costOf(b) === 0 && e.costOf(a) === 2,
      'choosing Sugar Bonk makes Sugar Bonk cost 0, not the first Trick out',
      `Pinch Off ${e.costOf(a)}, Sugar Bonk ${e.costOf(b)}`);
  }

  say('<h2>Mouthfeel draws for EACH type in the Belly</h2>');
  {
    const e = await taffy(); emptyHand(e);
    toBelly(e, 'taffy/sugar-bonk');
    await play(e, 'taffy/mouthfeel');
    check(e.piles.hand.length === 1, 'one type in the Belly draws 1 Trick (it drew 0)', `hand ${e.piles.hand.length}`);
  }

  say('<h2>Copycat Cannon PLAYS one copy</h2>');
  {
    const e = await taffy(); emptyHand(e);
    toBelly(e, 'taffy/sugar-bonk');
    const t = e.livingEnemies()[0]; const hp = t.hp;
    await play(e, 'taffy/copycat-cannon');
    const ids = (p) => e.piles[p].filter(k => flag(k, 'gummy') && k.def.id === 'taffy/sugar-bonk').length;
    check(t.hp < hp, 'the copy hits for free the moment the Cannon resolves', `enemy ${hp} -> ${t.hp}`);
    check(ids('hand') === 0 && ids('discard') === 1 && ids('exhaust') === 1,
      'the played copy Vanished, the other is in the discard, none waits in hand',
      `hand ${ids('hand')}, discard ${ids('discard')}, vanished ${ids('exhaust')}`);
  }

  say('<h2>Perfect Replica and Keep the Wrapper: survive one play, Vanish on the next</h2>');
  {
    const twice = async (e, k) => {
      e.player.energy = 9; await e.playCard(k.uid, e.livingEnemies()[0].id);
      const first = where(e, k);
      e.moveCard(k, 'hand'); e.player.energy = 9; await e.playCard(k.uid, e.livingEnemies()[0].id);
      return first + ' then ' + where(e, k);
    };
    const e = await taffy(); emptyHand(e);
    toBelly(e, 'taffy/sugar-bonk');
    await play(e, 'taffy/perfect-replica');
    const r = gummies(e)[0];
    check(!!r, 'Perfect Replica puts a marked Gummy in hand', `hand: ${e.piles.hand.map(k => k.def.id).join(', ')}`);
    if (r) check((await twice(e, r)) === 'discard then exhaust', 'its copy is discarded on the first play and Vanishes on the second',
      where(e, r));
    const e2 = await taffy(); emptyHand(e2);
    const g = e2.addCard(CARDS.cardById('taffy/sugar-bonk'), 'hand', { exhaust: true, meta: { gummy: true } });
    await play(e2, 'taffy/keep-the-wrapper');
    const res = await twice(e2, g);
    check(res === 'discard then exhaust', 'a Kept Gummy is discarded once, then Chewed: it Vanishes on the next play', res);
  }

  say('<h2>Borrowed Price lasts until the Trick is played</h2>');
  {
    const e = await taffy(); emptyHand(e);
    const b = toBelly(e, 'taffy/wobble-room');
    const a = e.addCard(CARDS.cardById('taffy/pinch-off'), 'hand', {});
    await play(e, 'taffy/borrowed-price');
    const swapped = e.costOf(a) + '/' + e.costOf(b);
    e.player.energy = 9; await e.playCard(a.uid);
    check(swapped === '0/2' && e.costOf(a) === 2 && e.costOf(b) === 2,
      'Pinch Off borrows the 0 until it is played, then costs 2 again; Wobble Room keeps 2 until it is played',
      `swapped ${swapped}, after playing Pinch Off: Pinch Off ${e.costOf(a)}, Wobble Room ${e.costOf(b)}`);
  }
} catch (err) {
  fails.push('THREW: ' + (err && err.stack || err));
}

say(`<h2>${passes.length} passed, ${fails.length} failed</h2>`, fails.length ? 'fail' : 'pass');
say('<ul class="pass">' + passes.map(p => `<li>PASS ${p}</li>`).join('') + '</ul>');
if (fails.length) say('<ul class="fail">' + fails.map(f => `<li>FAIL ${f}</li>`).join('') + '</ul>');
window.__RESULT = { passed: passes.length, failed: fails.length, fails, passes };
window.__DONE = true;
</script>
