<!doctype html>
<meta charset="utf-8">
<title>Net — lockstep, ordering, divergence, rejoin</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; background: #14121a; color: #d8d4e0; padding: 20px; }
  .pass { color: #7fd08a; } .fail { color: #ff8080; } h2 { color: #c9a9ff; margin: 18px 0 6px; }
</style>
<h1>Net</h1>
<div id="out"></div>
<script type="module">
import { RNG } from '../../game/src/core/rng.js';
import { CombatEngine } from '../../game/src/combat/engine.js';
import { makeDummyParty } from '../../game/src/combat/dummy.js';
import { installTrackers } from '../../game/src/data/companions/_util.js';
import { startingDeckFor } from '../../game/src/data/cards.js';
import { LoopbackHub, ChannelTransport, canChannel } from '../../game/src/net/transport.js';
import { Session, INPUT, cardRef, refCard } from '../../game/src/net/session.js';
import { Run } from '../../game/src/state/run.js';
import { act, ACT, attachActions, attachChoices, deckIndex } from '../../game/src/net/actions.js';
import { Lobby, seedFromRoom } from '../../game/src/net/lobby.js';
import { MAX_PARTY } from '../../game/src/combat/engine.js';

const passes = [], fails = [];
const out = document.getElementById('out');
const check = (ok, what, detail = '') => (ok ? passes : fails).push(what + (detail ? ` — ${detail}` : ''));
function say(html, cls) { const d = document.createElement('div'); d.className = cls || ''; d.innerHTML = html; out.appendChild(d); }

/**
 * A console error this suite MEANS to provoke.
 *
 * `run.py` fails the suite on ANY console error, which is right: a 404, a
 * TypeError inside a listener or a `[net] unknown input kind` is exactly the
 * silent breakage this file exists to catch. But two checks below deliberately
 * drift a board and deliberately hand a peer the wrong seed, and `session.js`
 * reporting that loudly is the PRODUCT WORKING — so the suite has exited 1
 * since the day it was written while printing "128 passed, 0 failed", and the
 * exit code was believed by nobody and the summary line by everybody.
 *
 * Declaring one here lets the gate stay strict about everything else. The
 * runner fails on an error that is not declared, AND on a declaration that
 * never fired — because an expectation nothing matches means the report it
 * stands for has gone silent, which is the regression the check next to it was
 * written to notice. A whitelist that can only ever mute is CONTRACTS trap 12
 * with a different hat on.
 */
const expectedErrors = [];
const expectError = (substr, why) => expectedErrors.push({ substr, why });

const SEED = 9182;

/**
 * A Run-shaped stand-in.
 *
 * The Session only ever touches `run.combat`, `run._combatDigest`,
 * `run.session` and `run.localSeat`, so this is the whole surface. Using the
 * REAL digest function matters — a mock of the thing under test proves nothing
 * (CONTRACTS trap 5), so it is imported behaviour, copied verbatim from
 * `state/run.js`, not a simplification.
 */
function combatDigest(e) {
  if (!e) return null;
  return [
    e.turn, e.phase, e.over ? 1 : 0,
    e.players.map(pl => [
      pl.hp, pl.block, pl.energy, pl.fallen ? 1 : 0,
      pl.piles.hand.map(c => `${c.id}${c.upgraded ? '+' : ''}`).join('|'),
      pl.piles.draw.length, pl.piles.discard.length, pl.piles.exhaust.length,
    ].join(':')).join(';'),
    e.enemies.map(x => `${x.id}:${x.hp}:${x.block}:${x.alive ? 1 : 0}`).join(','),
  ].join('~');
}

async function makeClient(hub, seat, seats, id) {
  const deck = startingDeckFor('marmalade');
  const decks = Array.from({ length: seats }, () => deck.slice());
  const e = makeDummyParty(new RNG(SEED), seats, { companion: 'marmalade', decks, maxHp: 70 });
  e.setTrackerInstaller(installTrackers);
  await e.startCombat();

  const run = { combat: e, _combatDigest: combatDigest, localSeat: seat, session: null };
  const session = new Session({ transport: hub.peer(id), seat, seats, seed: SEED, host: seat === 0 });
  session.attach(run);

  /* Every input — ours and theirs — goes through the SAME path. That is the
     point: an ordering bug shows up in a one-machine test instead of only over
     a real wire, where it would look like latency. */
  session.on('input', async (msg) => {
    if (msg.t === INPUT.END) await e.endTurn(e.players[msg.seat]);
    if (msg.t === INPUT.PLAY) {
      const pl = e.players[msg.seat];
      // Resolved by POSITION, never by uid — see `cardRef` in net/session.js.
      const card = refCard(e, msg);
      if (card) await e.playCard(card.uid, msg.target || undefined);
    }
  });
  return { e, run, session };
}

try {
  // ══ 1. Two clients, the same seed, the same board ═══════════════════════
  {
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    const b = await makeClient(hub, 1, 2, 'B');
    check(combatDigest(a.e) === combatDigest(b.e),
      'the same seed deals both clients the same board');
    check(a.session.seat === 0 && b.session.seat === 1, 'each client owns one seat');
    check(a.session.remote && b.session.remote,
      'a networked session reports remote, so shouldHandOff answers false');
  }

  // ══ 2. An input crosses, and both boards move together ══════════════════
  {
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    const b = await makeClient(hub, 1, 2, 'B');

    const card = a.e.players[0].piles.hand[0];
    const target = a.e.livingEnemies()[0];
    a.session.input({ t: INPUT.PLAY, ...cardRef(a.e, card), target: target.id });
    // `settled()` waits for the application QUEUE, not for a guessed number
    // of milliseconds — a fixed sleep racing an animation is a test that lies
    // both ways (CONTRACTS).
    await new Promise(r => setTimeout(r, 30));
    await a.session.settled(); await b.session.settled();

    check(a.session.log.length === 1 && b.session.log.length === 1,
      'the input is in both logs exactly once',
      `${a.session.log.length} / ${b.session.log.length}`);
    check(combatDigest(a.e) === combatDigest(b.e),
      'and both boards are still identical after it resolved');
    check(a.e.players[0].piles.hand.length === b.e.players[0].piles.hand.length,
      "seat 0's hand shrank on BOTH machines",
      `${a.e.players[0].piles.hand.length} / ${b.e.players[0].piles.hand.length}`);
  }

  // ══ 2b. A card's UID is not a network identity ══════════════════════════
  //  The first version of this protocol put `uid` on the wire. It looks right:
  //  unique, stable locally, round-trips cleanly. The remote client then failed
  //  to find the card and silently did nothing, and the board drifted by exactly
  //  one Trick — caught a turn later by the digest, a long way from the cause.
  {
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    const b = await makeClient(hub, 1, 2, 'B');
    const ca = a.e.players[0].piles.hand[0];
    const cb = b.e.players[0].piles.hand[0];
    check(ca.id === cb.id, "both clients hold the same Trick at the top of seat 0's hand",
      `${ca.id} / ${cb.id}`);
    check(ca.uid !== cb.uid,
      'and its uid is DIFFERENT on the two clients — uids are per page, not per game',
      `${ca.uid} vs ${cb.uid}`);

    const ref = cardRef(a.e, ca);
    check(!!ref && ref.pile === 'hand' && ref.seat === 0,
      'cardRef names it by seat, pile and position', JSON.stringify(ref));
    check(refCard(b.e, ref) === cb,
      'and that ref resolves to the SAME Trick on the other client');
    check(refCard(a.e, ref) === ca, 'and to the original on this one');
  }

  // ══ 3. A client may only speak for its own seat ═════════════════════════
  {
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    const b = await makeClient(hub, 1, 2, 'B');
    expectError('tried to act for seat',
      'a client speaking for somebody else is refused loudly, not silently');
    const bad = a.session.input({ t: INPUT.END, seat: 1 });
    check(bad === null, 'seat 0 cannot issue an input for seat 1');
    check(a.session.log.length === 0 && b.session.log.length === 0,
      'and nothing reached either log');
  }

  // ══ 4. ORDER is total, and it is not arrival order ══════════════════════
  //  Two seats act "at the same time" and the messages arrive in opposite
  //  orders on the two machines. Both must end up with the same sequence.
  {
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    const b = await makeClient(hub, 1, 2, 'B');

    // Hand-built inputs, delivered deliberately out of order to each side.
    const i0 = { t: INPUT.READY, seat: 0, turn: 1, seq: 1 };
    const i1 = { t: INPUT.READY, seat: 1, turn: 1, seq: 1 };
    a.session._accept(i1, 'B'); a.session._accept(i0);
    b.session._accept(i0, 'A'); b.session._accept(i1);

    const seq = (s) => s.log.map(m => `${m.turn}.${m.seat}.${m.seq}`).join(' ');
    check(seq(a.session) === seq(b.session),
      'both clients agree on the order despite opposite arrival',
      `${seq(a.session)}  vs  ${seq(b.session)}`);
    check(seq(a.session) === '1.0.1 1.1.1',
      'and the order is (turn, seat, seq) — seat breaks the tie, never arrival',
      seq(a.session));
  }
  {
    // A later turn always sorts after an earlier one, whenever it arrives.
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    a.session._accept({ t: INPUT.READY, seat: 1, turn: 4, seq: 1 }, 'B');
    a.session._accept({ t: INPUT.READY, seat: 1, turn: 2, seq: 1 }, 'B');
    a.session._accept({ t: INPUT.READY, seat: 0, turn: 2, seq: 1 });
    check(a.session.log.map(m => `${m.turn}.${m.seat}`).join(' ') === '2.0 2.1 4.1',
      'a late-arriving early turn still sorts into its place',
      a.session.log.map(m => `${m.turn}.${m.seat}`).join(' '));
  }

  // ══ 5. DIVERGENCE is reported, loudly, once ═════════════════════════════
  {
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    const b = await makeClient(hub, 1, 2, 'B');
    let told = 0;
    a.session.on('diverge', () => told++);

    a.session.publishDigest();
    b.session.publishDigest();
    check(a.session.inSync && b.session.inSync,
      'identical boards report no divergence');

    // Now break one board behind the other's back, exactly as a stray
    // Math.random() in a card would.
    expectError('DESYNC {reason: digest',
      'a board that has drifted is reported on the console, once');
    b.e.enemies[0].hp -= 7;
    b.session.publishDigest();
    check(!a.session.inSync, 'a board that has drifted IS caught');
    check(told === 1, 'and reported once, not once per message', String(told));
    b.session.publishDigest();
    check(told === 1, 'still once after another mismatching report', String(told));
  }
  {
    // A different seed is a divergence you can catch before a card is played.
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');
    let told = 0;
    a.session.on('diverge', (d) => { if (d.reason === 'seed') told++; });
    expectError('DESYNC {reason: seed',
      'a peer on the wrong seed is reported on the console at hello');
    const wrong = new Session({ transport: hub.peer('C'), seat: 1, seats: 2, seed: SEED + 1 });
    check(told === 1, 'a peer on a different seed is caught at hello', String(told));
    wrong.close();
  }

  // ══ 6. REJOIN: the log IS the save ══════════════════════════════════════
  {
    const hub = new LoopbackHub();
    const a = await makeClient(hub, 0, 2, 'A');      // host
    const b = await makeClient(hub, 1, 2, 'B');

    // Three inputs happen while B is present.
    for (let i = 0; i < 3; i++) a.session.input({ t: INPUT.READY });
    await new Promise(r => setTimeout(r, 20));
    check(b.session.log.length === 3, 'B saw all three', String(b.session.log.length));

    // B drops. Two more happen without them.
    b.session.transport.close();
    for (let i = 0; i < 2; i++) a.session.input({ t: INPUT.READY });
    check(a.session.log.length === 5, 'the host kept going', String(a.session.log.length));
    check(b.session.log.length === 3, 'and B missed the last two', String(b.session.log.length));

    // B comes back on a fresh transport and asks for everything after what it has.
    const back = new Session({ transport: hub.peer('B2'), seat: 1, seats: 2, seed: SEED });
    back.absorb(a.session.log);
    check(back.log.length === 5, 'a rejoining client catches up from the log',
      String(back.log.length));
    check(back.log.map(m => m.seq).join(',') === '1,2,3,4,5',
      'in order, with nothing duplicated', back.log.map(m => m.seq).join(','));

    const again = back.absorb(a.session.log);
    check(again === 0, 'and absorbing the same log twice adds nothing', String(again));
  }

  // ══ 7. An ASYNCHRONOUS wire, which a real one is ════════════════════════
  {
    const hub = new LoopbackHub({ async: true });
    const a = await makeClient(hub, 0, 2, 'A');
    const b = await makeClient(hub, 1, 2, 'B');
    const card = a.e.players[0].piles.hand[0];
    a.session.input({ t: INPUT.PLAY, ...cardRef(a.e, card), target: a.e.livingEnemies()[0].id });
    check(b.session.log.length === 0, 'nothing has arrived yet on an async wire');
    await new Promise(r => setTimeout(r, 60));
    check(b.session.log.length === 1, 'and it arrives on the next tick');
    await a.session.settled(); await b.session.settled();
    check(combatDigest(a.e) === combatDigest(b.e),
      'the two boards agree once it has landed');
  }

  // ══ 8. The two-tab transport exists and obeys the contract ══════════════
  {
    check(canChannel(), 'a BroadcastChannel wire is available in this browser');
    if (canChannel()) {
      const room = 'mm-test-' + Math.random().toString(36).slice(2);
      const t1 = new ChannelTransport(room, 'T1');
      const t2 = new ChannelTransport(room, 'T2');
      let mine = 0, theirs = 0;
      t1.onMessage(() => mine++);
      t2.onMessage(() => theirs++);
      t1.send({ hello: true });
      await new Promise(r => setTimeout(r, 120));
      check(theirs === 1, 'the other tab receives it', String(theirs));
      check(mine === 0, 'and the sender never receives its own — lockstep rule 2',
        String(mine));
      t1.close(); t2.close();
    }
  }

  // ══ 9. The rooms are on the wire too ═══════════════════════════════════
  /* A per-Kid room is NOT a private act. Every client simulates the whole
     expedition — `_combatDigest` fingerprints every seat's board and the next
     fight deals from decks all four clients must agree about — so a Kid taking
     a Trick on their own screen has to reach everybody's. These clients run
     two REAL `Run`s, because a mock of the thing under test proves nothing
     (CONTRACTS rule 9 / trap 5). */
  {
    const PARTY = [{ companion: 'marmalade', kid: 'maya' }, { companion: 'bones', kid: 'eli' }];
    const roomClient = (hub, seat, id) => {
      const run = Run.mock({ seed: SEED, kids: PARTY });
      const session = new Session({ transport: hub.peer(id), seat, seats: 2, seed: SEED, host: seat === 0 });
      attachActions(session, run);     // one listener, one applier, both ends
      return { run, session };
    };
    const decks = (r) => r.kids.map(k => k.deck.map(c => c.id).join('|'));
    const offer = (r, seat) => (r.kids[seat].pendingReward.cards || []).map(c => c.id).join('|');

    const hub = new LoopbackHub();
    const A = roomClient(hub, 0, 'A');
    const B = roomClient(hub, 1, 'B');
    for (const c of [A, B]) {
      c.run.currentNodeId = 'x-bigscare';
      // Rolled per Kid off the shared seed, on both machines, before anybody
      // has clicked: `_prepareReward` forks on the node id.
      for (let s = 0; s < 2; s++) c.run.asSeat(s, () => c.run._prepareReward({ id: 'x-bigscare' }, 'bigScare', { navigate: false }));
    }
    check(decks(A.run).join('#') === decks(B.run).join('#'),
      'two real Runs on one seed hold the same decks');
    check(offer(A.run, 1) === offer(B.run, 1),
      "and rolled seat 1 the same three Tricks", offer(A.run, 1));

    /* The reason a uid cannot go on the wire, measured rather than asserted:
       `nextUid()` counts per PAGE, so these two Runs hold the same cards under
       entirely different uids. CONTRACTS trap 30. */
    const uidsA = A.run.kids[1].deck.map(c => c.uid).join(',');
    const uidsB = B.run.kids[1].deck.map(c => c.uid).join(',');
    check(uidsA !== uidsB, 'and the same cards under DIFFERENT uids, which is why index',
      `${uidsA.slice(0, 18)}… / ${uidsB.slice(0, 18)}…`);

    const beforeA = decks(A.run), beforeB = decks(B.run);
    const wanted = B.run.kids[1].pendingReward.cards[1].id;

    // Seat 1 takes their second Trick, on seat 1's machine.
    await act(B.run, { t: INPUT.ROOM, act: ACT.REWARD_TAKE, index: 1 });
    await new Promise(r => setTimeout(r, 30));
    await A.session.settled(); await B.session.settled();

    check(B.run.kids[1].deck.length === beforeB[1].split('|').length + 1,
      'the Trick lands in seat 1’s deck on their own machine');
    check(A.run.kids[1].deck.length === beforeA[1].split('|').length + 1,
      "and on seat 0's machine, which never saw the click",
      `${beforeA[1].split('|').length} -> ${A.run.kids[1].deck.length}`);
    check(A.run.kids[1].deck[A.run.kids[1].deck.length - 1].id === wanted
       && B.run.kids[1].deck[B.run.kids[1].deck.length - 1].id === wanted,
      'and it is the same Trick on both', wanted);
    check(A.run.kids[0].deck.length === beforeA[0].split('|').length
       && B.run.kids[0].deck.length === beforeB[0].split('|').length,
      "seat 0's own deck did not move");
    check(decks(A.run).join('#') === decks(B.run).join('#'),
      'so both machines still hold identical decks');
    check(A.run.localSeat === 0 && B.run.localSeat === 1,
      'and applying a remote seat’s action PUT THE SEAT BACK',
      `${A.run.localSeat} / ${B.run.localSeat}`);

    // Seat 0 skips theirs. The other half of the same screen.
    const purseA = A.run.kids[0].lostThings;
    await act(A.run, { t: INPUT.ROOM, act: ACT.REWARD_SKIP });
    await new Promise(r => setTimeout(r, 30));
    await A.session.settled(); await B.session.settled();
    check(A.run.kids[0].lostThings > purseA,
      'skipping pays seat 0 on their own machine',
      `${purseA} -> ${A.run.kids[0].lostThings}`);
    check(B.run.kids[0].lostThings === A.run.kids[0].lostThings,
      "and on seat 1's, so the two purses cannot drift",
      `${B.run.kids[0].lostThings} / ${A.run.kids[0].lostThings}`);
    /* Per KID, and read as such. `pity` is one of the PER_KID accessors, so
       `run.pity` means "the Kid this screen belongs to" and reading it off two
       clients on two different seats compares two different Kids — which is
       what the first version of this check did, and it reported a desync that
       was entirely in the instrument. Seat 0 skipped (+2 on a mock's 3) and
       seat 1 took a non-Rare (+1 on a seat that was never given the mock's 3). */
    check(A.run.kids.map(k => k.pity).join('/') === B.run.kids.map(k => k.pity).join('/'),
      'both Kids’ pity counters moved on both machines',
      `${A.run.kids.map(k => k.pity).join('/')} vs ${B.run.kids.map(k => k.pity).join('/')}`);
    check(A.run.kids[0].pity === 5 && A.run.kids[1].pity === 1,
      'and each moved by its own Kid’s action, not the other’s',
      A.run.kids.map(k => k.pity).join('/'));

    // `deckIndex` is the uid → wire step every call site does.
    const anyCard = A.run.kids[1].deck[2];
    check(deckIndex(A.run, 1, anyCard.uid) === 2, 'deckIndex names a card by position');
    check(deckIndex(A.run, 1, 'no-such-uid') === -1, 'and answers -1 rather than 0 for a stranger');

    A.session.close(); B.session.close();
  }

  // ══ 10. Mr. Moth's, the Safe Room and a Curiosity, all on the wire ═════
  /* The same shape as §9 for the other three per-Kid rooms. Each is a screen
     the HANDOFF listed as "still acts locally", and each one changes state the
     next fight deals from. */
  {
    const PARTY = [{ companion: 'marmalade', kid: 'maya' }, { companion: 'bones', kid: 'eli' }];
    const roomClient = (hub, seat, id) => {
      const run = Run.mock({ seed: SEED, kids: PARTY });
      const session = new Session({ transport: hub.peer(id), seat, seats: 2, seed: SEED, host: seat === 0 });
      attachActions(session, run);
      return { run, session };
    };
    const both = async () => { await new Promise(r => setTimeout(r, 30)); await A.session.settled(); await B.session.settled(); };
    const deckOf = (c, s) => c.run.kids[s].deck.map(x => `${x.id}${x.upgraded ? '+' : ''}`).join('|');

    const hub = new LoopbackHub();
    const A = roomClient(hub, 0, 'A');
    const B = roomClient(hub, 1, 'B');
    for (const c of [A, B]) c.run.currentNodeId = 'x-shop';

    // ── Mr. Moth's ───────────────────────────────────────────────────────
    const shelf = B.run.shopStock({ id: 'x-shop' }, B.run.kids[1]);
    check(JSON.stringify(shelf) === JSON.stringify(A.run.shopStock({ id: 'x-shop' }, A.run.kids[1])),
      'both machines roll seat 1 the SAME shelf');
    const item = shelf.cards[0];
    B.run.kids[1].lostThings = 999; A.run.kids[1].lostThings = 999;
    const shopBefore = deckOf(A, 1);
    await act(B.run, { t: INPUT.ROOM, act: ACT.SHOP_BUY,
                       kind: 'card', id: item.id, price: item.price, key: `card:${item.id}` });
    await both();
    check(deckOf(A, 1) === deckOf(B, 1) && deckOf(A, 1) !== shopBefore,
      'a Trick bought at Mr. Moth’s lands in the same deck on both', item.id);
    check(A.run.kids[1].lostThings === B.run.kids[1].lostThings
       && A.run.kids[1].lostThings === 999 - item.price,
      'and the purse was charged once, on both',
      `${A.run.kids[1].lostThings} / ${B.run.kids[1].lostThings}`);

    // The removal service names the card by INDEX, the way the screen converts it.
    const doomed = A.run.kids[1].deck[3];
    const idx = deckIndex(B.run, 1, B.run.kids[1].deck[3].uid);
    await act(B.run, { t: INPUT.ROOM, act: ACT.SHOP_REMOVE, index: idx });
    await both();
    check(!A.run.kids[1].deck.some(c => c.uid === doomed.uid),
      'a forgotten Trick is gone from seat 0’s copy of seat 1’s deck too');
    check(deckOf(A, 1) === deckOf(B, 1), 'and the two decks still match');

    // ── the Safe Room ────────────────────────────────────────────────────
    const mendMe = A.run.kids[0].deck.findIndex(c => !c.upgraded);
    await act(A.run, { t: INPUT.ROOM, act: ACT.REST_MEND, index: mendMe });
    await both();
    check(A.run.kids[0].deck[mendMe].upgraded && B.run.kids[0].deck[mendMe].upgraded,
      'a Trick sharpened in the Safe Room is sharpened on both machines');

    const cloneFrom = 1;                       // seat 0 learns one of seat 1's
    const wantId = A.run.kids[1].deck[cloneFrom].id;
    const growFrom = A.run.kids[0].deck.length;
    const theirs = A.run.kids[1].deck.length;
    await act(A.run, { t: INPUT.ROOM, act: ACT.REST_CLONE, to: 1, index: cloneFrom });
    await both();
    check(A.run.kids[0].deck.length === growFrom + 1 && B.run.kids[0].deck.length === growFrom + 1,
      'a Clone grows the learner’s deck on both', `${growFrom} -> ${A.run.kids[0].deck.length}`);
    check(A.run.kids[0].deck[growFrom].id === wantId, 'with the Trick they watched', wantId);
    check(A.run.kids[1].deck.length === theirs && B.run.kids[1].deck.length === theirs,
      'and THEY keep theirs — a copy, not a move');

    // Mending a friend names them with `to`, because `seat` means who ACTED.
    A.run.kids[1].courage = 20; B.run.kids[1].courage = 20;
    await act(A.run, { t: INPUT.ROOM, act: ACT.REST_MEND_ALLY, to: 1, n: 15 });
    await both();
    check(A.run.kids[1].courage === 35 && B.run.kids[1].courage === 35,
      'sitting up with a friend heals THEM, on both machines',
      `${A.run.kids[1].courage} / ${B.run.kids[1].courage}`);
    check(A.run.kids[0].courage === B.run.kids[0].courage,
      'and the Kid who kept watch is unchanged on both');

    // A whole night's sleep is the run's own number, not one the screen sent.
    A.run.kids[0].courage = 30; B.run.kids[0].courage = 30;
    const slept = await act(A.run, { t: INPUT.ROOM, act: ACT.REST_NIGHT });
    await both();
    check(slept > 0 && A.run.kids[0].courage === B.run.kids[0].courage,
      'a night’s rest heals the same amount on both', `+${slept}`);

    // ── a Curiosity ──────────────────────────────────────────────────────
    for (const c of [A, B]) {
      c.run.currentNodeId = 'x-curio';
      c.run.pendingEvent = { id: 'the-portrait-that-follows', nodeId: 'x-curio',
                             resolved: null, resolvedBy: {}, pendingBy: {} };
    }
    const keepsBefore = A.run.kids[0].keepsakes.length;
    await act(A.run, { t: INPUT.ROOM, act: ACT.EVENT_OPTION, id: 'call' });
    await both();
    check(!!A.run.pendingEvent.resolvedBy[0] && !!B.run.pendingEvent.resolvedBy[0],
      'seat 0’s answer to a Curiosity is recorded on both machines');
    check(A.run.kids[0].keepsakes.length === keepsBefore + 1
       && B.run.kids[0].keepsakes.length === keepsBefore + 1,
      'and the Keepsake it paid out is in their bag on both',
      `${keepsBefore} -> ${A.run.kids[0].keepsakes.length}`);
    check(!A.run.pendingEvent.resolvedBy[1] && !B.run.pendingEvent.resolvedBy[1],
      'while seat 1 has still not answered it — the choice is theirs');

    await act(B.run, { t: INPUT.ROOM, act: ACT.EVENT_OPTION, id: 'straighten' });
    await both();
    check(A.run.pendingEvent.resolvedBy[1]?.option === 'straighten'
       && B.run.pendingEvent.resolvedBy[1]?.option === 'straighten',
      'and their own, different answer reaches both too');

    // ── who is still owed a turn in here ─────────────────────────────────
    await act(A.run, { t: INPUT.ROOM, act: ACT.ROOM_DONE });
    await both();
    check(A.run.roomDoneBy(A.run.kids[0]) && B.run.roomDoneBy(B.run.kids[0]),
      'a Kid finishing with a room is known to both, or one shuts it on the other');
    check(!A.run.roomDoneBy(A.run.kids[1]) && !B.run.roomDoneBy(B.run.kids[1]),
      'and the other Kid is still owed their turn');

    check(A.run.localSeat === 0 && B.run.localSeat === 1,
      'through all of it, neither screen changed hands',
      `${A.run.localSeat} / ${B.run.localSeat}`);

    A.session.close(); B.session.close();
  }

  // ══ 11. Combat through the shared applier, not the harness's own ═══════
  /* §2 wires `session.on('input')` by hand, inside this file. That proves the
     PROTOCOL and proves nothing about the game: until now no screen in
     `game/src/` called `session.input()` at all. These clients use
     `attachActions`, the same applier `scenes/combat.js` reaches through. */
  {
    const hub = new LoopbackHub();
    const client = (seat, id) => {
      const deck = startingDeckFor('marmalade');
      const e = makeDummyParty(new RNG(SEED), 2, { companion: 'marmalade', decks: [deck.slice(), deck.slice()], maxHp: 70 });
      e.setTrackerInstaller(installTrackers);
      // What `run.buildCombat` does — "which Kid is at THIS screen", so the
      // choice broker does not ask the person sitting here to make the other
      // Kid's decisions.
      e.localSeat = seat;
      /* `asSeat` is the REAL one off `Run.prototype`, not a stub: it reads only
         `kids`, `localSeat` and `combat`, all of which this stand-in has, and
         it is one of the things under test here (rule 9 / trap 5). The first
         version passed `(s, fn) => fn()` and the seat check below could not
         have failed however wrong `asSeat` was. */
      const run = { combat: e, _combatDigest: combatDigest, localSeat: seat, session: null,
                    kids: [{}, {}], asSeat: Run.prototype.asSeat };
      const session = new Session({ transport: hub.peer(id), seat, seats: 2, seed: SEED, host: seat === 0 });
      attachActions(session, run);
      return { e, run, session };
    };
    const A = client(0, 'A'); const B = client(1, 'B');
    await A.e.startCombat(); await B.e.startCombat();
    const settle = async () => { await new Promise(r => setTimeout(r, 40)); await A.session.settled(); await B.session.settled(); };

    check(combatDigest(A.e) === combatDigest(B.e), 'the fight opens identically on both');

    const card = B.e.players[1].piles.hand[0];
    const enemy = B.e.livingEnemies()[0];
    const hp = A.e.livingEnemies()[0].hp;
    await act(B.run, { t: INPUT.PLAY, ...cardRef(B.e, card), target: enemy.id });
    await settle();
    check(combatDigest(A.e) === combatDigest(B.e),
      'seat 1 plays a Trick and both boards still agree');
    check(A.e.livingEnemies()[0].hp <= hp && A.e.livingEnemies()[0].hp === B.e.livingEnemies()[0].hp,
      'and the enemy took it on both machines',
      `${hp} -> ${A.e.livingEnemies()[0].hp} / ${B.e.livingEnemies()[0].hp}`);

    /* END is per SEAT over a wire, not the table. Ending the table from here
       would close three other people's turns from one machine. */
    await act(B.run, { t: INPUT.END });
    await settle();
    check(B.e.players[1].ended && A.e.players[1].ended,
      'ending my turn ends MY seat, on both machines');
    check(!A.e.players[0].ended && !B.e.players[0].ended,
      'and does NOT end the other Kid’s from here');
    check(A.e.phase === 'player' && B.e.phase === 'player',
      'so the enemy phase is still waiting for them', `${A.e.phase} / ${B.e.phase}`);

    const turnBefore = A.e.turn;
    await act(A.run, { t: INPUT.END });
    await settle();
    check(A.e.turn === turnBefore + 1 && B.e.turn === turnBefore + 1,
      'the last seat closing runs the enemy phase on both, once',
      `${turnBefore} -> ${A.e.turn} / ${B.e.turn}`);
    check(combatDigest(A.e) === combatDigest(B.e),
      'and a whole round later the two boards are still identical');

    /* `run.asSeat` must not move `engine.localSeat`, or replaying a remote
       Kid's Trick pops THEIR choice in front of me — on every client at once,
       each answering separately. */
    check(A.e.localSeat === 0 && B.e.localSeat === 1,
      'replaying a remote seat left each engine’s own local seat alone',
      `${A.e.localSeat} / ${B.e.localSeat}`);

    A.session.close(); B.session.close();
  }

  // ══ 12. The lobby: seats, host and seed, with no election ══════════════
  /* `Session` takes seat, seats, seed and host as constructor arguments and has
     no opinion about where they come from. This is where they come from, and
     the whole design is that NOTHING is negotiated: seat is position in the
     sorted peer-id list, host is seat 0, and the seed is a hash of the room
     code, so four clients compute four identical answers with no round trip. */
  {
    const hub = new LoopbackHub();
    // Deliberately created in an order that does NOT match their sorted order,
    // because "first to connect is seat 0" is the tempting wrong answer and
    // arrival order is exactly what differs between machines.
    const ids = ['zoe', 'amir', 'kit', 'bea'];
    const ls = ids.map(id => new Lobby({ transport: hub.peer(id), room: 'mm-parlour' }));
    const want = [...ids].sort();

    check(ls.every(l => l.players.length === 4), 'every client sees all four players',
      ls.map(l => l.players.length).join('/'));
    check(ls.every(l => l.players.map(p => p.id).join(',') === want.join(',')),
      'and every client sorts them into the SAME order', want.join(','));
    check(ls.map(l => l.seat).join(',') === ids.map(id => want.indexOf(id)).join(','),
      'each client works out its own seat with no message about it',
      ls.map((l, i) => `${ids[i]}=${l.seat}`).join(' '));
    check(new Set(ls.map(l => l.seat)).size === 4, 'and no two clients claim the same seat');
    check(ls.filter(l => l.isHost).length === 1, 'exactly one of them is the host');
    check(ls.every(l => l.hostId === want[0]), 'and all four name the same one', want[0]);

    /* The seed is DERIVED, not proposed and agreed. `Session` already reports a
       seed mismatch at hello; this makes the mismatch impossible instead. */
    check(new Set(ls.map(l => l.seed)).size === 1, 'all four derive one seed from the room code',
      String(ls[0].seed));
    check(seedFromRoom('mm-parlour') === seedFromRoom('mm-parlour')
       && seedFromRoom('mm-parlour') !== seedFromRoom('mm-cellar'),
      'and a different room is a different run');
    check(seedFromRoom('') !== 0, 'the empty room still gets a usable seed, not 0',
      String(seedFromRoom('')));

    // Choices cross, and a Kid change un-readies you.
    ls.forEach((l, i) => l.setChoice({ companion: ['marmalade', 'bones', 'pipkin', 'taffy'][i],
                                       kid: ['maya', 'eli', 'amina', 'jordan'][i] }));
    check(ls[0].players.every(p => p.companion && p.kid),
      'every client learns what everybody else brought');
    check(!ls.every(l => l.allReady), 'and nobody is ready until they say so');
    ls.forEach(l => l.setReady(true));
    check(ls.every(l => l.allReady), 'once they all lock in, every client agrees they are ready');
    ls[2].setChoice({ kid: 'lena' });
    check(!ls[0].allReady, 'and changing your Kid un-readies you, on everybody\'s screen');
    ls[2].setReady(true);

    /* Every client calls `start()` and every client computes the same roster —
       nothing is sent to agree it. `GO` only tells the others to call it too. */
    const rosters = ls.map(l => l.start());
    check(rosters.every(r => r.seats === 4), 'the frozen roster has four seats');
    check(new Set(rosters.map(r => r.party.map(p => `${p.companion}/${p.kid}`).join('|'))).size === 1,
      'and every client froze the SAME party, in the same seat order',
      rosters[0].party.map(p => p.kid).join(','));
    check(rosters.filter(r => r.host).length === 1, 'with one host in it');
    check(rosters.every(r => r.seed === ls[0].seed), 'and the one seed');
    check(rosters.every((r, i) => r.party[r.seat].kid === ls[i].me.kid),
      'each client\'s own seat really holds its own Kid');

    /* A late arrival is not a fifth Kid — and the id is 'aaa' ON PURPOSE,
       because it sorts BEFORE every seat already at the table. An id that sorts
       last cannot renumber anybody, so testing with one proves nothing: the
       first version used 'zzz' and stayed green with the freeze removed. */
    const seatsWere = ls.map(l => l.seat);
    const late = new Lobby({ transport: hub.peer('aaa'), room: 'mm-parlour' });
    check(ls[0].start().seats === 4, 'somebody arriving after the start does NOT renumber the seats',
      String(ls[0].start().seats));
    check(ls[0].roster.ids.indexOf('aaa') === -1, 'and is not in the frozen roster');
    check(ls.map(l => l.seat).join(',') === seatsWere.join(','),
      'and nobody\'s LIVE seat moved either, though that id sorts first',
      `${seatsWere.join(',')} -> ${ls.map(l => l.seat).join(',')}`);
    check(ls.every(l => l.players.length === 4), 'the room stopped listening when it started',
      ls.map(l => l.players.length).join('/'));
    late.close();
    for (const l of ls) l.close();
    hub.close();
  }

  // ══ 13. The lobby caps at MAX_PARTY, and reads it ══════════════════════
  {
    const hub = new LoopbackHub();
    const ids = ['a', 'b', 'c', 'd', 'e', 'f'];
    const ls = ids.map(id => new Lobby({ transport: hub.peer(id), room: 'mm-crowd' }));
    check(ls[0].seats === MAX_PARTY, 'six people in the room still make a party of MAX_PARTY',
      `${ls[0].seats} of ${ls[0].players.length}`);
    check(ls[5].seat === -1, 'and the ones past the cap have no seat rather than seat 4',
      String(ls[5].seat));
    check(ls[0].isFull, 'the room reports itself full');
    const r = ls[0].start();
    check(r.party.length === MAX_PARTY, 'the frozen party is MAX_PARTY long', String(r.party.length));
    for (const l of ls) l.close();
    hub.close();
  }

  // ══ 14. Two real tabs agree on the same seats ══════════════════════════
  /* A LoopbackHub delivers synchronously and cannot show a lobby racing itself.
     `BroadcastChannel` is a genuine asynchronous wire between two independent
     contexts, which is where "who is here yet" actually goes wrong. */
  {
    if (canChannel()) {
      const room = 'mm-lobby-' + Math.random().toString(36).slice(2);
      const A = new Lobby({ transport: new ChannelTransport(room, 'tab-b'), room });
      await new Promise(r => setTimeout(r, 60));
      const B = new Lobby({ transport: new ChannelTransport(room, 'tab-a'), room });
      await new Promise(r => setTimeout(r, 200));

      check(A.players.length === 2 && B.players.length === 2,
        'the tab already sitting there learns about the newcomer, and vice versa',
        `${A.players.length} / ${B.players.length}`);
      /* 'tab-a' connected SECOND and is seat 0, because seats come from the
         sorted ids and never from arrival. This is the check that would catch
         somebody "fixing" it to first-come. */
      check(B.seat === 0 && A.seat === 1,
        'the tab that arrived SECOND is seat 0, because ids sort and arrivals do not',
        `tab-a=${B.seat} tab-b=${A.seat}`);
      check(A.hostId === B.hostId && A.hostId === 'tab-a',
        'and both tabs name the same host', String(A.hostId));
      check(A.seed === B.seed, 'both derived the same seed from the room code');

      A.setChoice({ companion: 'marmalade', kid: 'maya' });
      B.setChoice({ companion: 'bones', kid: 'eli' });
      await new Promise(r => setTimeout(r, 200));
      const ra = A.start(), rb = B.start();
      check(ra.party.map(p => p.kid).join(',') === rb.party.map(p => p.kid).join(','),
        'and both froze the same party across a real wire',
        ra.party.map(p => p.kid).join(','));
      A.close(); B.close();
      A.transport.close(); B.transport.close();
    }
  }

  // ══ 15. A choice reaches the player whose choice it is ═════════════════
  /* The seat-addressed fallback is the correct LOCAL behaviour and stays. Over
     a wire the answer can be the real one — and the thing that makes it hard is
     that `ask()` is awaited from INSIDE an input the queue is applying, so the
     answer cannot be queued behind it. */
  {
    const hub = new LoopbackHub({ async: true });
    const client = (seat, id) => {
      const deck = startingDeckFor('marmalade');
      const e = makeDummyParty(new RNG(SEED), 2, { companion: 'marmalade', decks: [deck.slice(), deck.slice()], maxHp: 70 });
      e.setTrackerInstaller(installTrackers);
      e.localSeat = seat;
      const run = { combat: e, _combatDigest: combatDigest, localSeat: seat, session: null,
                    kids: [{}, {}], asSeat: Run.prototype.asSeat };
      const session = new Session({ transport: hub.peer(id), seat, seats: 2, seed: SEED, host: seat === 0 });
      attachActions(session, run);
      attachChoices(session, e);
      return { e, run, session };
    };
    const A = client(0, 'A'); const B = client(1, 'B');
    await A.e.startCombat(); await B.e.startCombat();

    // Only seat 1's client has a picker, and it always takes the LAST option —
    // which the deterministic rule never would, so a board that shows it is a
    // board that really used the answer.
    let asked = 0;
    B.e.setChoiceResolver(async (req) => { asked++; return [req.pool.length - 1]; });
    let askedOnA = 0;
    A.e.setChoiceResolver(async () => { askedOnA++; return [0]; });

    const pool = () => A.e.players[1].piles.hand.slice(0, 3);
    const ask = (e) => e.choices.ask({
      kind: 'card', prompt: 'Choose', count: 1,
      pool: e.players[1].piles.hand.slice(0, 3), seat: e.players[1],
    });
    const [pa, pb] = await Promise.all([ask(A.e), ask(B.e)]);

    check(asked === 1, 'the picker opened on the client whose seat it is, once', String(asked));
    check(askedOnA === 0, 'and NOT on the other one, which has no business answering it',
      String(askedOnA));
    check(pa.join(',') === pb.join(','), 'both clients resolved it the same way',
      `${pa.join(',')} / ${pb.join(',')}`);
    check(pa.join(',') === '2', 'with the answer the PLAYER gave, not the deterministic rule',
      pa.join(','));
    check(A.e.choiceLog.length === 1 && B.e.choiceLog.length === 1,
      'and it is one entry in both choice logs',
      `${A.e.choiceLog.length} / ${B.e.choiceLog.length}`);
    check(A.e.choiceLog[0].seat === 1 && B.e.choiceLog[0].seat === 1,
      'logged against the seat it belonged to, so a replay can tell them apart');

    /* An UNADDRESSED request is the one that would quietly desync: it means
       "whoever is driving", and over a wire all four clients are driving. */
    let a2 = 0, b2 = 0;
    A.e.setChoiceResolver(async (req) => { a2++; return [req.pool.length - 1]; });
    B.e.setChoiceResolver(async () => { b2++; return [0]; });
    const anyAsk = (e) => e._asSeat(e.players[0], () => e.choices.ask({
      kind: 'card', prompt: 'Any', count: 1, pool: e.players[0].piles.hand.slice(0, 3),
    }));
    const [ua, ub] = await Promise.all([anyAsk(A.e), anyAsk(B.e)]);
    check(a2 === 1 && b2 === 0,
      'an unaddressed request is answered by whoever is ACTING, and only them',
      `A ${a2} / B ${b2}`);
    check(ua.join(',') === ub.join(',') && ua.join(',') === '2',
      'so both clients take the same answer instead of one each',
      `${ua.join(',')} / ${ub.join(',')}`);

    /* An answer can arrive before the question: a fast peer, or a rejoining
       client absorbing a log full of answers before it replays the plays that
       ask them. Without the store, the replay hangs on the first one. */
    let a3 = 0;
    A.e.setChoiceResolver(async () => { a3++; return [0]; });
    B.session.input({ t: INPUT.CHOICE, seq2: A.e.choices._askSeq, forSeat: 1, picked: [1] });
    await new Promise(r => setTimeout(r, 40));
    const early = await A.e.choices.ask({
      kind: 'card', prompt: 'Late', count: 1,
      pool: A.e.players[1].piles.hand.slice(0, 3), seat: A.e.players[1],
    });
    check(early.join(',') === '1', 'an answer that arrived FIRST is waiting when the question does',
      early.join(','));
    check(a3 === 0, 'and no picker opened for a question already answered', String(a3));

    A.session.close(); B.session.close();
  }

  // ══ 16. The deadlock: a choice raised INSIDE an input ══════════════════
  /* Every check above calls `ask()` from the outside, which is not where a card
     asks. A card asks from inside its own effect, which is inside an input the
     session's queue is applying — so if the ANSWER is queued too, the play
     cannot finish until the answer arrives and the answer cannot be applied
     until the play finishes. Neither ever happens. That is why
     `session._accept` routes a CHOICE out of band, and this is the check that
     fails if anybody puts it back in the queue. */
  {
    const hub = new LoopbackHub({ async: true });
    const client = (seat, id) => {
      const deck = startingDeckFor('marmalade');
      const e = makeDummyParty(new RNG(SEED), 2, { companion: 'marmalade', decks: [deck.slice(), deck.slice()], maxHp: 70 });
      e.setTrackerInstaller(installTrackers);
      e.localSeat = seat;
      const run = { combat: e, _combatDigest: combatDigest, localSeat: seat, session: null,
                    kids: [{}, {}], asSeat: Run.prototype.asSeat };
      const session = new Session({ transport: hub.peer(id), seat, seats: 2, seed: SEED, host: seat === 0 });
      session.attach(run);
      attachChoices(session, e);
      /* The applier is the TEST's, not `attachActions`': this is about the
         choice path, and a made-up verb reaching the real applier would only
         earn a console error about an unknown act. */
      session.on('input', async (msg) => {
        if (msg.t !== INPUT.ROOM) return;
        msg.answer = await e.choices.ask({
          kind: 'card', prompt: 'Mid-input', count: 1,
          pool: e.players[1].piles.hand.slice(0, 3), seat: e.players[1],
        });
      });
      return { e, run, session };
    };
    const A = client(0, 'A'); const B = client(1, 'B');
    await A.e.startCombat(); await B.e.startCombat();
    B.e.setChoiceResolver(async (req) => [req.pool.length - 1]);

    A.session.input({ t: INPUT.ROOM, act: 'test.ask' });
    const settled = Promise.all([A.session.settled(), B.session.settled()]).then(() => 'done');
    const raced = await Promise.race([
      settled,
      new Promise(r => setTimeout(() => r('DEADLOCK'), 2000)),
    ]);
    check(raced === 'done', 'a choice raised inside an applied input still resolves', String(raced));
    if (raced === 'done') {
      const la = A.session.log.filter(m => m.t === INPUT.ROOM)[0];
      const lb = B.session.log.filter(m => m.t === INPUT.ROOM)[0];
      check(la && lb && (la.answer || []).join(',') === (lb.answer || []).join(','),
        'and both clients came out of it with the same answer',
        `${(la && la.answer || []).join(',')} / ${(lb && lb.answer || []).join(',')}`);
      check((la.answer || []).join(',') === '2',
        'which is the one the owning seat\'s picker gave', (la.answer || []).join(','));
      check(A.session.log.some(m => m.t === INPUT.CHOICE),
        'the answer is in the log, in its place, because a rejoin replays it');
    }
    A.session.close(); B.session.close();
  }

  // ══ 17. A rejoin whose log contains a choice ═══════════════════════════
  /* §16 proves the live path. This is the one that actually bites: a client
     that was away comes back and absorbs a log holding both the play that ASKS
     and the answer, and it has to replay them without opening a picker for a
     question that was settled while it was gone. */
  {
    const hub = new LoopbackHub({ async: true });
    const mk = (seat, id) => {
      const deck = startingDeckFor('marmalade');
      const e = makeDummyParty(new RNG(SEED), 2, { companion: 'marmalade', decks: [deck.slice(), deck.slice()], maxHp: 70 });
      e.setTrackerInstaller(installTrackers);
      e.localSeat = seat;
      const run = { combat: e, _combatDigest: combatDigest, localSeat: seat, session: null,
                    kids: [{}, {}], asSeat: Run.prototype.asSeat };
      const session = new Session({ transport: hub.peer(id), seat, seats: 2, seed: SEED, host: seat === 0 });
      session.attach(run);
      attachChoices(session, e);
      const seen = [];
      session.on('input', async (msg) => {
        if (msg.t !== INPUT.ROOM) return;
        seen.push(await e.choices.ask({
          kind: 'card', prompt: 'Rejoin', count: 1,
          pool: e.players[1].piles.hand.slice(0, 3), seat: e.players[1],
        }));
      });
      return { e, run, session, seen };
    };
    const A = mk(0, 'A'); const B = mk(1, 'B');
    await A.e.startCombat(); await B.e.startCombat();
    B.e.setChoiceResolver(async (req) => [req.pool.length - 1]);

    A.session.input({ t: INPUT.ROOM, act: 'test.ask' });
    await new Promise(r => setTimeout(r, 200));
    await A.session.settled(); await B.session.settled();
    check(A.seen.length === 1 && A.seen[0].join(',') === '2',
      'the two that were present settled it between them', (A.seen[0] || []).join(','));

    // Somebody who was away the whole time.
    const C = mk(0, 'C');
    await C.e.startCombat();
    let pickerOpened = 0;
    C.e.setChoiceResolver(async () => { pickerOpened++; return [0]; });
    C.session.absorb(A.session.log);
    const done = await Promise.race([
      C.session.settled().then(() => 'done'),
      new Promise(r => setTimeout(() => r('HUNG'), 2000)),
    ]);
    check(done === 'done', 'a rejoining client replays a log with a choice in it', String(done));
    check(C.seen.length === 1 && C.seen[0].join(',') === '2',
      'and reaches the SAME answer the other two agreed on',
      (C.seen[0] || []).join(','));
    check(pickerOpened === 0,
      'without opening a picker for a question settled while it was away',
      String(pickerOpened));

    A.session.close(); B.session.close(); C.session.close();
  }

  // ══ 18. Without a session, `act` is the direct call it replaced ════════
  /* Solo and pass-and-play must not pay for the wire. `act()` returns the run
     layer's own answer synchronously when there is nothing to send, so a screen
     that used to call `run.takeRewardCard()` keeps the timing it had. */
  {
    const run = Run.mock({ seed: SEED, kids: [{ companion: 'marmalade', kid: 'maya' }] });
    run.currentNodeId = 'x-bigscare';
    run._prepareReward({ id: 'x-bigscare' }, 'bigScare', { navigate: false });
    const want = run.pendingReward.cards[0].id;
    const before = run.deck.length;
    const added = act(run, { t: INPUT.ROOM, act: ACT.REWARD_TAKE, index: 0 });
    check(added && typeof added.then !== 'function',
      'with no session the answer comes back at once, not as a promise');
    check(added && added.id === want, 'and it is the card the run layer added', want);
    check(run.deck.length === before + 1, 'which really went into the deck',
      `${before} -> ${run.deck.length}`);
  }
} catch (err) {
  fails.push('THREW: ' + (err && err.stack || err));
}

say(`<h2>${passes.length} passed, ${fails.length} failed</h2>`, fails.length ? 'fail' : 'pass');
say('<ul class="pass">' + passes.map(p => `<li>PASS ${p}</li>`).join('') + '</ul>');
if (fails.length) say('<ul class="fail">' + fails.map(f => `<li>FAIL ${f}</li>`).join('') + '</ul>');
window.__RESULT = { passed: passes.length, failed: fails.length, fails, passes, expectedErrors };
window.__DONE = true;
</script>
