<!doctype html>
<meta charset="utf-8">
<title>Upgrades that change nothing in play</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; background: #14121a; color: #d8d4e0; padding: 20px; }
  .pass { color: #7fd08a; } .fail { color: #ff8080; } .dim { color: #8a839c; }
  h2 { color: #c9a9ff; margin: 18px 0 6px; }
  .dead { color: #ffcf7f; }
</style>
<h1>Upgrade effects</h1>
<div class="dim">every playable Trick played base and upgraded in a real fight, and the two boards compared</div>
<div id="out"></div>
<script type="module">
/**
 * AN UPGRADE THAT CHANGES A NUMBER NOBODY READS.
 *
 * tests/cards already errors when an upgrade changes nothing in the DEF. The
 * common defect is one layer down: the def changes nums, and no code reads
 * them. A Power hook hardcodes its value, an Afterglow or an Epitaph resolves
 * with no card attached so N(c) is empty, or the upgrade only rewrote the text.
 * The 2026-09-11 card cost pass catalogued roughly forty of these across the
 * sixteen decks by reading the code, and no gate could see one of them.
 *
 * So this plays the thing. Each Trick is played twice from the SAME seed onto
 * the same seeded board, once base and once upgraded, each play followed by two
 * whole turns so Powers, hooks, timers and next-turn effects land. Then the two
 * boards are compared: enemy Courage, Guard and statuses, the Kid's Courage,
 * Guard, Nerve, statuses and counters, every pile size, the timers and the
 * objects on the table. Identical boards AND an identical cost means the
 * upgrade did nothing anybody could see.
 *
 * REPORT-ONLY on purpose. The list is long today, so the exit code is about the
 * gate's own health: a card it cannot instantiate, or a WAIVED entry that has
 * started to differ. Wire it to fail on the list itself once the list is empty.
 *
 * A dummy board cannot reach every condition, so an upgrade can be alive and
 * still land here: a threshold this fight never crosses, a pile it never fills.
 * Those go in WAIVED with a reason, and a waiver that starts showing a
 * difference FAILS, because a control that cannot fail is not a control.
 */
import { RNG } from '../../game/src/core/rng.js';
import { CombatEngine } from '../../game/src/combat/engine.js';
import { makeDummySetup } from '../../game/src/combat/dummy.js';
import { installTrackers } from '../../game/src/data/companions/_util.js';
import * as CARDS from '../../game/src/data/cards.js';

const SEED = 20260911;
const TURNS_AFTER = 2;
const SEED_COUNTERS = [['lives', 9], ['loose-bones', 3], ['height', 2], ['plump', 2],
  ['globs', 3], ['open-eyes', 3], ['patience', 2], ['stretch', 2], ['forecast', 2]];
const SEED_ENEMY_STATUS = [['haunt', 6], ['web', 6], ['weak', 1]];

/** id -> why a dummy fight cannot show this upgrade. Checked in BOTH directions. */
/* WAIVERS, group 1 (drizzle, brambleboo, the shared pool): [id, 'why this board cannot show it'] */
const WAIVED_G1 = [
];
/* ------------------------------------------------------------------ */
/* WAIVERS, group 2 (pipkin, boggle, crinkle, hush): [id, 'why this board cannot show it'] */
const WAIVED_G2 = [
];
/* ------------------------------------------------------------------ */
/* WAIVERS, group 3 (mossbit, wink, wisp, mopsy): [id, 'why this board cannot show it'] */
const WAIVED_G3 = [
  // Mossbit. Buried Harm is tracker state, not a counter, and the first enemy turn here is ONE 6-damage Puff.
  ['mossbit/not-yet', 'the only hit in reach is a 6 Puff, under both caps; three 15s bury 8 vs 13'],
  ['mossbit/put-it-off', 'the only hit in reach is a 6 Puff, under both caps; three 15s bury 14 vs 20'],
  ['mossbit/take-the-hit-later', 'the only hit in reach is a 6 Puff, under both caps; three 15s bury 24 vs 32'],
  ['mossbit/emergency-burial', 'one enemy hit in reach; three 15s bury one hit (15) vs two (30)'],
  ['mossbit/steady-little-heart', 'no Buried Harm on this board; at 12 Harm it leaves 2 and no Guard vs clears it for 8 Guard'],
  ['mossbit/weight-to-words', 'no Buried Harm on this board; at 20 Harm it moves 12 vs 18 into the Epitaph'],
  ['mossbit/carry-it-properly', 'no Buried Harm on this board; at 20 Harm it draws 2 vs 3 and takes off 10 vs 14'],
  ['mossbit/monument-to-small-things', 'no Buried Harm to clear here; clearing it banks +2 vs +3 on later Epitaphs'],
  ['mossbit/deep-inscription', 'Epitaph 3 lands on turn 4, past the two turns played; it then draws 4 vs 5 and pays 1 vs 2 Nerve'],
  ['mossbit/set-in-stone', 'its Epitaphs take 1 longer and land past the window; Written in Stone then deals 21 vs 24'],
  ['mossbit/moss-grows-anyway', 'no Epitaph resolves on its own in the window; with Written in Stone it gives 9 vs 13 Guard'],
  ['mossbit/grave-moss', 'nothing is Erased here; Scratch It Out on an Epitaph then gives 13 vs 18 Guard'],
  ['mossbit/geological-patience', 'needs full Patience AND a natural Epitaph; then the overflow is 6 vs 10 to all and Guard'],
  ['mossbit/weatherproofing', 'no Weathering Tricks in hand; with three it ticks 2 vs 3 of them'],
  ['mossbit/turn-to-stone', 'it shrinks the NEXT hand (3 vs 4 cards), which no reading here takes'],
  // Wink. Preview depth, Reads and Sets are tracker state the snapshot does not read.
  ['wink/peek-around-the-corner', 'Preview depth is not in the snapshot; it reveals 1 vs 2'],
  ['wink/read-the-room', 'Preview depth is not in the snapshot; it reveals 1 vs 2 on every enemy'],
  ['wink/three-steps-ahead', 'Preview depth is not in the snapshot; next turn it reveals 1 vs 2'],
  ['wink/ceiling-survey', 'the seeded 6 Web clears both thresholds; at 2 Web it reveals 1 vs 2'],
  ['wink/double-check', 'its two revealed Intents here differ in family; where they match it Opens 1 vs 2 Eyes'],
  ['wink/red-string-theory', 'no enemy is Previewed here; after a Peek, 3 Nerve applies 6 vs 9 Web'],
  ['wink/controlled-panic', 'never two Attacks in a row here; on the Bunny at Scatter->Puff it gives 16/3 vs 21/4 Guard/Web'],
  ['wink/lampshade-lookout', 'its draw lands in the NEXT hand (7 vs 8 cards), which no reading here takes'],
  ['wink/false-floor', 'nothing Reorders here; Stall the Bad Part on its enemy then deals 22 vs 30'],
  ['wink/loom-logic', 'nothing Reorders here; Stall the Bad Part then puts 2 vs 3 Web on the other enemy'],
  ['wink/extra-corner', 'never 4 Sets at once here; with six it holds 4 vs 5'],
  ['wink/i-meant-that-one', 'no failing Read to rescue here; a rescued Read then closes 2 vs 1 Eyes (tests/wink)'],
  ['wink/telltale-twitch', 'no Read succeeds in the window; tests/wink proves the Web it pays moves with the upgrade'],
  ['wink/pattern-library', 'no Read succeeds in the window; tests/wink proves the draw moves with the upgrade'],
  ['wink/the-house-has-tells', 'no enemy here changes its mind with the queue still; tests/wink proves 1 vs 2 Eyes'],
  // Wisp. The Gloaming is empty when the Trick is played, and Glow sits at 3.
  ['wisp/not-yet', 'nothing Lingering to Hasten; with one it lands and gives 4 vs 7 Guard'],
  ['wisp/still-here', 'nothing Lingering; with two it gives 12 vs 16 Guard'],
  ['wisp/orbiting-sparks', 'the Gloaming is empty; with two it deals 14 vs 20'],
  ['wisp/cut-the-wait', 'nothing Lingering; with three at 1 it lands 2 vs 3 and draws 1 vs 2'],
  ['wisp/all-at-once', 'nothing Lingering; with two at 1 it regains 1 vs 2 Nerve'],
  ['wisp/stop-the-clocks', 'nothing Lingering; with two it gives 8 vs 12 Guard'],
  ['wisp/gentle-landing', 'no Afterglow before the next turn here; one Hastened gives 4 vs 6 Guard'],
  ['wisp/constellation-practice', 'no Convergence here; two landing together draw 1 vs 2'],
  ['wisp/small-orbit', 'the 1-cost top card floors at 0 both ways; a 2-cost one comes back at 1 vs 0'],
  ['wisp/glow-bank', 'the seeded 3 Glow caps both at 6; from 0 it gains 3 vs 4, with a Linger 4 vs 5'],
  ['wisp/never-goes-out', 'no Glow is spent in the window; spending 1 refunds 1 vs 2, spending 3 refunds 2 vs 3'],
  ['wisp/start-over-small', 'needs 8+ Glow (Bigger Than a Nightlight) to Hasten past 3; there it Hastens 3 vs 4'],
  ['wisp/count-with-me', 'pays a FRIEND; in a two-Kid party the friend draws 1 vs 2 and gains 6 vs 9 Guard'],
  ['wisp/make-a-constellation', 'pays FRIENDS; in a two-Kid party the friend draws 1 vs 2 and gains 10 vs 14 Guard'],
  // Mopsy. Stuffing is seeded at 3, and nothing in hand carries a Patch.
  ['mopsy/inside-out', 'at 3 Stuffing it flips to 3, neither Plump nor Hollow; from 0 it draws 3 vs 4, from 6 Guard 16 vs 22'],
  ['mopsy/turn-me-inside-out', 'at 3 Stuffing it flips to 3; from 0 it draws 2 vs 3, from 6 Guard 10 vs 14'],
  ['mopsy/neat-hem', 'no Patch in hand; on one it Reinforces to 3 vs 4 Stitches'],
  ['mopsy/two-good-stitches', 'no Patch triggers here; three patched plays keep 2 vs 3 Stitches'],
  ['mopsy/cushion-fort', 'one hit in reach, so one Cushion; four hits refund 2 vs 3 Stuffing next turn'],
  ['mopsy/held-together-by-love', 'nothing lethal here; a killing blow leaves 1 Courage and draws 2 vs 3 next turn'],
  ['mopsy/family-quilt', 'pays FRIENDS; a friend playing a Patched Trick gives Mopsy 1 vs 2 Stuffing'],
  ['mopsy/bunny-pile', 'one Kid here; in a party of four with 6 Stuffing it Cushions 3 vs 4 Kids'],
];
/* ------------------------------------------------------------------ */
/* WAIVERS, group 4 (crumbula, bones, taffy, truffle, marmalade, pudding): [id, 'why this board cannot show it'] */
const WAIVED_G4 = [
];
/* ------------------------------------------------------------------ */
const WAIVED = new Map([...WAIVED_G1, ...WAIVED_G2, ...WAIVED_G3, ...WAIVED_G4]);

const out = document.getElementById('out');
const say = (html, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; out.appendChild(d); };

function buildEngine(slug) {
  const deck = CARDS.companion(slug) ? CARDS.startingDeckFor(slug) : CARDS.sharedPool().slice(0, 8);
  return new CombatEngine(makeDummySetup(new RNG(SEED), { companion: slug, deck: deck.length ? deck : CARDS.sharedPool() }));
}

/** Everything one play can move, flattened. Same seed on both sides, so a
 *  difference is the card and SAMENESS is the finding. */
function snapshot(e) {
  const st = (a) => [...a.statuses].map(([k, v]) => k + ':' + v).sort().join(' ');
  const bodies = [...e.enemies, ...(e.allies || [])]
    .map(x => [x.id, x.hp, x.block, x.alive ? 1 : 0, st(x)].join('/')).join(' | ');
  const counters = [...e.counters.values()].map(c => c.id + ':' + e.counter(c.id)).sort().join(' ');
  const piles = ['hand', 'draw', 'discard', 'exhaust', 'stash', 'limbo']
    .map(n => n + '=' + ((e.piles && e.piles[n]) || []).length).join(' ');
  const p = e.player;
  return [bodies, 'hp' + p.hp, 'guard' + p.block, 'nerve' + p.energy, st(p), counters, piles,
    'timers' + ((e.timers || []).length), 'objects' + ((e.objects || []).length)].join(' # ');
}

async function playOnce(def, upgraded) {
  const e = buildEngine(def.companion);
  await e.startCombat();
  installTrackers(e, def.companion);
  // Bodies that cannot die: a kill ends the fight and truncates the comparison,
  // and the DIFFERENCE in damage is exactly what has to stay visible.
  for (const x of e.enemies) { x.maxHp = 9999; x.hp = 9999; }
  /* EVERY declared counter, not a hand-written six: a Companion's upgrade
     usually pays off through their own track (Quills, Glow, Creases, Paper,
     Lurk, Loyalty, Patience), and a track sitting at 0 hides the difference. */
  for (const c of e.counters.values()) {
    const want = Math.min(c.max === undefined ? 3 : c.max, 3);
    if (want > (c.min || 0)) e.setCounter(c.id, want, 'test');
  }
  for (const [id, v] of SEED_COUNTERS) if (e.counters.has(id)) e.setCounter(id, v, 'test');
  const t = e.livingEnemies()[0];
  if (t) for (const [id, v] of SEED_ENEMY_STATUS) e.applyStatus(t, id, v);

  /* A turn that has already started. "Gain {b} Guard for each Trick you
     discarded this turn" is 5x0 and 7x0 on an untouched board, and "the first
     Trick each turn" never fires if this is the first. One ordinary play and
     one discard first -- identical on both sides -- give those a foothold. */
  const warm = e.piles.hand[0];
  if (warm) {
    e.player.energy = 9;
    const chk = e.canPlay(warm.uid, t && t.id);
    if (!chk || chk.ok !== false) {
      try { await e.playCard(warm.uid, warm.target === 'enemy' ? (t && t.id) : undefined); } catch (_) { /* affordability */ }
    }
  }
  const spare = e.piles.hand[0];
  if (spare) { try { e.moveCard(spare, 'discard', { reason: 'test' }); } catch (_) { /* pile guard */ } }

  const made = e.addCard(def, 'hand', { upgraded });
  const card = Array.isArray(made) ? made[0] : made;
  if (!card) return null;

  /* THREE readings, not one. Guard is wiped at the start of the next turn and
     the hand is re-dealt, so a board read only at the end cannot see Curl Up's
     extra Guard or an extra card drawn: the first draft of this gate called 600
     upgrades dead on exactly that. So: the board the moment the play resolves,
     a running tally of what the fight EMITTED (damage, Guard, healing, status
     stacks - which survives the wipe), and the board two turns later for
     anything delayed. */
  const tally = { dmg: 0, hits: 0, block: 0, heal: 0, status: 0 };
  const amt = (ev) => ((ev && ev.amount) || 0);
  e.on('damage', (ev) => { tally.dmg += amt(ev); tally.hits += 1; });
  e.on('block', (ev) => { tally.block += amt(ev); });
  e.on('heal', (ev) => { tally.heal += amt(ev); });
  e.on('status', (ev) => { tally.status += Math.abs((ev && ev.delta) || 0); });

  e.player.energy = 9;
  const cost = e.costOf(card);
  let threw = '';
  try {
    await e.playCard(card.uid, def.target === 'enemy' ? (t && t.id) : undefined);
  } catch (err) { threw = String((err && err.message) || err); }
  /* `canPlay` refuses a Trick this board cannot play at all -- Ambush from a
     Pocket that is empty, a Buried Trick, a Paper Copy with no Paper -- and
     `playCard` then does nothing, which makes base and upgraded identical for
     a reason that has nothing to do with the upgrade. Those are counted apart. */
  const played = !((e.piles.hand || []).includes(card));
  const onPlay = snapshot(e);
  /* A Power buffs what you play NEXT. Playing nothing after it means "your
     Attacks deal 2 more" and "your Attacks deal 3 more" end the fight on
     identical boards, so two ordinary Tricks are played each turn afterwards -
     same hand, same order, both sides - and the Power shows up in the damage. */
  for (let i = 0; i < TURNS_AFTER && !e.over; i++) {
    e.player.energy = 9;
    for (const k of e.piles.hand.slice(0, 2)) {
      const chk = e.canPlay(k.uid, t && t.id);
      if (chk && chk.ok === false) continue;
      try { await e.playCard(k.uid, k.target === 'enemy' ? (t && t.id) : undefined); }
      catch (err) { if (!threw) threw = String((err && err.message) || err); }
      if (e.over) break;
    }
    e.player.energy = 9;
    try { await e.endTurn(); } catch (err) { if (!threw) threw = String((err && err.message) || err); }
  }
  const emitted = ['dmg' + tally.dmg, 'hits' + tally.hits, 'guard' + tally.block,
    'heal' + tally.heal, 'status' + tally.status].join(' ');
  return { cost, played, snap: onPlay + ' || ' + emitted + ' || ' + snapshot(e), threw };
}

/* A card's own source text, so the report can tell "dead" from "this board
   could not ask the question". `def.effect` is wrapped in `eff()`, so reading
   the function back gives the wrapper; the module text gives the card. */
const SRC = new Map();
async function sourceFor(slug) {
  // Neutral Tricks live in data/neutral.js, not companions/: asking for
  // companions/neutral.js is a 404 in the console and a red gate.
  if (!slug || !CARDS.companion(slug)) return '';
  if (!SRC.has(slug)) {
    try {
      const r = await fetch('/game/src/data/companions/' + slug + '.js');
      SRC.set(slug, r.ok ? await r.text() : '');
    } catch (_) { SRC.set(slug, ''); }
  }
  return SRC.get(slug);
}
function literalOf(text, id) {
  const at = text.indexOf("id: '" + id + "'");
  if (at < 0) return '';
  const next = text.indexOf("id: '", at + 5);
  return text.slice(at, next < 0 ? text.length : next);
}

/** What the upgrade SAYS it changes, for the report. */
function claim(def) {
  const u = def.upgrade || {};
  const nums = def.nums || {};
  const bits = [];
  for (const k of Object.keys(u.nums || {})) if (u.nums[k] !== nums[k]) bits.push(k + ' ' + nums[k] + '->' + u.nums[k]);
  if ('cost' in u && u.cost !== def.cost) bits.push('cost ' + def.cost + '->' + u.cost);
  if (u.text && u.text !== def.text) bits.push('new text');
  for (const k of ['exhaust', 'retain', 'innate', 'ethereal', 'target', 'type']) {
    if (k in u && u[k] !== def[k]) bits.push(k + ' ' + def[k] + '->' + u[k]);
  }
  return bits.join(', ') || 'nothing in the def';
}

(async () => {
  const all = CARDS.allCards().filter(c =>
    !['status', 'curse'].includes(c.type) && !['curse', 'special'].includes(c.rarity) && c.upgrade);
  const dead = [], broken = [], staleWaivers = [], unplayed = [], needsParty = [], choices = [];
  let checked = 0;
  /* This board is one Kid. A Trick that pays a FRIEND cannot show a difference
     here however big its upgrade is, so those are counted apart rather than
     called dead - a gate that lists cards it cannot judge is trap 54 waiting. */
  const PARTY = /friend|teammate|\bally\b|another Kid|other Kid|each Kid|every Kid|party/i;
  const CHOICE = /chooseOne|pickCards|pickEpitaph|pickHand|askRead/;

  for (const def of all) {
    const a = await playOnce(def, false);
    const b = await playOnce(def, true);
    if (!a || !b) { broken.push(def.id + ': the engine could not instantiate it'); continue; }
    if (!a.played || !b.played) { unplayed.push(def.id); continue; }
    const identical = a.snap === b.snap && a.cost === b.cost;
    if (identical && PARTY.test(def.text || '')) { needsParty.push(def.id); continue; }
    /* A chooser takes the FIRST option here, so an upgrade that only improves
       the third branch cannot show. Spend a Life is the shape: its upgrade
       moves draw, Ghoststep and Guard, and the resolver always takes Nerve. */
    if (identical && CHOICE.test(literalOf(await sourceFor(def.companion), def.id))) {
      choices.push(def.id);
      continue;
    }
    checked++;
    const same = a.snap === b.snap && a.cost === b.cost;
    const waived = WAIVED.get(def.id);
    if (same && !waived) dead.push({ id: def.id, comp: def.companion || 'neutral', claim: claim(def), threw: a.threw || b.threw });
    if (!same && waived) staleWaivers.push(def.id + ' waived as "' + waived + '", but it DOES differ now');
  }

  const byComp = new Map();
  for (const d of dead) { if (!byComp.has(d.comp)) byComp.set(d.comp, []); byComp.get(d.comp).push(d); }
  say('<h2>' + dead.length + ' of ' + checked + ' upgrades moved nothing a dummy fight can see</h2>', dead.length ? 'dead' : 'pass');
  for (const [comp, list] of [...byComp].sort()) {
    say('<b>' + comp + '</b> (' + list.length + ')', 'dead');
    for (const d of list) say('&nbsp;&nbsp;' + d.id + ' - upgrade says: ' + d.claim + (d.threw ? ' - THREW: ' + d.threw : ''), 'dim');
  }
  for (const line of staleWaivers) say('STALE WAIVER ' + line, 'fail');
  for (const line of broken) say('BROKEN ' + line, 'fail');

  say('<h2>' + unplayed.length + ' Tricks this board cannot play at all</h2>', 'dim');
  say('&nbsp;&nbsp;' + unplayed.join(', '), 'dim');
  say('<h2>' + needsParty.length + ' need a friend on the board to show anything</h2>', 'dim');
  say('&nbsp;&nbsp;' + needsParty.join(', '), 'dim');
  say('<h2>' + choices.length + ' hinge on a choice, and the resolver always takes the first branch</h2>', 'dim');
  say('&nbsp;&nbsp;' + choices.join(', '), 'dim');

  window.__RESULT = {
    checked,
    dead: dead.map(d => d.comp + ' ' + d.id + ' [' + d.claim + ']'),
    byCompanion: [...byComp].map(([c, l]) => c + ':' + l.length).sort(),
    unplayed, needsParty, choices, staleWaivers, broken,
  };
  window.__DONE = true;
})().catch(err => {
  say('CRASHED: ' + ((err && err.stack) || err), 'fail');
  window.__RESULT = { checked: 0, dead: [], byCompanion: [], staleWaivers: [], broken: ['CRASHED ' + err] };
  window.__DONE = true;
});
</script>
