<!doctype html>
<meta charset="utf-8">
<title>Midnight Menagerie — enemy validation</title>
<style>
  body { background:#14121a; color:#ddd6e6; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; margin:0; padding:24px; }
  pre  { white-space:pre-wrap; margin:0; }
  .ok  { color:#8fdc9b; } .err { color:#ff8080; } .warn { color:#ffd479; }
  .h   { color:#c9a7ff; font-weight:700; } .dim { color:#8b849b; }
</style>
<pre id="out">running…</pre>
<script type="module">
import { Intent } from '../../game/src/data/schema.js';
import { RNG } from '../../game/src/core/rng.js';
import { ENEMIES, ENEMY_LIST, getEnemy, ENEMY_STATUSES, STATUS_TRICK_DEFS } from '../../game/src/data/enemies/index.js';
import * as LIB from '../../game/src/data/enemies/_lib.js';
import {
  encountersFor, rollEncounter, buildEncounter, ENCOUNTER_LIST, REGION_RULES, scufflePool,
} from '../../game/src/data/encounters.js';

const lines = [];
let errors = 0, warnings = 0;
const log  = (s = '', cls = '') => lines.push(cls ? `<span class="${cls}">${esc(s)}</span>` : esc(s));
const head = (s) => { lines.push(''); lines.push(`<span class="h">${esc(s)}</span>`); };
const fail = (s) => { errors++; log('  ✗ ' + s, 'err'); };
const warn = (s) => { warnings++; log('  ! ' + s, 'warn'); };
const pass = (s) => log('  ✓ ' + s, 'ok');
function esc(s) { return String(s).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch])); }

const ATTACK_INTENTS = new Set([Intent.ATTACK, Intent.ATTACK_BIG, Intent.ATTACK_DEFEND, Intent.ATTACK_BUFF, Intent.ATTACK_DEBUFF]);
const INTENT_VALUES  = new Set(Object.values(Intent));

// ═════════════════════════════════════════════════════════════════════════════
// A mock combat context implementing the EnemyCtx surface documented in
// data/enemies/_lib.js. If an enemy reaches for something not here, that is a real
// requirement the combat engine must satisfy, and this harness must be told about it.
// ═════════════════════════════════════════════════════════════════════════════
const STATUS_BY_ID = ENEMY_STATUSES.reduce((m, s) => (m[s.id] = s, m), {});

function makeActor(def, hp) {
  return {
    id: def.id, uid: def.id + '#' + (makeActor.n = (makeActor.n || 0) + 1), name: def.name,
    hp, maxHp: hp, block: 0, alive: true, mem: {}, counters: {}, flags: {},
    statuses: {}, damageTakenThisTurn: 0, def,
  };
}

class MockCombat {
  /** opts.haunt applies hauntScaling(level) flags+counters, exactly as buildEncounter does. */
  constructor(defs, seed, opts = {}) {
    this.rng = new RNG(seed);
    this.field = {};
    this.turn = 0;
    this.rules = [];
    this.events = [];
    this.cardsPlayedThisTurn = [];
    this.damageDealtThisTurn = 0;
    this.damageLog = [];
    this.statusLog = [];
    this.player = { id: 'player', name: 'Kid', hp: 80, maxHp: 80, block: 0, statuses: {}, damageTakenThisTurn: 0 };
    this.discard = [];
    this.actors = defs.map(d => makeActor(d, opts.hp?.[d.id] ?? d.hp[0]));
    if (opts.haunt) {
      for (const a of this.actors) {
        const h = a.def.hauntScaling ? a.def.hauntScaling(opts.haunt) : null;
        if (!h) continue;
        Object.assign(a.flags, h.flags, opts.advanced ? h.advanced?.flags : null);
        Object.assign(a.counters, h.counters, opts.advanced ? h.advanced?.counters : null);
        if (h.hpMul) { a.maxHp = Math.round(a.maxHp * h.hpMul); a.hp = a.maxHp; }
      }
    }
    this.opts = opts;
    for (const a of this.actors) this.hook(a, 'onSpawn');
  }

  living() { return this.actors.filter(a => a.alive && a.hp > 0); }

  ctxFor(actor) {
    const self = this;
    return {
      self, e: self, // engine handle
      get player() { return self.player; },
      rng: self.rng,
      turn: self.turn,
      field: self.field,
      history: actor.history || (actor.history = []),
      cardsPlayedThisTurn: self.cardsPlayedThisTurn,
      enemies: () => self.living(),
      allies: () => self.living().filter(a => a !== actor),
      // Mirrors the ENGINE's overload exactly: damage(target, amount, opts) or
      // damage(amount, opts). This shim previously accepted only the first
      // form, so when `hitPlayer` stopped naming a target — so that a move's
      // `partyTarget` could decide who it lands on — the harness passed the
      // damage NUMBER where the victim goes. CONTRACTS trap 5: a mock that
      // drifts from the thing it stands in for tests nothing.
      damage: (t, n, o) => {
        if (typeof t === 'number') {
          const opts = (n && typeof n === 'object') ? n : o;
          return self.damage(actor, self.player, t, opts);
        }
        return self.damage(actor, t, n, o);
      },
      loseHp: (t, n) => { t.hp = Math.max(0, t.hp - n); if (t.hp === 0 && t !== self.player) t.alive = false; },
      block: (a, n, o) => {
        if (!a || a.alive === false) return;
        a.block = (a.block || 0) + Math.max(0, n | 0);
        self.boardEvent({ type: 'block', actor: a, source: actor, amount: Math.max(0, n | 0), ...(o || {}) });
      },
      heal: (a, n) => {
        if (!a) return;
        const before = a.hp; a.hp = Math.min(a.maxHp, a.hp + n);
        if (a.hp > before) self.boardEvent({ type: 'heal', actor: a, source: actor, amount: a.hp - before });
      },
      applyStatus: (a, id, n = 1, data) => {
        if (!a) return;
        self.statusLog.push({ id, stacks: n, to: a === self.player ? 'player' : (a === actor ? 'self' : 'ally') });
        if (!STATUS_BY_ID[id] && !/^button-/.test(id)) self.unknownStatus(id);
        a.statuses[id] = (a.statuses[id] || 0) + n;
        if (data) (a.statusData ||= {})[id] = data;
        self.boardEvent({ type: 'status', actor: a, source: actor, id, kind: STATUS_BY_ID[id]?.kind, ...(data || {}) });
      },
      intentOf: (a) => {
        if (!a || !a.def) return null;
        try { return a.def.moves[a.def.nextMove(self.ctx(a))]?.intent ?? null; } catch { return null; }
      },
      removeStatus: (a, id) => { if (a) delete a.statuses[id]; },
      removeWorstStatus: (a) => { const k = Object.keys(a.statuses)[0]; if (k) delete a.statuses[k]; },
      count: (id, a) => ((a || actor).statuses[id] || 0),
      has: (id, a) => !!((a || actor).statuses[id]),
      addCard: (cardId, pile) => {
        if (!STATUS_TRICK_DEFS.some(d => d.id === cardId)) self.unknownCard(cardId);
        self.discard.push({ id: cardId, pile: pile || 'discard' });
      },
      summon: (enemyId, o = {}) => self.summon(actor, enemyId, o),
      despawn: (a) => { a.alive = false; a.despawned = true; },
      /**
       * Powers and ad-hoc hooks are RECORDED, not simulated.
       *
       * The Governess hangs Stitched Together on a Power with an
       * `onIncomingHit` hook, so this harness has to accept one or her spawn
       * throws. It deliberately does not run the hook: a harness that
       * implements the mechanic it is checking proves nothing (CONTRACTS rule
       * 9, and the multi-hit bug this project already shipped behind a green
       * suite). The behaviour is asserted against the real engine in
       * tests/combat/suite.js and tests/coop/suite.js.
       */
      addPower: (p, a) => {
        const owner = a || actor;
        (owner.powers ||= {})[p && p.id] = p;
        (self.powerLog ||= []).push({ actor: owner.uid || owner.id, id: p && p.id });
        return p;
      },
      addHook: (name, fn) => { (self.hookLog ||= []).push({ actor: actor.uid || actor.id, name }); return () => {}; },
      // This harness is a SOLO board, so every per-player threshold is the
      // printed number — the same answer the real engine gives a party of one.
      // The co-op suite proves the multiplied form.
      perPlayer: (n) => (n | 0),
      partySize: () => 1,
      players: () => [self.player],
      pickSeat: () => self.player,
      seatStats: () => self.stats || {},
      seatPlayed: () => self.cardsPlayedThisTurn || [],
      setCounter: (k, v) => { actor.counters[k] = v; },
      counter: (k) => actor.counters[k],
      // Mirrors engine.js announceRule: a rule replaces only the rule with the SAME id.
      // Rules from one source accumulate until explicitly cleared. Replacing by source
      // here (which the engine does not do) hid the Butler stacking all four rules.
      announceRule: (r) => {
        self.rules = self.rules.filter(x => x.id !== r.id);
        r.source = actor.uid; r._owner = actor;
        self.rules.push(r);
        (self.ruleLog ||= []).push({ id: r.id, name: r.name });
      },
      clearRules: () => { self.rules = self.rules.filter(x => x.source !== actor.uid); },
      log: (msg) => self.events.push(msg),
      // proxy the actor's own fields
      ...{},
      __actor: actor,
    };
  }

  // ctx.self must BE the actor — rebuild the object with the right binding.
  ctx(actor) {
    const c = this.ctxFor(actor);
    c.self = actor;
    // Haunt flags live on the actor; _lib.flag() reads actor.flags.
    return c;
  }

  unknownStatus(id) { (this.missingStatuses ||= new Set()).add(id); }
  unknownCard(id)   { (this.missingCards ||= new Set()).add(id); }

  /** Broadcast a board event (Guard granted, Courage recovered, status attached). */
  boardEvent(ev) {
    if (this._inBoardEvent) return;                 // no cascades
    this._inBoardEvent = true;
    try { for (const a of this.living()) this.hook(a, 'onBoardEvent', ev); }
    finally { this._inBoardEvent = false; }
  }

  /**
   * Mirrors combat/engine.js:1061 — `damage(target, amount, {hits})` resolves `hits`
   * separate hits internally. The harness MUST model this or a caller that also loops
   * looks correct here and deals hits² in the real game. That is exactly how the
   * hits-squared bug shipped green.
   */
  damage(source, target, n, o) {
    const hits = (o && o.hits) || 1;
    if (hits > 1) {
      for (let i = 0; i < hits; i++) this.damage(source, target, n, { ...o, hits: 1, hitIndex: i });
      return;
    }
    n = Math.max(0, Math.round(n));
    if (!target) return;
    this.damageLog.push({ source: source === this.player ? 'player' : source.id, target: target === this.player ? 'player' : target.id, amount: n });
    // The Governess's thread redirects before anything else touches her.
    if (!o?.redirected && target !== this.player && target.def?.redirect && source === this.player) {
      n -= target.def.redirect(this.ctx(target), n);
    }
    // Defender-side status hooks, mirroring combat/damage.js. Cover, Scurry and
    // Discomposed all live here — the harness must NOT reimplement them, or it would
    // pass with the real mechanic completely inert (which is how Cover shipped broken).
    if (!o?.redirected) {
      for (const [sid, stacks] of Object.entries(target.statuses || {})) {
        const def = STATUS_BY_ID[sid];
        if (def?.hooks?.modifyDamageTaken) {
          n = def.hooks.modifyDamageTaken(n, { stacks, actor: target, self: target, attacker: source, defender: target, card: o?.card });
        }
      }
      n = Math.max(0, Math.round(n));
    }
    if (n <= 0) return;
    // statuses that modify damage dealt (roused, darkness, buttons)
    for (const [sid, stacks] of Object.entries(source.statuses || {})) {
      const def = STATUS_BY_ID[sid];
      if (def?.hooks?.modifyDamageDealt) n = def.hooks.modifyDamageDealt(n, { stacks, actor: source });
    }
    const absorbed = Math.min(target.block || 0, n);
    target.block -= absorbed;
    const through = n - absorbed;
    target.hp = Math.max(0, target.hp - through);
    target.damageTakenThisTurn = (target.damageTakenThisTurn || 0) + through;
    if (target.hp === 0 && target !== this.player) target.alive = false;
  }

  summon(source, enemyId, o) {
    if (!ENEMIES[enemyId]) { (this.missingSummons ||= new Set()).add(enemyId); return null; }
    if (this.living().length >= 4) return null;                    // board cap safety
    const def = getEnemy(enemyId);
    const hp = o.hp != null ? o.hp : Math.round(def.hp[0] * (o.hpMul || 1));
    const a = makeActor(def, Math.max(1, hp));
    a.summoned = true; a.summonedBy = source.uid;
    this.actors.push(a);
    this.hook(a, 'onSpawn');
    return a;
  }

  hook(actor, name, ...args) {
    const fn = actor.def[name];
    if (typeof fn === 'function') fn.call(actor.def, this.ctx(actor), ...args);
  }

  /** One full player turn: play some cards, deal some damage, resolve rules. */
  playerTurn(profile) {
    this.turn++;
    this.player.block = 0;
    this.cardsPlayedThisTurn = [];
    this.damageDealtThisTurn = 0;
    for (const a of this.actors) a.damageTakenThisTurn = 0;

    for (const a of this.actors) { a._coverUsedThisTurn = 0; a._coverUsedBySeat = {}; }
    for (const a of this.living()) this.hook(a, 'onPlayerTurnStart');

    const nCards = profile.cards ?? this.rng.range(0, 6);
    const types = ['attack', 'skill', 'power'];
    for (let i = 0; i < nCards; i++) {
      const type = profile.type || types[this.rng.int(types.length)];
      this.cardsPlayedThisTurn.push({ id: `test-${type}-${i}`, type });
      if (type === 'attack') {
        const targets = this.living();
        if (targets.length) {
          const t = targets[this.rng.int(targets.length)];
          const dmg = profile.dmg ?? this.rng.range(0, 12);
          this.damageDealtThisTurn += dmg;
          this.damage(this.player, t, dmg);
          this.hook(t, 'onDamaged');
        }
      } else if (type === 'skill') {
        this.player.block += this.rng.range(0, 9);
      }
      // rules that evaluate per card played
      for (const r of this.rules.slice()) {
        if (r.when === 'cardPlayed' && !r._fired && r.broken({ cardsPlayedThisTurn: this.cardsPlayedThisTurn, card: this.cardsPlayedThisTurn[i], playerBlock: this.player.block, damageDealtThisTurn: this.damageDealtThisTurn })) {
          r._fired = true;
          r.onBreak(this.ctx(r._owner));
          this.hook(r._owner, 'onRuleBroken');
        }
      }
      // per-card enemy reactions (The Unwelcome Guest)
      for (const a of this.living()) this.hook(a, 'onPlayerCard');
    }

    // end-of-turn rules
    for (const r of this.rules.slice()) {
      if (r.when === 'turnEnd' && !r._fired && r.broken({ cardsPlayedThisTurn: this.cardsPlayedThisTurn, playerBlock: this.player.block, damageDealtThisTurn: this.damageDealtThisTurn })) {
        r._fired = true;
        r.onBreak(this.ctx(r._owner));
        this.hook(r._owner, 'onRuleBroken');
      }
      r._fired = false;
    }
    if (!profile.deferEnd) this.playerTurnEndHooks();
  }

  /** onPlayerTurnEnd, split out so a test can read intents at the commit moment first. */
  playerTurnEndHooks() {
    for (const a of this.living()) this.hook(a, 'onPlayerTurnEnd');
  }

  /** One enemy action for a specific actor. Returns {moveId, move}. */
  enemyAction(actor, report) {
    const c0 = this.ctx(actor);

    // ── nextMove must be pure and deterministic ────────────────────────────
    const before = snapshot(actor);
    const id1 = actor.def.nextMove(c0);
    const mid = snapshot(actor);
    const id2 = actor.def.nextMove(this.ctx(actor));
    if (id1 !== id2) report.fail(`${actor.id}: nextMove not deterministic (${id1} vs ${id2})`);
    if (mid !== before) report.fail(`${actor.id}: nextMove MUTATED state (must be pure — engine re-calls it to re-render dynamic intents)`);

    const move = actor.def.moves[id1];
    if (!move) { report.fail(`${actor.id}: nextMove returned illegal move id '${id1}'`); return null; }

    // ── the intent the player would see must be renderable ─────────────────
    const shown = renderIntent(move, c0);
    if (shown.error) report.fail(`${actor.id}.${id1}: ${shown.error}`);

    // ── resolve ────────────────────────────────────────────────────────────
    actor.block = 0;                                      // enemy Guard clears on its turn
    this.hook(actor, 'onTurnStart');
    for (const [sid] of Object.entries(actor.statuses)) {
      const sd = STATUS_BY_ID[sid];
      if (sd?.hooks?.onTurnStart) sd.hooks.onTurnStart({ actor, block: (a, n) => { a.block += n; } });
    }
    move.effect(this.ctx(actor));
    (actor.history ||= []).push(id1);
    return { moveId: id1, move, shown };
  }

  enemyTurn(report) {
    const acted = [];
    for (const a of this.living().slice()) {
      if (!a.alive || a.hp <= 0) continue;
      const r = this.enemyAction(a, report);
      if (r) acted.push({ actor: a, ...r });
    }
    this.resolveDeaths();
    // 6c — onEnemyPhaseEnd: every enemy has acted and the decay buckets have run, but the
    // next intents have NOT been chosen yet. Buffs armed during the phase land here, so
    // they are always reflected in the intent that carries them. Mirrors engine.js:1978.
    for (const a of this.living()) this.hook(a, 'onEnemyPhaseEnd');
    this.resolveDeaths();
    return acted;
  }

  resolveDeaths() {
    for (const a of this.actors) {
      if (a.alive && a.hp <= 0) {
        this.hook(a, 'onDeath');
        if (a.hp > 0) continue;                     // onDeath may have mended it (Favorite Doll)
        a.alive = false;
        for (const other of this.living()) this.hook(other, 'onAllyDeath', a);
      }
    }
  }
}

function snapshot(actor) {
  return JSON.stringify({ mem: actor.mem, counters: actor.counters, hp: actor.hp, block: actor.block, statuses: actor.statuses });
}

/** What the intent widget would draw. Mirrors the contract in _lib.js. */
function renderIntent(move, c) {
  let intent = move.intent, damage = move.damage, hits = move.hits, block = move.block;
  try {
    if (typeof move.intentFn === 'function') intent = move.intentFn(c);
    if (typeof move.damageFn === 'function') damage = move.damageFn(c);
    if (typeof move.hitsFn === 'function') hits = move.hitsFn(c);
    if (typeof move.blockFn === 'function') block = move.blockFn(c);
  } catch (e) { return { error: `intent fn threw: ${e.message}` }; }
  if (!INTENT_VALUES.has(intent)) return { error: `resolved to unknown intent '${intent}'` };
  if (ATTACK_INTENTS.has(intent)) {
    if (!Number.isFinite(damage) || damage < 0) return { error: `attack intent has non-numeric damage (${damage})` };
    if (!Number.isInteger(hits) || hits < 1) return { error: `attack intent has bad hits (${hits})` };
  }
  return { intent, damage, hits, block };
}

// ═════════════════════════════════════════════════════════════════════════════
// 1. Schema conformance
// ═════════════════════════════════════════════════════════════════════════════
head('1. EnemyDef schema conformance');
const seenIds = new Set();
for (const def of ENEMY_LIST) {
  const where = def.id || def.name || '(anonymous)';
  const req = (cond, msg) => { if (!cond) fail(`${where}: ${msg}`); };

  req(typeof def.id === 'string' && /^[a-z0-9-]+$/.test(def.id), 'id must be kebab-case');
  req(!seenIds.has(def.id), 'duplicate enemy id'); seenIds.add(def.id);
  req(typeof def.name === 'string' && def.name.length, 'name required');
  req(typeof def.region === 'string', 'region required');
  req(['normal', 'elite', 'boss'].includes(def.tier), `tier must be normal|elite|boss (got ${def.tier})`);
  req(Array.isArray(def.hp) && def.hp.length === 2 && def.hp.every(Number.isFinite) && def.hp[0] <= def.hp[1] && def.hp[0] > 0,
      `hp must be an inclusive [min,max] range (got ${JSON.stringify(def.hp)})`);
  req(def.moves && typeof def.moves === 'object' && Object.keys(def.moves).length, 'moves required');
  req(typeof def.nextMove === 'function', 'nextMove required');
  req(typeof def.hauntScaling === 'function', 'hauntScaling(level) required');

  // brief-mandated presentation fields
  req(typeof def.silhouette === 'string' && def.silhouette.length, 'silhouette key required');
  req(typeof def.lore === 'string' && def.lore.length > 20, 'lore line required');
  req(Array.isArray(def.palette) && def.palette.length >= 2 && def.palette.length <= 3
      && def.palette.every(h => /^#[0-9a-f]{6}$/i.test(h)), 'palette must be 2-3 hex colours');
  req(def.shape && ['tall-thin', 'squat', 'sprawling', 'floating'].includes(def.shape.body)
      && Number.isInteger(def.shape.limbs) && Number.isInteger(def.shape.eyes),
      'shape {body,limbs,eyes} required');

  for (const [key, mv] of Object.entries(def.moves)) {
    const w = `${where}.${key}`;
    if (mv.id !== key) fail(`${w}: move.id '${mv.id}' does not match its key`);
    if (typeof mv.name !== 'string' || !mv.name.length) fail(`${w}: name required`);
    if (!INTENT_VALUES.has(mv.intent)) fail(`${w}: intent '${mv.intent}' is not in schema Intent`);
    if (typeof mv.tell !== 'string' || mv.tell.length < 8) fail(`${w}: needs a one-line 'tell' for the intent tooltip`);
    if (typeof mv.effect !== 'function') fail(`${w}: effect required`);
    if (ATTACK_INTENTS.has(mv.intent)) {
      if (!Number.isFinite(mv.damage)) fail(`${w}: attack intent must declare base 'damage'`);
      if (!Number.isInteger(mv.hits) || mv.hits < 1) fail(`${w}: attack intent must declare 'hits'`);
    }
    if (mv.block != null && !Number.isFinite(mv.block)) fail(`${w}: block must be numeric`);
  }

  // hauntScaling must be total over 0..10
  for (let l = 0; l <= 10; l++) {
    let h; try { h = def.hauntScaling(l); } catch (e) { fail(`${where}.hauntScaling(${l}) threw: ${e.message}`); break; }
    if (!h || typeof h.hpMul !== 'number' || !(h.hpMul >= 1)) fail(`${where}.hauntScaling(${l}) must return {hpMul>=1,…}`);
  }
}
log(`  ${ENEMY_LIST.length} EnemyDefs checked, ${Object.values(ENEMIES).reduce((n, d) => n + Object.keys(d.moves).length, 0)} moves.`, 'dim');
if (!errors) pass('all definitions conform to schema.js');

// ═════════════════════════════════════════════════════════════════════════════
// 2. Simulation — 200 turns per enemy, seeded, several player profiles
// ═════════════════════════════════════════════════════════════════════════════
head('2. Behaviour simulation (200 turns per enemy)');

/** Player archetypes, so dynamic intents get exercised in both directions. */
const PROFILES = [
  { name: 'passive',    cards: 0, dmg: 0 },
  { name: 'chip',       cards: 2, dmg: 3 },
  { name: 'burst',      cards: 3, dmg: 14 },
  { name: 'spam',       cards: 6, dmg: 4 },
  { name: 'skills',     cards: 5, dmg: 0, type: 'skill' },
  { name: 'mixed',      cards: null },
];

const traces = {};
for (const def of ENEMY_LIST) {
  const report = { fail: (m) => fail(m) };
  const trace = [];
  let simErrors = errors;

  for (const profile of PROFILES) {
    const sim = new MockCombat([def], `enemy:${def.id}:${profile.name}`);
    const actor = sim.actors[0];
    actor.hp = actor.maxHp = 100000;              // keep it alive for the whole run
    for (let t = 0; t < Math.ceil(200 / PROFILES.length); t++) {
      sim.playerTurn(profile.cards == null ? {} : profile);
      actor.hp = actor.maxHp;                     // undo player damage; we want pattern length
      actor.alive = true;
      const acted = sim.enemyTurn(report);
      const mine = acted.find(a => a.actor === actor);
      if (mine && profile.name === 'mixed') trace.push(mine.moveId);
      sim.player.hp = sim.player.maxHp;           // never let the mock player die
    }
    if (sim.missingStatuses) fail(`${def.id}: applied unregistered status(es) ${[...sim.missingStatuses].join(', ')}`);
    if (sim.missingCards)    fail(`${def.id}: added unknown card(s) ${[...sim.missingCards].join(', ')}`);
    if (sim.missingSummons)  fail(`${def.id}: summoned unknown enemy(s) ${[...sim.missingSummons].join(', ')}`);
  }
  traces[def.id] = trace;
  if (errors === simErrors) pass(`${def.name} — 200 turns, no crash, no illegal move id`);
}

// A boss-specific run that actually drains HP, so phases and transitions execute.
head('2b. Boss phase transitions (HP-draining run)');
for (const def of ENEMY_LIST.filter(d => d.tier === 'boss')) {
  const report = { fail: (m) => fail(m) };
  const sim = new MockCombat([def], `boss:${def.id}`);
  const actor = sim.actors[0];
  const seq = [];
  for (let t = 0; t < 120 && actor.hp > 0; t++) {
    sim.playerTurn({ cards: 4, dmg: 7 });
    if (actor.hp <= 0) break;
    const acted = sim.enemyTurn(report);
    const mine = acted.find(a => a.actor === actor);
    if (mine) seq.push(`${mine.moveId}@${actor.hp}`);
    sim.player.hp = sim.player.maxHp;
  }
  traces['__boss__' + def.id] = seq;
  log(`  ${def.name}: resolved ${seq.length} actions down to ${actor.hp} Courage.`, 'dim');
}

// ═════════════════════════════════════════════════════════════════════════════
// 3. Stated pattern constraints
// ═════════════════════════════════════════════════════════════════════════════
head('3. Stated pattern constraints from the design doc');

/** Each check gets the 'mixed'-profile move trace for that enemy. */
const CONSTRAINTS = [
  ['dust-bunny', 'Turn 1 Gather, turn 2 Tumble, then repeat',
    t => t.every((m, i) => m === ['gather', 'tumble'][i % 2])],
  ['coatrack-crawler', 'Brace → Umbrella Jab → Hat Swipe, repeating',
    t => t.every((m, i) => m === ['brace', 'umbrella-jab', 'hat-swipe'][i % 3])],
  ['coatrack-crawler', 'Umbrella Jab is only ever used the turn after a Brace',
    t => t.every((m, i) => m !== 'umbrella-jab' || t[i - 1] === 'brace')],
  ['lost-luggage', 'Pack Wrong → Baggage Bash → Snap Shut → Baggage Bash',
    t => t.every((m, i) => m === ['pack-wrong', 'baggage-bash', 'snap-shut', 'baggage-bash'][i % 4])],
  ['calling-bell', 'Call for Service is used at most once',
    t => t.filter(m => m === 'call-for-service').length <= 1],
  ['calling-bell', 'never Rings twice in a row',
    t => t.every((m, i) => !(m === 'ring' && t[i - 1] === 'ring'))],
  ['red-carpet-runner', 'Unroll → Gather Speed → Run the Hall, repeating',
    t => t.every((m, i) => m === ['unroll', 'gather-speed', 'run-the-hall'][i % 3])],
  ['door-greeter', 'Mind Your Manners → Threshold Slam → Hold the Door',
    t => t.every((m, i) => m === ['mind-your-manners', 'threshold-slam', 'hold-the-door'][i % 3])],
  // BALANCE 2026-08-20: one Check per cycle, not two — two of five turns dealt
  // zero, which made a solo elite free against one turn of Guard.
  ['grand-coatcheck', 'Check → Sweep → Flurry → Everything at Once',
    t => t.every((m, i) => m === ['check-your-things', 'umbrella-sweep', 'hanger-flurry', 'everything-at-once'][i % 4])],
  // BALANCE 2026-08-20: the repeat no longer carries a second pure-defence turn.
  ['unwelcome-guest', 'Watching → Too Familiar → Wrong Face → Come In, Then → Too Familiar → Wrong Face',
    t => t.every((m, i) => m === ['watching', 'too-familiar', 'wrong-face', 'come-in-then', 'too-familiar', 'wrong-face'][i % 6])],
  ['house-bell', 'MIDNIGHT TOLL never follows another TOLL',
    t => t.every((m, i) => !(m === 'midnight-toll' && t[i - 1] === 'midnight-toll'))],

  // ── Nursery ──
  ['jack-in-the-box', 'Handle → Handle → POP! → Box Bite',
    t => t.every((m, i) => m === ['turn-the-handle', 'turn-the-handle', 'pop', 'box-bite'][i % 4])],
  ['jack-in-the-box', 'POP! only ever follows two Turn the Handles',
    t => t.every((m, i) => m !== 'pop' || (t[i - 1] === 'turn-the-handle' && t[i - 2] === 'turn-the-handle'))],
  ['patchwork-soldier', 'Patch Up never occurs twice consecutively',
    t => t.every((m, i) => !(m === 'patch-up' && t[i - 1] === 'patch-up'))],
  ['patchwork-soldier', 'solo, it simply alternates Wooden Saber and Stand Guard',
    t => t.every((m, i) => m === ['wooden-saber', 'stand-guard'][i % 2])],
  ['porcelain-doll', 'Tea Cup Tap → Perfect Posture → Sharp Little Hands',
    t => t.every((m, i) => m === ['tea-cup-tap', 'perfect-posture', 'sharp-little-hands'][i % 3])],
  ['blanket-blob', 'solo, it never wastes a turn on Tuck In with nobody to cover',
    t => !t.includes('tuck-in')],
  ['rocking-horse', 'Gallop only fires at 2+ Excitement (never twice running at 0)',
    t => t.every((m, i) => !(m === 'gallop' && t[i - 1] === 'gallop'))],
  ['button-baby', 'solo, it cycles Button Toss / Gather Thread / Button Toss',
    t => t.every((m, i) => m === ['button-toss', 'gather-thread', 'button-toss'][i % 3])],
  ['toy-chest', 'Spill Toys becomes Rattle Angrily rather than fizzling',
    t => t.every(m => ['spill-toys', 'rattle-angrily', 'lid-slam', 'toy-barrage', 'tidy-up'].includes(m))],
  ['patchwork-giant', 'Stuffed Fist → Sit Down → Wild Flail → Coming Apart',
    t => t.every((m, i) => m === ['stuffed-fist', 'sit-down', 'wild-flail', 'coming-apart'][i % 4])],
  ['porcelain-twin-prim', 'alone, Prim never holds a Tea Party by herself',
    t => !t.includes('tea-party')],
  ['favorite-doll', 'never acts on its own',
    t => t.every(m => m === 'sit-still')],

  // ── Sleeping Quarters ──
  ['pillow-puff', 'Feather Cloud → Puff → Pillow Bonk',
    t => t.every((m, i) => m === ['feather-cloud', 'puff', 'pillow-bonk'][i % 3])],
  ['slipper-skitter', 'Toe Stomp → Heel Kick → Hide Under the Bed',
    t => t.every((m, i) => m === ['toe-stomp', 'heel-kick', 'hide-under-the-bed'][i % 3])],
  ['wardrobe-guest', 'Long Fingers → Back Inside → Rustle → Peek Out',
    t => t.every((m, i) => m === ['long-fingers', 'back-inside', 'rustle', 'peek-out'][i % 4])],
  ['wardrobe-guest', 'only ever Rustles while it is actually Hidden',
    t => t.every((m, i) => m !== 'rustle' || t[i - 1] === 'back-inside')],
  ['nightlight-snuffer', 'Snuff → Hot Wick → Flicker Out → Hot Wick',
    t => t.every((m, i) => m === ['snuff', 'hot-wick', 'flicker-out', 'hot-wick'][i % 4])],
  ['thing-beneath', 'Scratch → Grab an Ankle → Scratch → UNDER THE BED',
    t => t.every((m, i) => m === ['scratch-scratch', 'grab-an-ankle', 'scratch-scratch', 'under-the-bed'][i % 4])],
  ['blanket-creeper', 'only ever uses its two authored cycles',
    t => t.every(m => ['wrap-up', 'blanket-lash', 'smother'].includes(m))],
  ['night-terror', 'Watching You → Long Shadow → Bedroom Corner → Sudden Face',
    t => t.every((m, i) => m === ['watching-you', 'long-shadow', 'bedroom-corner', 'sudden-face'][i % 4])],
  ['blanket-hydra', 'Blanket Crush → Tangle → Roll Over',
    t => t.every((m, i) => m === ['blanket-crush', 'tangle', 'roll-over'][i % 3])],
  ['the-wardrobe', 'Creak Open → Something Reaches Out → Slam Shut → Empty Hangers',
    t => t.every((m, i) => m === ['creak-open', 'something-reaches-out', 'slam-shut', 'empty-hangers'][i % 4])],
  ['hydra-head-biting', 'the Biting Head attacks every single turn',
    t => t.every(m => m === 'chomp')],
  ['hydra-head-snoring', 'the Snoring Head acts every second turn',
    t => t.every((m, i) => m === ['doze', 'snore'][i % 2])],
  ['hydra-head-crying', 'the Crying Head acts every second turn',
    t => t.every((m, i) => m === ['sniffle', 'wail'][i % 2])],
];

for (const [id, desc, fn] of CONSTRAINTS) {
  const t = traces[id] || [];
  if (!t.length) { warn(`${id}: no trace captured for "${desc}"`); continue; }
  if (fn(t)) pass(`${id}: ${desc}`);
  else fail(`${id}: VIOLATED — ${desc}\n      trace: ${t.slice(0, 16).join(' → ')}`);
}

// Counter bounds, driven live rather than from a trace.
head('3b. Counter bounds');
const BOUNDS = [
  ['dust-bunny', 'dust', 0, 4],
  ['red-carpet-runner', 'momentum', 0, 2],
  ['house-bell', 'resonance', 0, 4],
];
for (const [id, key, lo, hi] of BOUNDS) {
  const def = getEnemy(id);
  let worstLo = Infinity, worstHi = -Infinity;
  for (const profile of PROFILES) {
    const sim = new MockCombat([def], `bounds:${id}:${profile.name}`);
    const actor = sim.actors[0]; actor.hp = actor.maxHp = 100000;
    for (let t = 0; t < 40; t++) {
      sim.playerTurn(profile.cards == null ? {} : profile);
      actor.hp = actor.maxHp; actor.alive = true;
      sim.enemyTurn({ fail });
      sim.player.hp = sim.player.maxHp;
      const v = actor.counters[key] ?? 0;
      worstLo = Math.min(worstLo, v); worstHi = Math.max(worstHi, v);
    }
  }
  if (worstLo < lo || worstHi > hi) fail(`${id}.${key} left [${lo},${hi}] — observed [${worstLo},${worstHi}]`);
  else pass(`${id}.${key} stays within [${lo},${hi}] (observed [${worstLo},${worstHi}])`);
}

// ── Multi-actor formations: interactions only exist when enemies stand together ──
head('3c. Multi-actor formations');
const formTraces = {};
for (const enc of ENCOUNTER_LIST.filter(e => e.members.length > 1)) {
  const defs = enc.members.map(mm => getEnemy(mm.enemyId));
  const sim = new MockCombat(defs, `form:${enc.id}`);
  for (const a of sim.actors) { a.hp = a.maxHp = Math.max(a.maxHp, 400); }
  const per = {};
  let crashed = null;
  try {
    for (let t = 0; t < 60; t++) {
      sim.playerTurn({ cards: 3, dmg: 6 });
      for (const a of sim.actors) { if (!a.despawned) { a.hp = a.maxHp; a.alive = true; } }
      const acted = sim.enemyTurn({ fail });
      for (const x of acted) (per[x.actor.id] ||= []).push(x.moveId);
      sim.player.hp = sim.player.maxHp;
    }
  } catch (e) { crashed = e; }
  if (crashed) fail(`${enc.id}: formation sim threw — ${crashed.message}`);
  else pass(`${enc.id}: ${defs.map(d => d.name).join(' + ')} — 60 rounds together, no crash`);
  Object.assign(formTraces, Object.fromEntries(Object.entries(per).map(([k, v]) => [`${enc.id}:${k}`, v])));
  if (sim.missingStatuses) fail(`${enc.id}: unregistered status(es) ${[...sim.missingStatuses].join(', ')}`);
}

head('3d. Interactions that only exist in formation');
const FORM_CHECKS = [
  ['nursery-scare-twins:porcelain-twin-prim', 'Prim holds a Tea Party on every fourth turn',
    t => t.length >= 8 && t.every((m, i) => (m === 'tea-party') === ((i + 1) % 4 === 0))],
  ['nursery-scare-twins:porcelain-twin-proper', 'Proper matches Prim\'s Tea Party rhythm',
    t => t.length >= 8 && t.every((m, i) => (m === 'tea-party') === ((i + 1) % 4 === 0))],
  ['nursery-7:blanket-blob', 'Blanket Blob tucks its friend in before it starts hitting',
    t => t[0] === 'tuck-in' && t.slice(1).filter(m => m === 'tuck-in').length <= t.length],
  ['nursery-8:button-baby', 'Button Baby sews before it does anything else',
    t => t[0] === 'sew-on'],
  ['nursery-boss:favorite-doll', 'Favorite Doll never takes an action beside her',
    t => t.every(m => m === 'sit-still')],
  ['foyer-5:calling-bell', 'escorted, the Bell rings rather than calling for service',
    t => !t.includes('call-for-service')],
];
for (const [key, desc, fn] of FORM_CHECKS) {
  const t = formTraces[key];
  if (!t) { fail(`${key}: no formation trace captured for "${desc}"`); continue; }
  if (fn(t)) pass(`${key.split(':')[1]}: ${desc}`);
  else fail(`${key}: VIOLATED — ${desc}\n      trace: ${t.slice(0, 12).join(' → ')}`);
}

// Nursery interaction spot-checks with real cross-enemy state.
head('3e. Nursery cross-enemy mechanics');
{
  // Rocking Horse gains Excitement when the Soldier repairs SOMEONE ELSE.
  // (Healing the Horse itself must NOT excite it — the doc says "another enemy".)
  const sim = new MockCombat(
    [getEnemy('rocking-horse'), getEnemy('patchwork-soldier'), getEnemy('button-baby')], 'excite');
  const horse = sim.actors[0], soldier = sim.actors[1], baby = sim.actors[2];
  baby.hp = baby.maxHp - 20;                                // 20 missing → Patch Up targets it
  const before = horse.counters.excitement || 0;
  soldier.def.moves['patch-up'].effect(sim.ctx(soldier));
  const after = horse.counters.excitement || 0;
  (after === before + 1 ? pass : fail)(`Rocking Horse gains Excitement when the Soldier repairs an ally (${before} → ${after})`);
  // ...and the Soldier paid for it out of its own stuffing.
  (soldier.hp < soldier.maxHp ? pass : fail)(`Patch Up costs the Soldier its own Courage (${soldier.hp}/${soldier.maxHp})`);

  // Button Baby's Spring Button choice keys off the ally's telegraphed intent.
  const sim2 = new MockCombat([getEnemy('button-baby'), getEnemy('porcelain-doll')], 'sew');
  const bb = sim2.actors[0], doll = sim2.actors[1];
  const intent = sim2.ctx(bb).intentOf(doll);
  const chosen = getEnemy('button-baby').chooseButton(sim2.ctx(bb), doll);
  (intent && chosen ? pass : fail)(`Button Baby reads the Doll's intent (${intent}) and picks ${chosen}`);

  // Blanket Blob's Cover actually redirects damage.
  const sim3 = new MockCombat([getEnemy('blanket-blob'), getEnemy('porcelain-doll')], 'cover');
  const blob = sim3.actors[0], target = sim3.actors[1];
  blob.def.moves['tuck-in'].effect(sim3.ctx(blob));
  blob.block = 0;                                   // measure Courage, not the Blob's own Guard
  const blobBefore = blob.hp, tgtBefore = target.hp;
  sim3.damage(sim3.player, target, 12);
  sim3.hook(blob, 'onPlayerTurnEnd');               // the Blob pays what Cover absorbed
  const redirected = blobBefore - blob.hp, through = tgtBefore - target.hp;
  (redirected === 8 && through === 4
    ? pass : fail)(`Cover redirects the first 8 damage (blob took ${redirected}, doll took ${through}; expected 8 / 4)`);
  // A second hit the same turn is no longer covered — the allowance is per player turn
  // and only re-arms on the Blob's own turn.
  const blob2 = blob.hp, tgt2 = target.hp;
  sim3.damage(sim3.player, target, 6);
  sim3.hook(blob, 'onPlayerTurnEnd');
  ((blob.hp === blob2 && tgt2 - target.hp === 6)
    ? pass : fail)('Cover\'s 8-damage allowance is spent for the turn after the first hit');
}

// ── Every boss must actually reach and cross its phase transition ────────────
head('3f. Boss phase structure');
const BOSSES = [
  { enc: 'foyer-boss', id: 'butler', transition: 'this-is-most-irregular', at: 140,
    p1: ['formal-welcome', 'walking-stick', 'dust-them-off', 'service-please'],
    p2: ['remove-the-intruder', 'enough-of-this', 'restore-order'], opens: 'formal-welcome' },
  { enc: 'nursery-boss', id: 'governess', transition: 'look-what-youve-done', at: 150,
    p1: ['inspect-the-nursery', 'sharp-correction', 'mind-your-seams', 'mend-my-darling'],
    p2: ['needle-point', 'tighten-the-stitch', 'snip-snip', 'emergency-repair'], opens: 'inspect-the-nursery' },
  { enc: 'sq-boss', id: 'bedframe-beast', transition: 'no-more-hiding', at: 160,
    p1: ['bedpost-swipe', 'rattle-the-frame', 'spring-snap', 'pull-the-covers-up', 'retreat-underneath',
      'scratching-below', 'footsteps-around-the-bed', 'boo'],
    p2: ['splinter-swipe', 'shake-the-room', 'mattress-maw', 'dive-under',
      'claw-ambush', 'giant-scare', 'grab-and-drag'], opens: 'bedpost-swipe' },
];
for (const b of BOSSES) {
  const enc = ENCOUNTER_LIST.find(e => e.id === b.enc);
  const defs = enc.members.map(mm => getEnemy(mm.enemyId));
  const sim = new MockCombat(defs, `phases:${b.id}`);
  const boss = sim.actors.find(a => a.id === b.id);
  const seq = [];
  for (let t = 0; t < 200 && boss.hp > 0; t++) {
    sim.playerTurn({ cards: 4, dmg: 8 });
    if (boss.hp <= 0) break;
    const acted = sim.enemyTurn({ fail });
    const mine = acted.find(a => a.actor === boss);
    if (mine) seq.push(mine.moveId);
    sim.player.hp = sim.player.maxHp;
  }
  const label = boss.name;
  if (seq[0] !== b.opens) fail(`${label}: must open with '${b.opens}', opened with '${seq[0]}'`);
  else pass(`${label}: opens with ${getEnemy(b.id).moves[b.opens].name}`);

  const nT = seq.filter(x => x === b.transition).length;
  if (nT !== 1) fail(`${label}: phase transition '${b.transition}' fired ${nT} times, expected exactly 1`);
  else pass(`${label}: ${getEnemy(b.id).moves[b.transition].name} fires exactly once at ≤${b.at} Courage`);

  const ti = seq.indexOf(b.transition);
  if (ti >= 0) {
    const early = seq.slice(0, ti).filter(x => b.p2.includes(x));
    const late = seq.slice(ti + 1).filter(x => b.p1.includes(x));
    if (early.length) fail(`${label}: phase-two moves before the transition — ${[...new Set(early)].join(', ')}`);
    else pass(`${label}: no phase-two move leaks into phase one`);
    if (late.length) fail(`${label}: phase-one moves after the transition — ${[...new Set(late)].join(', ')}`);
    else pass(`${label}: no phase-one move leaks into phase two`);
    const p2used = new Set(seq.slice(ti + 1));
    if (p2used.size < 2) warn(`${label}: only ${p2used.size} distinct phase-two move(s) exercised`);
    else pass(`${label}: phase two exercises ${p2used.size} distinct moves (${[...p2used].slice(0, 5).join(', ')})`);
  }
  log(`    ${label}: ${seq.length} actions, transition at action ${ti + 1}/${seq.length}.`, 'dim');
}

// Bedframe Beast: the Bed Position puzzle must actually be steerable.
head('3g. Bedframe Beast — Bed Positions');
{
  const def = getEnemy('bedframe-beast');
  const sim = new MockCombat([def], 'beds');
  const a = sim.actors[0];
  a.mem.phase = 2; a.mem.state = 'underneath';
  const probe = (nCards) => {
    sim.field.bedPosition = 'left';
    sim.cardsPlayedThisTurn = Array.from({ length: nCards }, (_, i) => ({ id: 'c' + i, type: 'skill' }));
    return def.rattling(sim.ctx(a));
  };
  const r = [probe(0), probe(2), probe(3), probe(5), probe(6), probe(9)];
  (r.join(',') === 'left,left,center,center,right,right'
    ? pass : fail)(`3rd Trick moves Rattling one step, 6th moves it again (got ${r.join(', ')})`);
  // Each position maps to its own ambush.
  const maps = BED_POSITIONS_CHECK(def, sim, a);
  (maps ? pass : fail)('each Bed Position emerges with its own distinct ambush move');
}
function BED_POSITIONS_CHECK(def, sim, a) {
  const seen = new Set();
  for (const pos of ['left', 'center', 'right']) {
    sim.field.bedPosition = pos;
    sim.cardsPlayedThisTurn = [];
    a.mem.phase = 2; a.mem.state = 'underneath'; a.mem.disoriented = false;
    const mv = def.nextMove(sim.ctx(a));
    if (!def.moves[mv]) return false;
    seen.add(mv);
  }
  return seen.size === 3;
}

// The Butler's rule selection.
head('3h. The Butler — House Rules and phases');
{
  const def = getEnemy('butler');
  const sim = new MockCombat([def], 'butler:rules');
  const actor = sim.actors[0];
  const ruleSeq = [], moveSeq = [];
  const ruleCounts = { p1: [], p2: [] };
  for (let t = 0; t < 120 && actor.hp > 0; t++) {
    sim.playerTurn({ cards: 5, dmg: 6 });
    if (actor.hp <= 0) break;
    const acted = sim.enemyTurn({ fail });
    const mine = acted.find(a => a.actor === actor);
    if (mine) moveSeq.push(mine.moveId);
    const r = sim.rules[0];
    if (r && ruleSeq[ruleSeq.length - 1] !== r.id) ruleSeq.push(r.id);
    // Sample how many of his rules are standing, bucketed by phase.
    if (!actor.statuses.discomposed && sim.rules.length) {
      ((actor.mem.phase || 1) >= 2 ? ruleCounts.p2 : ruleCounts.p1).push(sim.rules.length);
    }
    sim.player.hp = sim.player.maxHp;
  }
  const hist = actor.mem.ruleHistory || [];
  const key = (x) => [].concat(x).slice().sort().join('+');
  const dupes = hist.filter((r, i) => i > 0 && key(r) === key(hist[i - 1]));
  if (dupes.length) fail(`Butler announced the same House Rule set twice consecutively (${key(dupes[0])})`);
  else pass(`never announces the same House Rule set twice in a row (${hist.length} announcements)`);
  // Phase one enforces exactly one rule, phase two exactly two. The engine only replaces
  // a rule by id, so a missing clearRules() would silently stack all four.
  if (ruleCounts.p1.length && Math.max(...ruleCounts.p1) > 1) {
    fail(`phase one had ${Math.max(...ruleCounts.p1)} House Rules standing at once — he must enforce one at a time`);
  } else if (ruleCounts.p1.length) pass('phase one enforces exactly one House Rule at a time');
  if (ruleCounts.p2.length && Math.max(...ruleCounts.p2) !== 2) {
    fail(`phase two had ${Math.max(...ruleCounts.p2)} House Rules standing, expected exactly 2`);
  } else if (ruleCounts.p2.length) pass('phase two stands up exactly two House Rules at once — the phase-one read inverts');
  else warn('phase two rule count never sampled');
  if (moveSeq[0] !== 'formal-welcome') fail(`Butler must open with Formal Welcome, opened with '${moveSeq[0]}'`);
  else pass('opens with Formal Welcome');
  const nTrans = moveSeq.filter(x => x === 'this-is-most-irregular').length;
  if (nTrans !== 1) fail(`phase transition fired ${nTrans} times, expected exactly 1`);
  else pass('This Is Most Irregular fires exactly once, at ≤140 Courage');
  const tIdx = moveSeq.indexOf('this-is-most-irregular');
  const p2Only = ['remove-the-intruder', 'enough-of-this', 'restore-order'];
  const leaked = moveSeq.slice(0, tIdx).filter(x => p2Only.includes(x));
  if (leaked.length) fail(`phase-two moves used before the transition: ${leaked.join(', ')}`);
  else pass('phase-two moves never appear before the transition');
  const p1Only = ['formal-welcome', 'walking-stick', 'dust-them-off', 'service-please'];
  const leaked2 = moveSeq.slice(tIdx + 1).filter(x => p1Only.includes(x));
  if (leaked2.length) fail(`phase-one moves used after the transition: ${leaked2.join(', ')}`);
  else pass('phase-one moves never appear after the transition');
  if (!moveSeq.includes('collect-himself')) warn('Discomposed never triggered in this run — Collect Himself unexercised');
  else pass('Flustered → Discomposed → Collect Himself window occurs');
  log(`  rule order: ${hist.slice(0, 10).join(' → ')}…`, 'dim');
}

// ═════════════════════════════════════════════════════════════════════════════
// 4. Encounter tables
// ═════════════════════════════════════════════════════════════════════════════
head('4. Encounter tables');
const REGIONS = [...new Set(ENCOUNTER_LIST.map(e => e.region))];
for (const region of REGIONS) {
  log('');
  log(`  ── ${region} ──`, 'h');
  for (const tier of ['early', 'standard', 'advanced', 'elite', 'boss']) {
    const list = encountersFor(region, tier);
    if (!list.length) continue;
    log(`  ${tier}:`);
    for (const enc of list) {
      const parts = enc.members.map(mm => {
        const d = ENEMIES[mm.enemyId];
        if (!d) { fail(`${enc.id} references unknown enemy '${mm.enemyId}'`); return mm.enemyId + '(?)'; }
        const hp = mm.hp != null ? mm.hp : Math.round(d.hp[0] * (mm.hpMul || 1));
        return `${d.name} ${hp}`;
      });
      const total = enc.members.reduce((n, mm) => {
        const d = ENEMIES[mm.enemyId];
        return n + (d ? (mm.hp != null ? mm.hp : Math.round(d.hp[0] * (mm.hpMul || 1))) : 0);
      }, 0);
      log(`    ${enc.id.padEnd(26)} ${String(total).padStart(4)} Courage  ${parts.join(' + ')}`);
    }
  }
}

head('4b. Selection rules');
{
  const region = 'foyer';
  const rules = REGION_RULES[region];
  // No immediate repeats, and first-Scuffle bans respected, over many seeds.
  let repeats = 0, firstViolations = 0, runnerEarly = 0, aloneBell = 0;
  for (let seed = 0; seed < 400; seed++) {
    const rng = new RNG(`sel:${seed}`);
    const history = [];
    for (let i = 0; i < 8; i++) {
      const tier = i < 2 ? 'early' : i < 5 ? 'standard' : 'advanced';
      const enc = rollEncounter(region, tier, rng, history);
      if (history.length && enc.id === history[history.length - 1]) repeats++;
      if (i === 0 && enc.members.some(mm => rules.bannedFirstScuffle.includes(mm.enemyId))) firstViolations++;
      if (i < 2 && enc.members.some(mm => mm.enemyId === 'red-carpet-runner')) runnerEarly++;
      if (enc.members.length === 1 && enc.members[0].enemyId === 'calling-bell') aloneBell++;
      history.push(enc.id);
    }
  }
  (repeats ? fail : pass)(`no immediate repeats over 400 seeds × 8 Scuffles (${repeats} violations)`);
  (firstViolations ? fail : pass)(`first Scuffle never contains Door Greeter / Calling Bell / Red Carpet Runner (${firstViolations} violations)`);
  (runnerEarly ? fail : pass)(`Red Carpet Runner never appears before the 3rd Scuffle (${runnerEarly} violations)`);
  (aloneBell ? fail : pass)(`Calling Bell never appears alone (${aloneBell} violations)`);

  // Determinism: the same seed must produce the same sequence.
  const seqOf = () => { const rng = new RNG('determinism'); const h = []; for (let i = 0; i < 10; i++) h.push(rollEncounter(region, i < 4 ? 'early' : 'advanced', rng, h)?.id); return h.join(','); };
  (seqOf() === seqOf() ? pass : fail)('rollEncounter is reproducible from a seed');
}

head('4c. buildEncounter');
{
  let bad = 0;
  for (const enc of ENCOUNTER_LIST) {
    for (const level of [0, 1, 3, 5, 9, 10]) {
      const rng = new RNG(`build:${enc.id}:${level}`);
      let spawn;
      try { spawn = buildEncounter(enc.id, rng, level); }
      catch (e) { fail(`buildEncounter(${enc.id}, ·, ${level}) threw: ${e.message}`); bad++; continue; }
      if (spawn.length !== enc.members.length) { fail(`${enc.id}@H${level}: expected ${enc.members.length} spawns, got ${spawn.length}`); bad++; }
      spawn.forEach((s, i) => {
        if (!ENEMIES[s.enemyId]) { fail(`${enc.id}@H${level}: unknown enemyId ${s.enemyId}`); bad++; }
        if (!(s.hp > 0)) { fail(`${enc.id}@H${level}: non-positive hp ${s.hp}`); bad++; }
        if (s.slot !== i) { fail(`${enc.id}@H${level}: slot ${s.slot} != index ${i}`); bad++; }
      });
    }
  }
  if (!bad) pass(`every formation instantiates at Haunt 0/1/3/5/9/10`);
  // Show the Haunt curve on one formation.
  const demo = [0, 1, 5, 10].map(l => {
    const s = buildEncounter('foyer-14', new RNG('demo'), l);
    return `H${l}: ${s.map(x => `${x.name} ${x.hp}`).join(' + ')}`;
  });
  for (const d of demo) log('    ' + d, 'dim');
  const adv = buildEncounter('foyer-12', new RNG('adv'), 3);
  log(`    Haunt 3 advanced pool — Dust Bunny starts with ${adv.find(x => x.enemyId === 'dust-bunny')?.counters?.dust ?? 0} Dust`, 'dim');
}

// ═════════════════════════════════════════════════════════════════════════════
// 5b. THE INTENT IS THE CONTRACT
// Every move is resolved against a dummy player and the damage events it actually
// produces are compared against the number the intent promised. This exists because a
// hits-squared bug shipped green: the intent said 7x3 and the move dealt 63.
// ═════════════════════════════════════════════════════════════════════════════
head('5b. Intent number vs damage actually dealt (all moves)');
{
  let checked = 0, multi = 0, bad = 0;
  // Run at Haunt 0 AND Haunt 10. The Haunt pressure axis (`bossDmg`) has to be added in
  // BOTH a move's damageFn and its effect; miss one and the intent lies only at high
  // Haunt, which a Haunt 0 reconciliation can never see.
  for (const HAUNT of [0, 10]) {
  for (const def of ENEMY_LIST) {
    for (const [mid, mv] of Object.entries(def.moves)) {
      // Resolve this move in isolation against an undamageable dummy.
      const sim = new MockCombat([def], `contract:${def.id}:${mid}:${HAUNT}`, { haunt: HAUNT });
      const a = sim.actors[0];
      a.hp = a.maxHp = 100000;
      sim.player.hp = sim.player.maxHp = 100000;
      sim.playerTurn({ cards: 2, dmg: 0, deferEnd: true });
      sim.player.hp = sim.player.maxHp = 100000;

      // Read the intent at the COMMIT moment — after the player's last card, before any
      // turn-end bookkeeping. This is exactly what is on screen when they press End Turn.
      const shown = renderIntent(mv, sim.ctx(a));
      if (shown.error) { sim.playerTurnEndHooks(); continue; }
      // Then the engine's real order: onPlayerTurnEnd, Guard clears, onTurnStart (where
      // projected counters like Dust actually land), then the move resolves.
      sim.playerTurnEndHooks();
      a.block = 0;
      sim.hook(a, 'onTurnStart');
      sim.damageLog = [];
      try { mv.effect(sim.ctx(a)); }
      catch (e) { fail(`${def.id}.${mid}: effect threw — ${e.message}`); bad++; continue; }

      const toPlayer = sim.damageLog.filter(d => d.target === 'player');
      const dealt = toPlayer.reduce((n, d) => n + d.amount, 0);
      const isAttack = ATTACK_INTENTS.has(shown.intent);
      if (!isAttack) continue;

      const promisedHits = shown.hits || 0;
      const promised = (shown.damage || 0) * promisedHits;
      checked++;
      if (promisedHits > 1) multi++;

      if (dealt !== promised) {
        fail(`${def.id}.${mid} @Haunt ${HAUNT}: intent promises ${shown.damage}x${promisedHits} = ${promised}, `
           + `move actually dealt ${dealt} (${(dealt / (promised || 1)).toFixed(2)}x)`);
        bad++;
      } else if (toPlayer.length !== promisedHits) {
        fail(`${def.id}.${mid} @Haunt ${HAUNT}: intent promises ${promisedHits} hit(s), move produced `
           + `${toPlayer.length} damage event(s) — multi-hit animation and per-hit Guard will desync`);
        bad++;
      }
    }
  }
  }
  if (!bad) pass(`${checked} attack-move resolutions across Haunt 0 and 10 (${multi} multi-hit): damage dealt === damage promised, hit-for-hit`);
  log(`  every attack intent in the game was resolved and reconciled against its own event stream.`, 'dim');
}

// A direct guard on the helper itself, so the invariant is pinned at the source.
head('5c. hitPlayer hands the hit count to the engine exactly once');
{
  const calls = [];
  // `hitPlayer` names no target now, so the amount arrives first and the opts
  // second — the engine's `damage(amount, opts)` overload.
  const fakeCtx = { player: { id: 'player' }, damage: (n, o) => calls.push({ n, hits: (o && o.hits) || 1 }) };
  LIB.hitPlayer(fakeCtx, 7, 3);
  const totalHits = calls.reduce((s, c) => s + c.hits, 0);
  if (calls.length !== 1) fail(`hitPlayer(·,7,3) made ${calls.length} ctx.damage calls, expected exactly 1 — the engine does the looping`);
  else if (totalHits !== 3) fail(`hitPlayer(·,7,3) requested ${totalHits} hits, expected 3`);
  else pass('hitPlayer(·, 7, 3) → one ctx.damage call carrying {hits:3} → 21 total, never 63');
}

// ═════════════════════════════════════════════════════════════════════════════
// 5d. NOTHING LANDS UNANNOUNCED
// combat/intents.js reads `move.applies` / `move.appliesFn` to draw status pips on the
// intent. Any move that applies a status without declaring it is a silent effect, and
// silent effects that change next turn's damage are exactly what StS never does.
// ═════════════════════════════════════════════════════════════════════════════
head('5d. Declared statuses vs statuses actually applied');
{
  let undeclared = 0, declared = 0;
  // Self-inflicted bookkeeping the player does not need warned about on the intent.
  const EXEMPT = new Set(['discomposed']);
  for (const def of ENEMY_LIST) {
    for (const [mid, mv] of Object.entries(def.moves)) {
      // Give the move a populated board so ally-targeted effects actually fire.
      const partners = ENEMY_LIST.filter(d => d.region === def.region && d.id !== def.id && d.tier === 'normal').slice(0, 1);
      const sim = new MockCombat([def, ...partners], `applies:${def.id}:${mid}`);
      const a = sim.actors[0];
      a.hp = a.maxHp = 100000;
      sim.player.hp = sim.player.maxHp = 100000;
      sim.playerTurn({ cards: 2, dmg: 0, deferEnd: true });
      sim.player.hp = sim.player.maxHp = 100000;

      const c = sim.ctx(a);
      let promised = [];
      try {
        promised = (typeof mv.appliesFn === 'function' ? mv.appliesFn(c) : mv.applies) || [];
      } catch (e) { fail(`${def.id}.${mid}: appliesFn threw — ${e.message}`); continue; }

      sim.playerTurnEndHooks();
      a.block = 0;
      sim.hook(a, 'onTurnStart');
      sim.statusLog = [];
      try { mv.effect(sim.ctx(a)); } catch (e) { continue; }

      const applied = sim.statusLog.filter(x => !EXEMPT.has(x.id));
      const promisedIds = new Set(promised.map(x => x.id));
      const missing = [...new Set(applied.map(x => x.id))].filter(id => !promisedIds.has(id));
      if (missing.length) {
        fail(`${def.id}.${mid}: applies ${missing.join(', ')} but the intent declares `
           + `${promised.length ? [...promisedIds].join(', ') : 'nothing'} — it will land with no warning`);
        undeclared++;
      } else if (promised.length) {
        declared++;
        // Stacks must match too, or the pip lies about magnitude.
        for (const pr of promised) {
          const got = applied.filter(x => x.id === pr.id).reduce((n, x) => n + x.stacks, 0);
          const want = (pr.stacks ?? 1) * Math.max(1, applied.filter(x => x.id === pr.id).length ? 1 : 1);
          if (got && pr.to !== 'allies' && got !== want) {
            fail(`${def.id}.${mid}: intent says ${pr.stacks ?? 1} stack(s) of ${pr.id}, applied ${got}`);
            undeclared++;
          }
        }
      }
    }
  }
  if (!undeclared) pass(`${declared} moves declare their statuses, and no move applies one it did not declare`);
}

// ═════════════════════════════════════════════════════════════════════════════
// 5e. THE HAUNT LADDER ACTUALLY RUNS
// Every behavioural Haunt upgrade is a branch that only executes when its flag is set,
// and nothing else in this suite sets one — every earlier section builds enemies at
// Haunt 0. So the entire ascension ladder shipped untested, and a `rng` call that broke
// nextMove purity at Haunt 4 sailed straight through. Run the whole roster at every
// level, in both the normal and advanced encounter pools.
// ═════════════════════════════════════════════════════════════════════════════
head('5e. Every enemy at Haunt 0-10, normal and advanced pools');
{
  let crashes = 0, impure = 0, illegal = 0, ran = 0;
  for (const def of ENEMY_LIST) {
    for (let lvl = 0; lvl <= 10; lvl++) {
      for (const advanced of [false, true]) {
        const partners = ENEMY_LIST.filter(d => d.region === def.region && d.id !== def.id
          && d.tier === def.tier).slice(0, 1);
        const sim = new MockCombat([def, ...partners], `haunt:${def.id}:${lvl}:${advanced}`,
          { haunt: lvl, advanced });
        const a = sim.actors[0];
        a.hp = a.maxHp = 100000;
        try {
          for (let t = 0; t < 14; t++) {
            sim.playerTurn({ cards: 3, dmg: t % 3 === 0 ? 0 : 11 });
            for (const x of sim.actors) { if (!x.despawned) { x.hp = x.maxHp; x.alive = true; } }
            // purity under Haunt flags, which is where the rng-in-nextMove bug lived
            const before = snapshot(a);
            const id1 = a.def.nextMove(sim.ctx(a));
            const id2 = a.def.nextMove(sim.ctx(a));
            if (id1 !== id2) {
              fail(`${def.id} @Haunt ${lvl}${advanced ? ' (advanced)' : ''}: nextMove not deterministic `
                 + `(${id1} vs ${id2}) — the engine re-calls it on every intent refresh`);
              impure++; break;
            }
            if (snapshot(a) !== before) {
              fail(`${def.id} @Haunt ${lvl}: nextMove mutated state`); impure++; break;
            }
            if (!a.def.moves[id1]) {
              fail(`${def.id} @Haunt ${lvl}: illegal move id '${id1}'`); illegal++; break;
            }
            sim.enemyTurn({ fail: () => {} });
            sim.player.hp = sim.player.maxHp;
          }
          ran++;
        } catch (err) {
          fail(`${def.id} @Haunt ${lvl}${advanced ? ' (advanced)' : ''} threw: ${err && err.message}`);
          crashes++;
        }
      }
    }
  }
  if (!crashes && !impure && !illegal) {
    pass(`${ran} enemy/Haunt/pool combinations ran clean — no crash, no impure nextMove, no illegal move id`);
  }
}

head('5g. Each Haunt upgrade actually changes something observable');
{
  /**
   * A Haunt flag that is set but never read is dead content, and it looks identical to
   * working content in every other test here: §5e proves nothing crashes, §5f proves the
   * flag differs between levels. Neither notices a no-op. This section drives each new
   * upgrade and asserts a visible difference against the same enemy at Haunt 0.
   */
  const run = (id, lvl, turns, fn, partners = []) => {
    const defs = [getEnemy(id), ...partners.map(getEnemy)];
    const sim = new MockCombat(defs, `beh:${id}:${lvl}`, { haunt: lvl });
    const a = sim.actors[0];
    a.hp = a.maxHp = 100000;
    const seq = [];
    for (let t = 0; t < turns; t++) {
      sim.playerTurn({ cards: 3, dmg: 0 });
      for (const x of sim.actors) { if (!x.despawned) { x.hp = x.maxHp; x.alive = true; } }
      const acted = sim.enemyTurn({ fail: () => {} });
      const mine = acted.find(x => x.actor === a);
      if (mine) seq.push(mine.moveId);
      sim.player.hp = sim.player.maxHp;
    }
    return fn(sim, a, seq);
  };

  const check = (label, got, want) => (got === want ? pass(`${label} — ${got}`)
    : fail(`${label}: got ${got}, expected ${want} — the Haunt flag is set but nothing observable changed`));

  // H2 Door Greeter: two different rules appear over time, instead of only NO RUNNING.
  const rulesAt = (lvl) => run('door-greeter', lvl, 12,
    (sim) => new Set((sim.ruleLog || []).map(r => r.id)).size);
  check('H2 Door Greeter announces more than one kind of rule', rulesAt(2) > 1, true);
  check('  ...and at Haunt 0 still announces exactly one', rulesAt(0), 1);

  // H2 Patchwork Soldier: Patch Up may repeat back-to-back. The ally is held wounded
  // every turn, so a repair is always available and only the lockout decides the answer.
  const consecutivePatch = (lvl) => {
    const sim = new MockCombat([getEnemy('patchwork-soldier'), getEnemy('porcelain-doll')],
      `patch:${lvl}`, { haunt: lvl });
    const sol = sim.actors[0], ally = sim.actors[1];
    sol.hp = sol.maxHp = 100000;
    const seq = [];
    for (let t = 0; t < 12; t++) {
      sim.playerTurn({ cards: 1, dmg: 0 });
      sol.hp = sol.maxHp; sol.alive = true;
      ally.alive = true; ally.hp = Math.max(1, ally.maxHp - 20);   // always needs 12+
      const acted = sim.enemyTurn({ fail: () => {} });
      const mine = acted.find(x => x.actor === sol);
      if (mine) seq.push(mine.moveId);
      sim.player.hp = sim.player.maxHp;
    }
    return seq.some((m, i) => m === 'patch-up' && seq[i - 1] === 'patch-up');
  };
  check('H2 Patchwork Soldier repairs on consecutive turns', consecutivePatch(2), true);
  check('  ...and the one-turn lockout still holds at Haunt 0', consecutivePatch(0), false);

  // H4 Thing Beneath: the delayed scare exists at 4 and never at 0.
  const canLoom = (lvl) => {
    let seen = false;
    for (let seed = 0; seed < 12 && !seen; seed++) {
      const sim = new MockCombat([getEnemy('thing-beneath')], `loom:${lvl}:${seed}`, { haunt: lvl });
      const a = sim.actors[0]; a.hp = a.maxHp = 100000;
      for (let t = 0; t < 20; t++) {
        sim.playerTurn({ cards: 2, dmg: 0 });
        a.hp = a.maxHp; a.alive = true;
        const acted = sim.enemyTurn({ fail: () => {} });
        if (acted.some(x => x.moveId === 'loom')) { seen = true; break; }
        sim.player.hp = sim.player.maxHp;
      }
    }
    return seen;
  };
  check('H4 Thing Beneath can hold UNDER THE BED back a turn', canLoom(4), true);
  check('  ...and never does so at Haunt 0', canLoom(0), false);

  // H6 Porcelain Doll cracks itself out of Pristine.
  const selfCracks = (lvl) => {
    const sim = new MockCombat([getEnemy('porcelain-doll')], `crack:${lvl}`, { haunt: lvl });
    const a = sim.actors[0];
    let used = false;
    for (let t = 0; t < 8; t++) {
      sim.playerTurn({ cards: 1, dmg: 0 });
      a.hp = a.maxHp; a.alive = true;               // keep it Pristine so the choice is live
      const acted = sim.enemyTurn({ fail: () => {} });
      if (acted.some(x => x.moveId === 'hairline-crack')) { used = true; break; }
      sim.player.hp = sim.player.maxHp;
    }
    return used;
  };
  check('H6 Porcelain Doll cracks itself while Pristine', selfCracks(6), true);
  check('  ...and holds Perfect Posture at Haunt 0', selfCracks(0), false);

  // H7 Nightlight Snuffer puts out a real player buff.
  const snuffs = (lvl) => {
    const sim = new MockCombat([getEnemy('nightlight-snuffer'), getEnemy('thing-beneath')],
      `snuff:${lvl}`, { haunt: lvl });
    const a = sim.actors[0];
    sim.player.statuses.strength = 3;
    getEnemy('nightlight-snuffer').moves.snuff.effect(sim.ctx(a));
    return sim.player.statuses.strength;
  };
  check('H7 Snuff extinguishes a stack of Strength', snuffs(7), 2);
  check('  ...and leaves it alone at Haunt 0', snuffs(0), 3);

  // H8 The Butler's fifth rule enters the pool.
  const poolSize = (lvl) => {
    const sim = new MockCombat([getEnemy('butler')], `pool:${lvl}`, { haunt: lvl });
    return getEnemy('butler').rulePool(sim.ctx(sim.actors[0])).length;
  };
  check('H8 The Butler knows a fifth House Rule', poolSize(8), 5);
  check('  ...and only four below that', poolSize(7), 4);
}

head('5f. No Haunt level is a pure stat bump');
{
  // A level "has character" if some enemy changes behaviour there: a flag, a starting
  // counter, or a move override. hpMul alone does not count -- Courage is the laziest
  // ascension axis and the one the balance pass already ramps continuously.
  const perLevel = {};
  for (let lvl = 1; lvl <= 10; lvl++) {
    const changes = [];
    for (const def of ENEMY_LIST) {
      if (!def.hauntScaling) continue;
      const now = def.hauntScaling(lvl), prev = def.hauntScaling(lvl - 1);
      const key = (h) => JSON.stringify([h.flags, h.counters, h.moves,
        h.advanced?.flags, h.advanced?.counters]);
      if (key(now) !== key(prev)) changes.push(def.id);
    }
    perLevel[lvl] = changes;
  }
  let bare = 0;
  // Haunt 1 is deliberately exempt. All three region docs define it identically as the
  // Courage calibration step (+8% ordinary / +6% Big Scare and boss), and it is the one
  // level whose intended statement really is "the same fight, slightly tougher". Every
  // level above it has to earn its place by changing behaviour.
  for (let lvl = 2; lvl <= 10; lvl++) {
    const n = perLevel[lvl].length;
    if (!n) { fail(`Haunt ${lvl} changes no enemy behaviour — it is a pure Courage bump`); bare++; }
    else log(`    Haunt ${String(lvl).padStart(2)}: ${String(n).padStart(2)} enem${n === 1 ? 'y' : 'ies'} change behaviour  `
      + `${perLevel[lvl].slice(0, 6).join(', ')}${n > 6 ? ', …' : ''}`, 'dim');
  }
  log(`    Haunt  1: Courage only, by design (all three region docs define it that way).`, 'dim');
  if (!bare) pass('every Haunt level from 2 to 10 changes how at least one enemy behaves');
}

head('6. Haunt scaling summary');
for (const def of ENEMY_LIST) {
  const notes = [];
  for (let l = 1; l <= 10; l++) {
    const h = def.hauntScaling(l);
    const prev = def.hauntScaling(l - 1);
    const fresh = h.notes.filter(n => !prev.notes.includes(n));
    for (const n of fresh) notes.push(`H${l}: ${n}`);
  }
  log(`  ${def.name}`);
  for (const n of notes) log(`    ${n}`, 'dim');
}
