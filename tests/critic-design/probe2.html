<!doctype html>
<meta charset="utf-8">
<title>probe: can we drive the real Run headlessly?</title>
<body><pre id="out">running…</pre></body>
<script type="module">
import { Run } from '/game/src/state/run.js';
import { NodeType } from '/game/src/data/schema.js';

const R = { ok: false, steps: [], err: null };
try {
  const run = new Run({ companion: 'marmalade', seed: 4242, hauntLevel: 0 });
  run.ephemeral = true;
  R.map = { rows: run.map.rows, lanes: run.map.lanes, nodes: run.map.nodes.length,
            starts: run.map.startIds.length,
            types: run.map.nodes.reduce((a, n) => { a[n.type] = (a[n.type] || 0) + 1; return a; }, {}) };
  R.courage = run.courage; R.maxCourage = run.maxCourage;
  R.deck = run.deck.map(c => c.id);
  R.keepsakes = run.keepsakes.map(k => k.id);
  R.lostThings = run.lostThings;

  // walk into the first start node
  const first = run.map.startIds[0];
  await run.enterNode(first);
  R.steps.push({ node: first, type: run.effectiveType(run.currentNode), hasCombat: !!run.combat,
                 meta: run.combatMeta });
  const e = run.combat;
  if (e) {
    await e.startCombat();
    R.combat = {
      enemies: e.enemies.map(x => ({ id: x.id, name: x.name, hp: x.hp, intent: x.intent?.moveId, dmg: x.intent?.totalDamage })),
      hand: e.state.piles.hand.map(c => ({ id: c.id, cost: c.cost, playable: c.playable, d: c.display?.d?.value, b: c.display?.b?.value })),
      energy: e.player.energy,
    };
    // play a card
    const h = e.state.piles.hand.filter(c => c.playable);
    if (h.length) await e.playCard(h[0].uid, e.livingEnemies()[0]?.id || null);
    await e.endTurn();
    R.afterTurn = { turn: e.turn, php: e.player.hp, ehp: e.enemies.map(x => x.hp) };
    let guard = 0;
    while (!e.over && guard++ < 40) {
      const hand = e.state.piles.hand.filter(c => c.playable);
      for (const c of hand) { if (e.over) break; await e.playCard(c.uid, e.livingEnemies()[0]?.id || null); }
      if (!e.over) await e.endTurn();
    }
    R.fightEnd = { over: e.over, victory: e.victory, turns: e.turn, courageAfter: run.courage,
                   pendingReward: run.pendingReward };
  }
  // take a reward and claim
  if (run.pendingReward) {
    const cards = run.pendingReward.cards;
    if (cards.length) run.takeRewardCard(cards[0].id);
    run.claimReward();
    R.afterReward = { deck: run.deck.length, lostThings: run.lostThings, node: run.currentNodeId };
  }
  R.legalNext = run.legalNodes().map(n => ({ id: n.id, type: run.effectiveType(n), row: n.row }));
  R.ok = true;
} catch (err) {
  R.err = String(err && err.stack || err);
}
window.__PROBE2__ = R;
window.__DONE__ = true;
document.getElementById('out').textContent = JSON.stringify(R, null, 1);
</script>
