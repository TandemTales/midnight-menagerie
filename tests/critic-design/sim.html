<!doctype html>
<meta charset="utf-8">
<title>balance sim — whole-region expeditions</title>
<body><pre id="out" style="font:12px ui-monospace,monospace">running…</pre></body>
<script type="module">
/**
 * The balance instrument. OWNER: balance.
 *
 * v2 — it plays a RUN. The previous version brought the unmodified 10-card
 * starting deck to every encounter including the region boss, which meant
 * Ignores-Guard (an uncommon and a rare) was unmeasurable, Haunt contributed
 * ~1.4 Courage per fight from a single Boo!, and the Butler's 250 Courage was
 * being judged against the tutorial. It also had exactly one bot, and that bot
 * blocked precisely the telegraphed number, which makes any solo enemy
 * structurally unloseable no matter what its damage says.
 *
 * Now: real `Run`, real map, real card rewards drafted by a policy, real
 * Keepsakes at the rate the run layer grants them, Snacks bought and eaten,
 * Courage carried between rooms, Safe Rooms healing and upgrading — walked node
 * by node to the boss. Two bots, and the gap between them is reported, because
 * if there is no gap then decisions do not matter.
 *
 *   ?n=25&bots=naive,competent&policies=balanced,greedy-damage,defensive,
 *    archetype-haunt,archetype-ghoststep&haunt=0&bench=40&clutter=1
 */
import { expedition, bench } from './lib/expedition.js';
import { POLICIES } from './lib/policy.js';

const Q = new URLSearchParams(location.search);
const N = +(Q.get('n') || 12);
const BOTS = (Q.get('bots') || 'naive,competent').split(',').filter(Boolean);
const POLS = (Q.get('policies') || 'balanced').split(',').filter(Boolean);
const HAUNT = +(Q.get('haunt') || 0);
const BENCH = +(Q.get('bench') || 0);
const CLUTTER = Q.get('clutter') !== '0';
const SEED0 = +(Q.get('seed') || 90000);
// WHAT-IF ONLY: restore this fraction of maximum Courage when a region is
// cleared. 0 = shipping behaviour. See lib/expedition.js.
const REGIONHEAL = +(Q.get('regionheal') || 0);

const out = document.getElementById('out');
const say = (s) => { out.textContent += '\n' + s; };
out.textContent = `sim v2  n=${N} bots=${BOTS} policies=${POLS} haunt=${HAUNT} bench=${BENCH}`;

// ── stats helpers ────────────────────────────────────────────────────────────
function stats(a) {
  if (!a.length) return { n: 0 };
  const s = a.slice().sort((x, y) => x - y);
  const sum = s.reduce((p, q) => p + q, 0);
  return {
    n: s.length, mean: +(sum / s.length).toFixed(2),
    min: s[0], max: s[s.length - 1],
    p25: s[Math.floor(s.length * .25)], med: s[Math.floor(s.length * .5)],
    p75: s[Math.floor(s.length * .75)],
  };
}
const pct = (a, b) => (b ? +(a / b * 100).toFixed(1) : 0);

const TIER_BUCKET = (t) => (t === 'boss' ? 'boss' : t === 'elite' ? 'elite' : 'scuffle');

const LEDGER_KEYS = ['scuffle', 'elite', 'boss', 'event', 'hazard', 'rested', 'healed', 'combatHeal', 'rests'];

/** Fight-tier breakdown for one bag of fights. */
function tiers(fights) {
  const buckets = { scuffle: [], elite: [], boss: [] };
  for (const f of fights) buckets[TIER_BUCKET(f.tier)].push(f);
  const T = {};
  for (const [k, fs] of Object.entries(buckets)) {
    if (!fs.length) { T[k] = { n: 0 }; continue; }
    T[k] = {
      n: fs.length,
      winRate: pct(fs.filter(f => f.win).length, fs.length),
      turns: stats(fs.map(f => f.turns)),
      courageCost: stats(fs.map(f => f.dmgTaken)),
      hauntDamage: stats(fs.map(f => f.hauntDamage)),
      pierceHits: fs.reduce((s, f) => s + f.pierceHits, 0),
      snacksUsed: fs.reduce((s, f) => s + f.snacksUsed, 0),
      timeouts: fs.filter(f => f.timeout).length,
    };
  }
  return T;
}

/**
 * One region's slice, across every expedition that entered it.
 *
 * `entered` is the denominator that matters for a second region: region-2
 * numbers conditioned on "you got here" are the only honest ones, and the
 * unconditional whole-run survival is reported separately.
 */
function summariseRegion(slices, totalRuns) {
  const S = { region: slices[0]?.region || '?', index: slices[0]?.index ?? 0 };
  S.entered = slices.length;
  S.enteredPct = pct(slices.length, totalRuns);
  S.cleared = slices.filter(s => s.cleared).length;
  S.clearedPct = pct(S.cleared, slices.length);
  S.reachedBoss = pct(slices.filter(s => s.reachedBoss).length, slices.length);
  S.bossWinGivenReached = pct(slices.filter(s => s.bossWin).length,
    Math.max(1, slices.filter(s => s.reachedBoss).length));
  S.bossN = slices.filter(s => s.reachedBoss).length;
  S.byTier = tiers(slices.flatMap(s => s.fights));

  // the first three Scuffles of THIS region — a second region opens with a
  // built deck, so its opening cost is a different question from the Foyer's
  const early = slices.flatMap(s => s.fights.filter(f => TIER_BUCKET(f.tier) === 'scuffle').slice(0, 3));
  S.earlyScuffles = early.length ? {
    n: early.length, turns: stats(early.map(f => f.turns)),
    courageCost: stats(early.map(f => f.dmgTaken)),
    freeFights: pct(early.filter(f => f.dmgTaken === 0).length, early.length),
  } : { n: 0 };

  S.ledger = {};
  for (const k of LEDGER_KEYS) {
    S.ledger[k] = +(slices.reduce((s, x) => s + (x.ledger?.[k] || 0), 0) / Math.max(1, slices.length)).toFixed(1);
  }
  S.visited = {};
  for (const s of slices) for (const [k, v] of Object.entries(s.visited || {})) S.visited[k] = (S.visited[k] || 0) + v;
  for (const k of Object.keys(S.visited)) S.visited[k] = +(S.visited[k] / slices.length).toFixed(2);

  const atBoss = slices.filter(s => s.loadoutAtBoss);
  S.courageAtBoss = stats(atBoss.map(s => s.loadoutAtBoss.courage));
  S.courageAtBossPct = stats(atBoss.map(s => Math.round(s.loadoutAtBoss.courage / s.loadoutAtBoss.maxCourage * 100)));
  S.deckAtBoss = stats(atBoss.map(s => s.loadoutAtBoss.deck.length));
  S.upgradesAtBoss = stats(atBoss.map(s => s.loadoutAtBoss.deck.filter(c => c.upgraded).length));
  S.keepsakesAtBoss = stats(atBoss.map(s => s.loadoutAtBoss.keepsakes.length));

  S.entryDeck = stats(slices.map(s => s.entry.deck));
  S.entryUpgrades = stats(slices.map(s => s.entry.upgrades));
  S.entryKeepsakes = stats(slices.map(s => s.entry.keepsakes));
  S.entryCourage = stats(slices.map(s => s.entry.courage));
  S.entryMaxCourage = stats(slices.map(s => s.entry.maxCourage));
  S.entryCouragePct = stats(slices.map(s => Math.round(s.entry.courage / s.entry.maxCourage * 100)));
  return S;
}

function summarise(runs) {
  const S = { expeditions: runs.length };
  // Whole-LADDER survival: cleared every region the build ships.
  S.survival = pct(runs.filter(r => r.result === 'victory').length, runs.length);
  S.deaths = runs.filter(r => r.result === 'defeat').length;
  S.stalls = runs.filter(r => r.result === 'stall' || r.result === 'incomplete').length;
  S.reachedBoss = pct(runs.filter(r => r.reachedBoss).length, runs.length);
  S.regionsTarget = runs[0]?.regionsTarget ?? 1;
  S.regionsCleared = stats(runs.map(r => r.regionsCleared || 0));

  const deathAt = {};
  for (const r of runs) {
    if (r.result !== 'defeat') continue;
    const k = `${r.deathRegion || '?'}/${r.deathType || '?'}`;
    deathAt[k] = (deathAt[k] || 0) + 1;
  }
  S.deathsBy = deathAt;

  S.byTier = tiers(runs.flatMap(r => r.fights));
  const early = runs.flatMap(r => r.fights.filter(f => TIER_BUCKET(f.tier) === 'scuffle').slice(0, 3));
  S.earlyScuffles = early.length ? {
    n: early.length, turns: stats(early.map(f => f.turns)),
    courageCost: stats(early.map(f => f.dmgTaken)),
    freeFights: pct(early.filter(f => f.dmgTaken === 0).length, early.length),
  } : { n: 0 };

  S.ledger = {};
  for (const k of LEDGER_KEYS) S.ledger[k] = +(runs.reduce((s, r) => s + (r.ledger?.[k] || 0), 0) / Math.max(1, runs.length)).toFixed(1);
  S.visited = {};
  for (const r of runs) for (const [k, v] of Object.entries(r.visited || {})) S.visited[k] = (S.visited[k] || 0) + v;
  for (const k of Object.keys(S.visited)) S.visited[k] = +(S.visited[k] / runs.length).toFixed(2);
  S.courageAtBoss = stats(runs.filter(r => r.loadoutAtBoss).map(r => r.loadoutAtBoss.courage));
  S.courageAtBossPct = stats(runs.filter(r => r.loadoutAtBoss)
    .map(r => Math.round(r.loadoutAtBoss.courage / r.loadoutAtBoss.maxCourage * 100)));
  S.deckEnd = stats(runs.map(r => (r.deckEnd || []).length));
  S.upgradesEnd = stats(runs.map(r => (r.deckEnd || []).filter(x => x.endsWith('+')).length));
  S.keepsakesEnd = stats(runs.map(r => (r.keepsakesEnd || []).length));
  S.endCourage = stats(runs.map(r => r.endCourage));
  S.hauntTotal = runs.reduce((s, r) => s + r.fights.reduce((t, f) => t + f.hauntDamage, 0), 0);
  S.pierceTotal = runs.reduce((s, r) => s + r.fights.reduce((t, f) => t + f.pierceHits, 0), 0);
  S.msPerRun = +(runs.reduce((s, r) => s + r.ms, 0) / Math.max(1, runs.length)).toFixed(0);

  // ── per region ─────────────────────────────────────────────────────────────
  const byIndex = new Map();
  for (const r of runs) for (const g of (r.regions || [])) {
    if (!byIndex.has(g.index)) byIndex.set(g.index, []);
    byIndex.get(g.index).push(g);
  }
  S.regions = [...byIndex.keys()].sort((a, b) => a - b)
    .map(i => summariseRegion(byIndex.get(i), runs.length));
  return S;
}

// ── run ──────────────────────────────────────────────────────────────────────
const RESULT = { config: { N, BOTS, POLS, HAUNT, BENCH, CLUTTER, SEED0, REGIONHEAL }, cells: {}, bench: {}, errors: [] };
// keyed `${regionId}/${tier}` — a second region needs its own loadout pool,
// because the deck that meets The Governess is not the deck that met the Butler
const loadouts = new Map();
const push = (k, v) => { if (!loadouts.has(k)) loadouts.set(k, []); loadouts.get(k).push(v); };

for (const bot of BOTS) {
  for (const policy of POLS) {
    const key = `${bot}/${policy}`;
    const runs = [];
    for (let i = 0; i < N; i++) {
      try {
        const r = await expedition({ seed: SEED0 + i * 7, bot, policy, haunt: HAUNT, clutter: CLUTTER, regionHeal: REGIONHEAL });
        runs.push(r);
        for (const g of r.regions || []) {
          if (g.loadoutAtBoss) push(`${g.region}/boss`, { bot, policy, l: g.loadoutAtBoss });
          if (g.loadoutAtFirstElite) push(`${g.region}/elite`, { bot, policy, l: g.loadoutAtFirstElite });
        }
      } catch (err) {
        RESULT.errors.push(`${key} seed ${SEED0 + i * 7}: ${err && (err.stack || err.message || err)}`);
      }
      if (i % 5 === 4) say(`  ${key}: ${i + 1}/${N}`);
    }
    RESULT.cells[key] = summarise(runs);
    RESULT.cells[key].sample = runs.slice(0, 3).map(r => ({
      seed: r.seed, result: r.result, killedBy: r.killedBy, deathRegion: r.deathRegion,
      nodes: (r.regions || []).map(g => g.nodes.map(n => n.type[0]).join('')).join(' | '),
      deck: r.deckEnd, keepsakes: r.keepsakesEnd,
    }));
    const rr = RESULT.cells[key].regions.map(g => `${g.region} ${g.enteredPct}%→${g.clearedPct}%`).join('  ');
    say(`${key}: whole-run ${RESULT.cells[key].survival}%   ${rr}`);
  }
}

// ── benches: the boss and the elite of EVERY region, fought many times with
//    loadouts real expeditions were actually carrying at that door ────────────
if (BENCH > 0) {
  for (const poolKey of [...loadouts.keys()].sort()) {
    const [regionId, tier] = poolKey.split('/');
    const pool = loadouts.get(poolKey);
    if (!pool.length) { RESULT.bench[poolKey] = { n: 0, note: 'no expedition reached it' }; continue; }
    for (const bot of BOTS) {
      const rows = [];
      for (let i = 0; i < BENCH; i++) {
        // Stride the whole pool instead of taking its first BENCH entries.
        // The naive loop fills the pool first, so `i % pool.length` benched
        // almost entirely naive-run loadouts once the pool grew past BENCH —
        // which is exactly the selected-for-luck subset. Measured: the
        // Governess read 75-77.5% on the biased sample against 60.5-61.9%
        // in-run on the same two seeds. Striding closes it.
        const pick = pool[Math.floor(i * pool.length / BENCH) % pool.length];
        try {
          rows.push(await bench({
            loadout: pick.l, encounterTier: tier, seed: 500000 + i * 13,
            bot, haunt: HAUNT, clutter: CLUTTER, region: regionId,
          }));
        } catch (err) { RESULT.errors.push(`bench ${poolKey}/${bot} ${i}: ${err && (err.stack || err.message)}`); }
      }
      if (!rows.length) continue;
      RESULT.bench[`${poolKey}/${bot}`] = {
        n: rows.length,
        winRate: pct(rows.filter(r => r.win).length, rows.length),
        turns: stats(rows.map(r => r.turns)),
        courageCost: stats(rows.map(r => r.dmgTaken)),
        hpAfter: stats(rows.map(r => r.hpAfter)),
        hauntDamage: stats(rows.map(r => r.hauntDamage)),
        pierceHits: rows.reduce((s, r) => s + r.pierceHits, 0),
        timeouts: rows.filter(r => r.timeout).length,
        deckSize: stats(rows.map(r => r.deckSize)),
        upgrades: stats(rows.map(r => r.upgrades)),
        keepsakes: stats(rows.map(r => r.keepsakes)),
        byEncounter: rows.reduce((a, r) => {
          const k = r.encounter || '?';
          a[k] = a[k] || { n: 0, wins: 0 };
          a[k].n++; if (r.win) a[k].wins++;
          return a;
        }, {}),
      };
      say(`bench ${poolKey}/${bot}: ${RESULT.bench[`${poolKey}/${bot}`].winRate}%`);
    }
  }
}

window.__RESULT__ = RESULT;
window.__DONE__ = true;
say('DONE');
</script>
