<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Menagerie — run layer simulation</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 28px 60px; background: #0d0b16; color: #c3bbcd;
         font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

<body>
<h1>Run layer — headless simulation</h1>
<div class="sub">
  50 seeded expeditions driven straight through <code>state/run.js</code>: map &rarr; combat &rarr;
  reward &rarr; next node &rarr; &hellip; &rarr; boss. No scenes, no DOM, no rendering.
  Asserts determinism, autosave/resume round-trips and resource sanity.
</div>
<div id="summary">running&hellip;</div>
<div id="out"></div>

<script type="module">
import { RNG, hashSeed } from '../../game/src/core/rng.js';
import { Save } from '../../game/src/core/save.js';
import { Run, STARTER_SLUGS, RUN_LENGTH_REGIONS, RUN_REGIONS, EXPEDITION_WINGS, wingOffer, openExitsFor } from '../../game/src/state/run.js';
import { NodeType, REGION_ORDER } from '../../game/src/data/schema.js';
import { REGION_EXITS } from '../../game/src/state/mapgen.js';
import { ENCOUNTER_LIST } from '../../game/src/data/encounters.js';
import { cardById, companionSlugs } from '../../game/src/data/cards.js';
import * as R from '../../game/src/data/relics.js';
import * as P from '../critic-design/lib/policy.js';
import { competentTurn, naiveTurn } from '../critic-design/lib/bot.js';

const out = document.getElementById('out');
const sum = document.getElementById('summary');
const say = (html, cls = '') => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; out.appendChild(d); };

const errors = [];

/**
 * Claim the purse, and if that cleared a wing, choose the way on.
 *
 * Since 2026-09-06 a cleared boss does not hand the party the next wing: it
 * opens two or three ways on and waits (`Run#openWingFork`). Every driver in
 * this file used to be able to call `claimReward()` and carry on; now they have
 * to choose, exactly as a player does. Uniform among what the house offers,
 * from a keyed fork so the pick takes nothing from the run's master stream and
 * a seed still reproduces the whole expedition. `voteWing` resolves on the
 * first vote for a party of one and crosses.
 */
function claimAndCross(run) {
  const r = run.claimReward();
  if (run.pendingWing) {
    const opts = run.pendingWing.options;
    run.voteWing(opts[run.fork(`gate:wing:${run.regionIndex}`).int(opts.length)].to);
  }
  return r;
}

let ENDS_DETAIL = [], DEPTH_FRAC = 0;
/* Which kinds of room the 50 expeditions actually enter. A deliberate router
   is a better player and a WORSE sampler, and the trade is only acceptable if
   it is watched: a harness that quietly stopped entering Big Scares would keep
   printing green while covering less than the random one it replaced. */
const VISITED = {};
const REACH = [];
/** How many of the fifty expeditions routed through each wing. */
const ROUTED = [];
/** Where four thousand routes go — the reachability gate. */
const ROUTE_SWEEP = [];
/** Cost-per-fight by region — the ladder priced rather than guessed at. */
const LEDGER_TABLE = [];
/** Keepsakes and cards handed over, by room kind. */
const PURSE_TABLE = [];
/** The longest fight, against `_losePatience`'s claim of being unreachable. */
let PATIENCE_ROW = null;
let PIERCE_ROW = null;
let SOURCE_ROWS = null;
/** Which authored formations the fifty expeditions ever actually roll. */
const REACHABLE_TABLE = [];
/** Which TIER band the fights that happened were drawn from. */
const TIER_TABLE = [];
/** Does the tutorial region teach what its own chapter says it teaches? */
const TEACH_TABLE = [];
let TEACH_COVER = null;
/** The first wing priced by DEPTH rather than as one average. */
const DEPTH_TABLE = [];
/** What the player brings to each boss door, against what the boss costs. */
const ARRIVAL_TABLE = [];
let VICTORIES = null;
/** Boss fights that ended in a draw. A balance finding, counted so it cannot
    go quiet — see `playCombat`. */
const DRAWS = [];
const fail = (msg) => { errors.push(msg); };
const check = (cond, msg) => { if (!cond) fail(msg); return !!cond; };

/* ────────────────────────────────────────────────────────────────────────────
   An in-memory stand-in for localStorage.

   The run autosaves after every state change and a snapshot carries the whole
   region map, so 50 expeditions against the real localStorage is tens of
   thousands of multi-kilobyte string writes and the harness spends its life in
   the storage layer rather than in the code under test.  Three runs at the end
   go through the REAL Save/localStorage path to prove that seam works.
   ──────────────────────────────────────────────────────────────────────────── */
const realSaveRun = Save.saveRun.bind(Save);
const realLoadRun = Save.loadRun.bind(Save);
const realClear   = Save.clearRun.bind(Save);
let MEM = null;
let saveCount = 0;
function useMemorySave() {
  Save.saveRun = (s) => { saveCount++; MEM = JSON.stringify(s); };
  Save.loadRun = () => (MEM ? JSON.parse(MEM) : null);
  Save.clearRun = () => { MEM = null; };
}
function useRealSave() {
  Save.saveRun = realSaveRun; Save.loadRun = realLoadRun; Save.clearRun = realClear;
}

/* ────────────────────────────────────────────────────────────────────────────
   Meta-progression isolation.

   A seed reproduces a run *given the same meta state* — and that is on purpose:
   `generateRegionMap` is handed `rescued`, because the design doc's premise is
   that "the house reacts differently to different Kids and Companions".  A run
   that ends writes its rescues into Save.data, so run #2 of a batch legitimately
   gets a different Foyer from run #1 with the same seed.  Every simulation here
   therefore starts from a pristine meta save, and the determinism test restores
   it before replaying.
   ──────────────────────────────────────────────────────────────────────────── */
const PRISTINE_META = JSON.parse(JSON.stringify(Save.data));
function resetMeta() { Save.data = JSON.parse(JSON.stringify(PRISTINE_META)); }

/* ── deck-building ────────────────────────────────────────────────
   The combat bot below scores every PLAY with the engine's own `preview()`.
   Until 2026-08-30 it then built its DECK with a die: a random one of the three
   offered cards 70% of the time, and three independent coin-flips at the shop.
   So it played a considered game with a random pile — it reached the Butler on
   about fourteen cards holding a mean of 177 unspent Lost Things, 46 of 50 runs
   died inside the Foyer, and no content past region 1 was exercised by anything.

   `tests/critic-design/lib/policy.js` is this project's existing answer to
   "what would a player take": `draft`, `shopPlan`, `restChoice`, `pickUpgrade`
   and `pickEventOption`, driven off each Companion's own declared archetypes.
   `expedition.js` has drafted with it since the balance sim was built, so
   reusing it here also stops the two harnesses disagreeing about what a run is.

   It is a HEURISTIC and not a solver, which is exactly the bar this harness
   needs: deck-building as considered as the combat already was, so that
   reaching the Nursery is ordinary. It is not trying to be a good player.
   Every function in it is pure, so the run stays reproducible off its seed.  */
const POLICY = 'balanced';
const draftCtx = (run) => ({
  core: P.coreSets(run.companion), deckSize: run.deck.length, skipFloor: 4,
});
/** The card in `cards` a player would pay Mr. Moth to forget. */
function leastValuable(run, cards) {
  const ctx = draftCtx(run);
  let worst = null;
  for (const c of cards) {
    const def = cardById(c.id);
    if (!def) continue;
    const v = P.cardValue(def, POLICY, ctx);
    if (!worst || v < worst.v) worst = { uid: c.uid, v };
  }
  return worst?.uid || null;
}

/* ── the combat bot ─────────────────────────────────────────────────────────
   `competentTurn` from the balance harness — the SAME bot the Butler's 64.6%
   and every tuned number in tests/critic-design were measured against.

   Until 2026-08-30 this was a private greedy bot: score each card with
   `preview()`, play the best, repeat. It won about one fight in six against
   the Butler where the balance bot wins two in three, and it never ate a Snack,
   so the run layer bought them, carried them and threw them away unopened. TWO
   BOTS THAT DISAGREE ABOUT WHAT A PLAYER IS produce two pictures of the game
   and neither can be believed over the other; this harness's was the
   pessimistic one, which is how "46 of 50 runs die in the Foyer" came to read
   as a fact about the content rather than about the harness.

   It is a beam search that scores a whole turn by simulating the enemy phase
   that follows it, so it is far slower per turn than what it replaces. That is
   paid once, here, and it buys every region past the first.

   `budgetTurns` is 120, not the balance harness's 60. This one has to resolve
   EVERY fight the run layer can produce and an unresolved fight is reported as
   a failure rather than hidden as a timeout — so the budget has to clear the
   longest legitimate fight in the game, which is now the Keeper.

   It was 80, then 120, and neither fitted. Measured against a competent bot
   with a drafted deck at a 170 Courage pool:

     the Butler            100% win   11 turns median   (authored band 8-12)
     the Confectioner       83%       26
     the Groundskeeper      25%       34   (one fight in twelve past 120)
     the Keeper              8%       36

   That length is not a bug in the harness and it has NOT been tuned away. Both
   of those bosses carry the design's own Courage for the end of a SEVENTEEN-wing
   expedition and this ladder is seven wings long. Fitting a boss to a ladder
   that is about to grow by ten more regions is the curve-to-a-broken-instrument
   mistake CONTRACTS 47 is about, so the numbers stay, the budget covers the
   longest fight that legitimately happens, and the measurement is written down
   instead. THE MEASUREMENT IS THE OPEN ITEM, not the constant below.          */
/* ── THE DEEP PROBE, opt-in and off in the gate ────────────────────────

   `?probe=<seed index>` runs ONE expedition and records, per fight, what the
   summary columns above cannot separate.

   WHY IT EXISTS. The summary reports seed 957908's greenhouse Scuffle at
   `wall 10.3` against `land 3.3` and that ratio reads as a board re-raising
   three times faster than the deck gets through. Four sessions have now named
   a cause off a ratio of that shape and been wrong every time, because
   **`wall` is Guard GRANTED, not Guard that stopped anything.** Guard the deck
   never tests is wiped at the body's own turn start and adds to `wall`
   exactly as much as Guard that ate a hit. A board carrying one big idle body
   therefore reads as a wall whether or not the deck ever swung at it.

   So the discriminator is per BODY, and it is three columns where the summary
   has one:

     raised    Guard the body was granted across the fight
     consumed  Guard a hit actually spent — `blocked` on damage aimed AT it
     landed    damage that reached that body's Courage

   A wall the deck is throwing itself at has `consumed` close to `raised` on
   the body being hit. Guard on a body nobody attacks has `consumed` near zero
   and is decoration that the summary is pricing as a wall. The two demand
   opposite fixes and `wall` alone cannot tell them apart.

   Off unless `?probe=` is passed, so the gate's own numbers are untouched.  */
const PROBE = (() => {
  const q = new URLSearchParams(location.search);
  const i = q.get('probe');
  /* `?naive=<encounter id>` swaps the bot for the naive heuristic in THAT
     encounter only. Swapping it everywhere is confounded and the guard-axis
     note says why: naive dies in the Foyer in 43 of 50 runs, so the long
     fights vanish because it never reaches them. Held to one encounter, the
     deck, the route and the board are the competent bot's and the only
     variable that moves is who plays this fight. */
  return { on: i !== null && i !== '', index: Number(i) || 0,
           naive: q.get('naive') || null, fights: [] };
})();

async function playCombat(engine, budgetTurns = 200, run = null) {
  /* THE GUARD AXIS, the same two listeners `fight()` in
     tests/critic-design/lib/expedition.js has always used. An enemy's Guard
     is wiped and re-granted at the start of its own turn, so what the player
     must beat is what the board raises PER TURN - engine.js ~2918. Below the
     wall the Courage bar never moves however long the fight runs, and that is
     a different defect from a fight that is merely long. `dealt` is damage
     that LANDED, `blockedByEnemies` is damage Guard ate, `enemyGuard` is Guard
     granted; the caller turns them into per-turn rates. */
  const gx = { dealt: 0, blockedByEnemies: 0, enemyGuard: 0,
               samples: 0, nerveSum: 0, handSum: 0, playSum: 0, bySource: {},
               bodies: {}, perTurn: [], plays: {} };
  /* Per-body rows are created by whichever event mentions the body first,
     so a summon that never blocks and a blocker that never takes a hit both
     still get a row. Names are filled in from the board at the end. */
  const body = (id) => (gx.bodies[id] ||= { id, name: '?', defId: null,
    raised: 0, consumed: 0, landed: 0, hits: 0 });
  engine.on('damage', (ev) => {
    if (ev.targetId === engine.player.id) {
      /* WHO IS ACTUALLY HURTING YOU. Two bosses resisted every number we moved
         - the Governess shrugged off a 26% Courage cut (62% -> 60% of the pool)
         AND a 34% damage cut (65% -> 64%), and the Archivist did the same - so
         the cost is not in the body's pool or its printed attacks. It is in
         something else on the board: a summon, a redirect, a status tick. A
         total cannot say which, and `sourceName` has been on every damage event
         all along. */
      if (ev.hpLoss > 0) {
        const k = ev.sourceName || ev.cause || 'the house';
        gx.bySource[k] = (gx.bySource[k] || 0) + ev.hpLoss;
      }
      return;
    }
    gx.dealt += ev.hpLoss;
    gx.blockedByEnemies += ev.blocked || 0;
    if (PROBE.on) {
      const b = body(ev.targetId);
      b.name = ev.targetName || b.name;
      b.consumed += ev.blocked || 0;
      b.landed += ev.hpLoss || 0;
      b.hits++;
    }
  });
  engine.on('block', (ev) => {
    if (ev.actorId !== engine.player.id) gx.enemyGuard += ev.amount || 0;
    if (PROBE.on && ev.actorId !== engine.player.id) body(ev.actorId).raised += ev.amount || 0;
  });
  /* WHAT THE DECK PUT OUT, card by card. `swing` says a deck managed 5.5 a
     turn where a healthy one runs 12-16; it cannot say whether that is a
     thin hand, cheap cards, or the bot spending its Nerve on defence. */
  if (PROBE.on) engine.on('card:play', (ev) => {
    const id = ev.card && ev.card.id;
    if (id) (gx.plays[id] ||= { id, n: 0, cost: ev.cost || 0 }).n++;
  });
  engine.__guard = gx;
  await engine.startCombat();
  // Per-fight running estimates the bot projects the rest of the fight from.
  // One object per fight, never shared between fights.
  const fc = { dps: 10, threat: 8, guard: 4, peak: 0, turns: 0 };
  const onSnack = (i, s) => {
    if (run && Array.isArray(run.snacks)) {
      const at = run.snacks.indexOf(s);
      if (at >= 0) run.snacks.splice(at, 1);
    }
  };
  let turns = 0;
  while (!engine.over && turns++ < budgetTurns) {
    /* WHY A TURN PLAYED NOTHING. bot.js:307 breaks its play loop the moment no
       card passes `canPlay`, so a fight at cpt 0.2 is one where almost every
       turn had nothing legal. Three different causes produce that and they are
       not the same bug: no Nerve, no cards in hand, or a hand full of cards
       that are individually illegal. Sampled BEFORE the bot acts, so this is
       what it was handed, not what it left behind. */
    {
      const seat = engine.player;
      const h = (seat && seat.piles && seat.piles.hand) || [];
      gx.samples++;
      gx.nerveSum += engine.energy || 0;
      gx.handSum += h.length;
      gx.playSum += h.filter(c => !c.unplayable && engine.canPlay(c.uid, null).ok).length;
    }
    /* ONE ROW PER ROUND, closed after the enemy phase so a status tick or a
       thorn lands in the round that caused it. Guard ON BOARD is sampled
       before the bot acts: it is what the deck was actually asked to beat,
       which is not the same number as the Guard the board was granted. */
    let pt = null;
    if (PROBE.on) {
      const seat = engine.player;
      const h = (seat && seat.piles && seat.piles.hand) || [];
      const alive = engine.enemies.filter(x => x.alive);
      pt = { turn: turns, nerve: engine.energy || 0, hand: h.length,
             legal: h.filter(c => !c.unplayable && engine.canPlay(c.uid, null).ok).length,
             onBoard: alive.reduce((s, x) => s + (x.block || 0), 0),
             bodies: alive.length,
             hp: alive.reduce((s, x) => s + (x.hp || 0), 0),
             d0: gx.dealt, b0: gx.blockedByEnemies, g0: gx.enemyGuard,
             p0: engine.stats?.cardsPlayedThisCombat || 0 };
    }
    /* WHY A TURN PASSED, in the bot's own numbers. `planTurn` seeds `best`
       with the EMPTY sequence and only replaces it on `score > best.score`,
       so a pass is the incumbent and wins every tie. Kept only for turns
       that played nothing, which is where the question is. */
    const dbg = PROBE.on ? [] : null;
    const closeTurn = () => {
      if (!pt) return;
      pt.landed = gx.dealt - pt.d0;
      pt.absorbed = gx.blockedByEnemies - pt.b0;
      pt.raised = gx.enemyGuard - pt.g0;
      pt.played = (engine.stats?.cardsPlayedThisCombat || 0) - pt.p0;
      // After `played` is known, so the filter reads the count and not undefined.
      if (dbg && pt.played === 0 && dbg.length) {
        pt.pass = dbg.find(r => r.d === -1) || null;
        pt.floor = dbg.find(r => r.d === -2) || null;
        pt.cand = dbg.filter(r => r.d >= 0)
                     .sort((a, b) => b.score - a.score).slice(0, 6);
      }
      delete pt.d0; delete pt.b0; delete pt.g0; delete pt.p0;
      gx.perTurn.push(pt);
    };
    if (PROBE.naive && run && run.combatMeta
        && run.combatMeta.encounter === PROBE.naive) await naiveTurn(engine, {});
    else await competentTurn(engine, { snacks: run ? run.snacks : null, onSnack, fc, debug: dbg });
    if (engine.over) { closeTurn(); break; }
    await engine.endTurn();
    closeTurn();
  }
  /* NAMES LAST. `block` events carry `actorId` and no name, and a body that
     only ever blocked would otherwise be an anonymous id. Read off the
     board after the fight so summons are included. */
  if (PROBE.on) for (const e of engine.enemies) {
    const b = gx.bodies[e.id];
    if (!b) continue;
    b.name = e.name || b.name;
    b.defId = e.defId || null;
    b.maxHp = e.maxHp || 0;
    b.hp = e.alive ? e.hp : 0;
    b.alive = !!e.alive;
  }
  if (!engine.over) {
    /**
     * A DRAW: neither side can finish the other inside the budget.
     *
     * It has to say WHICH fight — "combat did not resolve in 80 turns" sent one
     * session hunting through five regions, and a stalemate is always a
     * specific formation whose Guard the player cannot out-damage.
     *
     * A boss draw USED TO BE reported as a balance finding rather than a
     * failure, the way `tests/audio/cues.py` reports its known-silent cue —
     * counted, named, and impossible to lose track of, but not a defect of the
     * run layer, which is what this suite tests. It stood at four in fifty on
     * 2026-08-31: the Groundskeeper of Names three times, the Head Gardener
     * once, all at the 200-turn ceiling with both sides comfortable.
     *
     * That exemption is CLOSED. `CombatEngine._losePatience` now makes an
     * unbounded stall impossible for every enemy in the game: past turn 30
     * every living enemy gains a stack of Strength each player turn, on the
     * intent before it is on the hit, so damage grows without limit and the
     * fight must resolve one way or the other. A draw is therefore no longer a
     * statement about how a boss is priced — it is evidence that the mechanism
     * meant to guarantee termination did not run.
     *
     * Both kinds fail now, and the line still names the formation, because
     * "combat did not resolve in 200 turns" once sent a session hunting
     * through five regions.
     */
    const left = engine.enemies.filter(x => x.alive)
      .map(x => `${x.defId} ${x.hp}/${x.maxHp}`).join(', ');
    const who = run?.combatMeta?.name || engine.encounterId || 'unknown encounter';
    const boss = engine.enemies.some(x => x.alive && x.tier === 'boss');
    /* THE SEED, because without it this is not reproducible. The Drowned Matron
       drew twice at 595/595 in a 400-run pass — full health after 200 turns —
       and the message named the formation but not which expedition, so there
       was no way to replay the one fight that mattered. */
    const line = `${who} [seed ${run ? run.seed : '?'} ${run ? run.region : '?'}] `
      + `— ${budgetTurns} turns, still standing: ${left || 'nobody'}`;
    if (boss) DRAWS.push(line);
    fail(`combat did not resolve — ${line}`);
    // Either way the expedition is over. A run that cannot finish a fight has
    // failed, and leaving `run.result` null makes it look like a harness crash.
    if (run && !run.result) { try { run.end(false, who); } catch { /* already ended */ } }
    return false;
  }
  return true;
}

/**
 * Every fourth expedition hunts elites.
 *
 * `pickNode` scores a Big Scare at -40 below 82% Courage, which is a correct
 * thing for a player to do and cost this harness most of its elite coverage
 * the moment it started routing deliberately: Big Scares entered across 50
 * runs went from roughly one a room to 10. A deliberate router is a better
 * player and a WORSE sampler. This is the part of the old random sampler that
 * is worth keeping, made explicit and counted rather than hoped for.
 */
function preferBigScare(run, nodes) {
  if (run.courage / run.maxCourage < 0.5) return null;
  return nodes.find(n => run.effectiveType(n) === NodeType.BIG_SCARE) || null;
}

/** Lowest-Courage living enemy, so the board actually thins out. */
function pickTarget(engine, card) {
  const alive = engine.livingEnemies();
  if (!alive.length) return null;
  let t = alive[0];
  for (const e of alive) if (e.hp < t.hp) t = e;
  return t.id;
}

/* ── drive one whole expedition ─────────────────────────────────────────── */
async function simulate(seed, { companion = 'marmalade', kid = 'maya', haunt = 0, trace = null,
  shepherd = false, elitist = false } = {}) {
  resetMeta();
  const run = new Run({ companion, kid, seed, hauntLevel: haunt });
  const pick = run.fork('sim:path');
  const dice = run.fork('sim:choices');
  const t = trace || [];
  let steps = 0;
  /* WHERE a run ends is the whole diagnosis and the harness never recorded it.
     "46 defeats in the Foyer" reads as a bot that cannot fight; the Foyer is
     13 rows deep, so it mattered enormously whether those were row 3 or the
     Butler on row 12, and nothing here could tell them apart. */
  let lastRoom = null;
  /* THE LEDGER. One row per fight, so the ladder can be priced rather than
     guessed at.

     "Regions reached" says where runs STOP, and by 2026-08-31 that table had
     gone flat from region 8 onward — six runs reach the Attic and six reach the
     Heart, so ten wings kill nobody. That is a symptom with at least three
     different causes and the reach table cannot tell them apart: the back half
     could be underpriced, or the player could be arriving with a deck nothing
     in the game is priced against, or the bot could simply be good enough that
     everything after the Library is a formality.

     What separates them is the COST of a fight relative to the pool it is spent
     from, region by region — and nothing recorded it. */
  const ledger = [];
  /** One row per ROOM: what it added to the deck and the Keepsake shelf. */
  const purse = [];

  const log = (s) => t.push(s);
  log(`seed ${run.seed} ${companion}/${kid} h${haunt}`);

  while (!run.result && steps++ < 400) {
    // `shepherd` runs exist to exercise the *back half* of an expedition —
    // the boss fight, the boss reward, completeRegion() and the victory end —
    // which a bot this crude would otherwise never reach.
    if (shepherd) run.courage = run.maxCourage;

    /* ROUTING. This was a uniform random pick over the legal nodes, which is
       not what a player does and is the other half of why the bot never left
       the Foyer: fifteen of thirty-eight Foyer defeats were at a Big Scare it
       had walked into at whatever Courage it happened to have. `pickNode` is
       the balance harness's own router — Safe Rooms deep in the region, shops
       when rich, Big Scares only when healthy, and the boss when it appears.
       The 50 maps are still 50 different maps, so path diversity survives; the
       node-type census below is here to prove it rather than assume it. */
    const legalNodes = run.legalNodes();
    if (!legalNodes.length) { fail(`seed ${seed}: stranded with no legal nodes at ${run.currentNodeId}`); break; }
    const chosen = (elitist ? preferBigScare(run, legalNodes) : null)
      || P.pickNode(run, legalNodes)
      || legalNodes[pick.int(legalNodes.length)];
    const id = chosen.id;
    const node = run.nodeById(id);
    const type = run.effectiveType(node);
    VISITED[type] = (VISITED[type] || 0) + 1;
    lastRoom = { id, type, row: node?.row ?? -1, region: run.region,
                 rows: run.map?.rows ?? 0, deck: run.deck.length };
    log(`> ${id} ${type}`);

    const hpBefore = run.courage;
    const regionBefore = run.region;
    /* ROUTE SLOT. The ledger priced a wing but never recorded WHERE IN THE
       ROUTE the fight happened, so the over-30 failure below asserted a cause
       - "every region in the list can be routed as WING TWO" - that nothing
       in this repo could join. I wrote that attribution without measuring it.
       One field makes it a measurement instead of an inference. */
    const wingBefore = run.regionIndex + 1;
    const keepsBefore = run.keepsakes.length;
    const deckBefore = run.deck.length;
    await run.enterNode(id);

    if (run.combat) {
      const engine = run.combat;
      /* WHICH BODIES THE PLAYER ACTUALLY MET. Captured BEFORE the fight, so a
         summoned body is not counted as something the room presented — and by
         `defId`, never `id`, which is the board slot (CONTRACTS / part-lookups). */
      const met = engine.enemies.map(x => x.defId).filter(Boolean);
      /* THE STALL DISCRIMINATOR, and it decides which fix is even possible.
         `_losePatience`'s own note (engine.js ~2918) says an unfinishable
         fight is a GUARD wall and not a Courage pool: the Groundskeeper of
         Names "sat at 203 of 350 Courage for the last hundred and forty"
         turns, because an enemy's Guard is wiped and re-granted every turn,
         so what the player must beat is Guard PER TURN. A 40-turn GRIND
         (boss nearly dead) and a 40-turn STALL (boss near full) are the same
         number in `turns` and completely different defects - a pool cut or a
         route ceiling reaches the first and cannot touch the second.
         Captured BEFORE the fight, so a summon is not counted as Courage the
         room presented. */
      const poolBefore = engine.enemies.reduce((s, x) => s + (x.maxHp || 0), 0);
      /* COULD THIS DECK EVEN ANSWER A WALL? `wall > land` is read as "the board
         re-raises faster than the deck gets through", but that is only the
         whole story if the deck HELD an answer and it still was not enough.
         Four cards in the game ignore Guard and they sit on two of sixteen
         companions, so "no answer in the deck" and "answer present but too
         small" are different defects that look identical in `wall`.
         Detected from card TEXT, not an id list, so a new piercing card
         registers itself the way the teaching registry's terms do. */
      const pierceCards = run.deck.map(c => cardById(c.id))
        .filter(c => c && /ignor(?:e|es|ing)\s+guard/i.test(c.text || ''));
      const pierceIds = [...new Set(pierceCards.map(c => c.id))];
      const ok = await playCombat(engine, 200, run);
      if (!ok) break;
      log(`  fight ${engine.victory ? 'won' : 'lost'} hp=${run.courage}`);
      ledger.push({
        region: regionBefore, type, seed, shepherd, wing: wingBefore,
        pool: poolBefore,
        left: engine.enemies.reduce((s, x) => s + (x.alive ? x.hp : 0), 0),
        dealt: (engine.__guard || {}).dealt || 0,
        blocked: (engine.__guard || {}).blockedByEnemies || 0,
        guard: (engine.__guard || {}).enemyGuard || 0,
        /* DEPTH. Without it the ledger can price a wing but not its SHAPE, and
           the Foyer's 28 defeats split 16 at the boss on row 12 and 12 before
           it at row 3.9 — two findings with completely different fixes that
           the region row averages together into one number. */
        row: node?.row ?? -1, rows: run.map?.rows ?? 0, met,
        encTier: run.combatMeta?.tier || null, encId: run.combatMeta?.encounter || null,
        hpBefore, hpAfter: run.courage, max: run.maxCourage,
        cost: Math.max(0, hpBefore - run.courage),
        turns: engine.turn, won: !!engine.victory,
        played: engine.stats?.cardsPlayedThisCombat || 0,
        nerve: (engine.__guard || {}).samples
          ? +((engine.__guard.nerveSum / engine.__guard.samples).toFixed(1)) : 0,
        hand: (engine.__guard || {}).samples
          ? +((engine.__guard.handSum / engine.__guard.samples).toFixed(1)) : 0,
        legal: (engine.__guard || {}).samples
          ? +((engine.__guard.playSum / engine.__guard.samples).toFixed(1)) : 0,
        deck: run.deck.length, keeps: run.keepsakes.length,
        companion: run.companion,
        pierce: pierceCards.length, pierceIds,
        bySource: (engine.__guard || {}).bySource || {},
        purse: run.lostThings,
        probe: PROBE.on ? { bodies: Object.values((engine.__guard || {}).bodies || {}),
                            perTurn: (engine.__guard || {}).perTurn || [],
                            plays: Object.values((engine.__guard || {}).plays || {}),
                            deck: run.deck.map(c => c.id) } : null,
      });
    }

    /* WHAT EACH ROOM HANDS OVER. `keepsakes` reaches 11.8 by the third wing and
       55 by the Heart, and the ladder's flat back half is downstream of that —
       but "where do 55 Keepsakes come from" cannot be answered from the reach
       table or from the room census, because a shop that SELLS three and a
       Treasure that GIVES one look identical in both. This is recorded per
       room so the economy can be priced at its source. */
    const bank = () => {
      const dk = run.keepsakes.length - keepsBefore;
      const dc = run.deck.length - deckBefore;
      if (dk || dc) purse.push({ type, region: regionBefore, keeps: dk, cards: dc, shepherd });
    };

    if (run.result) { bank(); break; }

    if (run.pendingReward) {
      const r = run.pendingReward;
      if (r.cards.length) {
        // `draft` returns null when the best of the three is worse than the
        // dilution it costs, so skipping is still a live branch here.
        const take = P.draft(r.cards, POLICY, draftCtx(run));
        if (take) { run.takeRewardCard(take); log(`  took ${take}`); }
        else { run.skipRewardCards(); log('  skipped'); }
      }
      claimAndCross(run);
      bank();
      continue;
    }

    if (run.pendingEvent) {
      if (run.pendingEvent.rescue) {
        run.rescueCompanion(run.pendingEvent.companion);
      } else {
        const def = run.currentEvent();
        const open = (def?.options || []).filter(o => run.optionOpen(o)
          && !(o.cost?.lostThings > run.lostThings));
        if (open.length) {
          // `pickEventOption` filters on `optionOpen` but not on the purse, so
          // its answer is looked up in the affordable set rather than trusted.
          const want = P.pickEventOption(run, def);
          const o = open.find(x => x.id === want) || open[0];
          const res = run.chooseEventOption(o.id);
          log(`  curiosity ${def.id}/${o.id}`);
          const p = res?.pending;
          if (p?.upgradeCard) {
            const up = run.upgradeableCards();
            for (let i = 0; i < p.upgradeCard && up.length; i++) run.upgradeCard(up[i % up.length].uid);
          }
          if (p?.removeCard) {
            for (let i = 0; i < p.removeCard; i++) {
              const rem = run.removableCards();
              if (rem.length) run.removeCard(rem[dice.int(rem.length)].uid);
            }
          }
          if (p?.combat) {
            await run.eventCombat(p.combat);
            if (run.combat) { await playCombat(run.combat, 200, run); }
            if (run.result) break;
            if (run.pendingReward) { claimAndCross(run); bank(); continue; }
          }
        }
      }
      if (run.result) { bank(); break; }
      run.leaveNode();
      bank();
      continue;
    }

    if (type === NodeType.SHOP) {
      const { buys } = P.shopPlan(run, POLICY);
      for (const b of buys) {
        if (run.lostThings < b.price) continue;
        if (b.kind === 'snack') run.buySnack(b.snack, b.price);
        else if (b.kind === 'keepsake') run.buyKeepsake(b.id, b.price);
        else if (b.kind === 'card') run.buyCard(b.id, b.price);
      }
      // Thinning is the other half of deck-building, and `shopPlan` does not
      // cover it: once the deck is thick, a Basic forgotten is worth more than
      // most cards bought. The price rises 25 a time, so this self-limits.
      if (run.deck.length > 12 && run.lostThings >= run.removalPrice) {
        const worst = leastValuable(run, run.removableCards());
        if (worst) run.buyRemoval(worst);
      }
      log(`  shop, purse ${run.lostThings}`);
      run.leaveNode();
      bank();
      continue;
    }

    if (type === NodeType.SAFE) {
      const choice = P.restChoice(run);
      if (choice.kind === 'rest' && run.restHealAmount() > 0) run.rest();
      else {
        const uid = P.pickUpgrade(run, POLICY);
        if (uid) run.upgradeCard(uid);
        else run.rest();
      }
      /* Forging is still exercised, because it is a real Safe Room action and
         a doubled opener pays every remaining fight. But it is paid for in
         MAXIMUM Courage, which is the health pool: the old roll forged down to
         a floor of 10, and forged Keepsakes with no opener to double, so it
         bought nothing with the pool it spent. `forgePreview().worthwhile` is
         the run layer's own answer to which ones those are. */
      const worthForging = run.forgeableKeepsakes()
        .find(k => run.forgePreview(k.id)?.worthwhile);
      if (worthForging && run.courage / run.maxCourage > 0.8
          && run.maxCourage - run.forgeCost() >= 40) {
        run.forgeKeepsake(worthForging.id);
      }
      log(`  safe room, hp ${run.courage}/${run.maxCourage}`);
      run.leaveNode();
      bank();
      continue;
    }

    // treasure and anything else already left a pendingReward or is a no-op
    run.leaveNode();
    bank();
  }

  if (!run.result && steps >= 400) fail(`seed ${seed}: run never terminated (400 steps)`);
  return { run, trace: t, steps, lastRoom, ledger, purse };
}

/* ── a stable digest of everything a run ended up being ─────────────────── */
function digest(run) {
  return JSON.stringify({
    result: run.result,
    hp: run.courage, max: run.maxCourage, gold: run.lostThings,
    deck: run.deck.map(c => `${c.id}${c.upgraded ? '+' : ''}`).sort(),
    keeps: run.keepsakes.map(k => `${k.id}${k.forged ? '*' : ''}`).sort(),
    region: run.region, clues: run.cluesFound,
    path: run.pathIds, seen: run.seenEvents,
    stats: run.stats,
  });
}

/* ── the suite ──────────────────────────────────────────────────────────── */
/* THE WHOLE ROSTER, from the registry rather than a hand-written list. The
   list this replaces held five names - the four STARTER_SLUGS plus `wink` -
   while sixteen companions are playable, and the gap was invisible until the
   pierce column asked a question the sample could not answer: four of those
   five cannot draft a card that ignores Guard at any price, so 400 of 535
   fights were structurally unable to answer a Guard wall and nothing said so.
   Derived, so a new companion joins this gate by existing. */
const COMPANIONS = companionSlugs();
const KIDS = ['maya', 'mateo', 'amina', 'eli', 'priya', 'jordan', 'lena', 'samir'];

async function main() {
  const t0 = performance.now();
  useMemorySave();

  /* HOW MANY EXPEDITIONS. Fifty is the shipping number and the default, but
     fifty runs give the DEEP regions one to five boss fights each, which is
     too few to tune on - two sessions were spent chasing swings that were
     sample noise. `?runs=` raises it for a measurement pass without changing
     what the gate asserts. Seeds are unchanged, so the first fifty runs of a
     larger pass are exactly the shipping fifty. */
  const N = Math.max(1, Number(new URLSearchParams(location.search).get('runs')) || 50);
  const results = [];
  const lengths = [];
  const ends = {};

  /* PROBE MODE runs exactly ONE expedition — the index the caller named —
     through the same simulate() the gate uses. Reproducing a single fight by
     rebuilding the run around it would give a different deck and a different
     RNG stream, which is a different fight wearing the same seed. */
  const INDICES = PROBE.on ? [PROBE.index]
                           : Array.from({ length: N }, (_, k) => k);
  for (const i of INDICES) {
    const seed = 1000 + i * 7717;
    const companion = COMPANIONS[i % COMPANIONS.length];
    const kid = KIDS[i % KIDS.length];
    const haunt = i % 4;
    // Every fifth expedition is shepherded, so ~10 of the 50 walk the full
    // ladder into the Butler and out the other side.
    const shepherd = i % 5 === 0;
    const elitist = i % 4 === 1;
    let r;
    try {
      r = await simulate(seed, { companion, kid, haunt, shepherd, elitist });
    } catch (e) {
      fail(`seed ${seed} threw: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`);
      continue;
    }
    const run = r.run;
    results.push({ seed, companion, kid, haunt, shepherd, elitist, run, steps: r.steps,
                   trace: r.trace, lastRoom: r.lastRoom, ledger: r.ledger,
                   purse: r.purse });

    // ── sanity ──────────────────────────────────────────────────────────────
    check(run.result === 'victory' || run.result === 'defeat',
      `seed ${seed}: ended with result=${run.result}`);

    /* THE ROUTE, and what it now means. Until 2026-09-06 six wings were dealt
       up front in REGION_ORDER order and `route` was that list; the assertions
       here checked the DEAL. The party chooses each crossing now, so `route` is
       the wings actually WALKED, it grows one at a time, and "in ladder order"
       is not merely untrue — it is the thing that was removed.

       What still has to hold on every one of the fifty:
         - it starts at the front door;
         - it never holds a wing twice, because there is no way back through one;
         - it is never longer than the expedition is;
         - it reaches the Heart exactly when the run was WON, because the Heart
           is the ending — a victory that skipped it would be a run with no
           finish, and a defeat that contains it is a run that ended after it;
         - and every single crossing was one of the ways the house actually
           opened. That last one is the real gate: it re-derives the offer from
           the seed with `wingOffer` and checks the step against it, so a route
           that walked through a wall fails here rather than looking plausible. */
    const rt = run.route || [];
    check(rt[0] === RUN_REGIONS[0], `seed ${seed}: route starts at ${rt[0]}, not the Foyer`);
    check(new Set(rt).size === rt.length,
      `seed ${seed}: route repeats a wing — ${rt.join(' > ')}`);
    check(rt.length <= run.wings,
      `seed ${seed}: route is ${rt.length} wings, longer than the ${run.wings} tonight`);
    const HEART_ID = RUN_REGIONS[RUN_REGIONS.length - 1];
    const wonIt = run.result === 'victory';
    /* A victory MUST end at the Heart; a defeat may — dying in the Heart is a
       run that got all the way and lost there, and the first version of this
       check called that a failure. What must never happen is the Heart turning
       up anywhere but last, which is what makes it the ending. */
    if (wonIt) {
      check(rt[rt.length - 1] === HEART_ID && rt.length === run.wings,
        `seed ${seed}: won on ${rt.length} wings ending at ${rt[rt.length - 1]} — ${rt.join(' > ')}`);
    }
    check(rt.indexOf(HEART_ID) < 0 || rt.indexOf(HEART_ID) === rt.length - 1,
      `seed ${seed}: the Heart is not the last wing — ${rt.join(' > ')}`);
    for (let i = 1; i < rt.length; i++) {
      const offer = wingOffer(seed, rt[i - 1], rt.slice(0, i), i - 1, run.wings);
      check(offer.some(o => o.to === rt[i]),
        `seed ${seed}: crossed ${rt[i - 1]} -> ${rt[i]}, which the house never opened `
        + `(it offered ${offer.map(o => o.to).join(', ') || 'nothing'})`);
    }
    check(run.deck.length >= 5 && run.deck.length <= 60,
      `seed ${seed}: deck size out of range (${run.deck.length})`);
    check(run.deck.every(c => !!cardById(c.id)),
      `seed ${seed}: deck holds an unknown card id`);
    check(run.lostThings >= 0, `seed ${seed}: negative ${'Lost Things'} (${run.lostThings})`);
    check(run.lostThings < 5000, `seed ${seed}: implausible purse (${run.lostThings})`);
    check(run.courage >= 0 && run.courage <= run.maxCourage,
      `seed ${seed}: courage ${run.courage}/${run.maxCourage}`);
    check(run.maxCourage >= 10, `seed ${seed}: max courage collapsed to ${run.maxCourage}`);
    check(new Set(run.keepsakes.map(k => k.id)).size === run.keepsakes.length,
      `seed ${seed}: duplicate Keepsake`);
    check(new Set(run.deck.map(c => c.uid)).size === run.deck.length,
      `seed ${seed}: duplicate card uid in deck`);

    lengths.push(run.visitedIds.length);
    const key = run.result === 'victory' ? 'victory' : `defeat/${run.region}`;
    ends[key] = (ends[key] || 0) + 1;
  }

  // ── determinism: the same seed twice, byte-identical ─────────────────────
  say('<h2>determinism</h2>');
  let detOk = 0;
  for (const pickIdx of [0, 7, 19, 33, 44]) {
    const r0 = results[pickIdx];
    if (!r0) continue;
    const again = await simulate(r0.seed, {
      companion: r0.companion, kid: r0.kid, haunt: r0.haunt, shepherd: r0.shepherd,
      elitist: r0.elitist,
    });
    const a = digest(r0.run), b = digest(again.run);
    if (a === b) { detOk++; }
    else {
      fail(`seed ${r0.seed}: replay diverged`);
      say(`<pre class="err">seed ${r0.seed}\n A ${a.slice(0, 400)}\n B ${b.slice(0, 400)}</pre>`);
    }
  }
  say(`<pre class="ok">${detOk}/5 replayed identically</pre>`);

  // ── the boss path, end to end, asserted explicitly ───────────────────────
  say('<h2>boss and victory</h2>');
  {
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed: 777 });
    // This block asserts the *shape* of the back half of an expedition — boss
    // node, boss reward, completeRegion, victory, meta write, save cleared.
    // It is not a balance test, so the Kid is given enough Courage that the
    // bot's play quality cannot make the structural assertions flaky.
    //
    // 400 STOPPED BEING ENOUGH ON 2026-08-30, when the Curses in data/neutral.js
    // started doing what they print. The bot takes `open[0]` at every Curiosity,
    // so it walks into the boss holding Night Terror ("lose 1 Courage whenever
    // you play a Trick"), and a 34-turn boss fight at three Tricks a turn is a
    // hundred Courage of self-inflicted damage that simply did not exist before.
    // Measured on seed 777: 121 Courage to `curse/night-terror` across the run.
    // That is the card working — Slay the Spire's Pain is the same card and the
    // same price — but it is exactly the "play quality" noise this number exists
    // to drown out, so the number moved. The 50-run batch above is where balance
    // is actually observed; this block only ever cared about the chain.
    run.maxCourage = 2000; run.courage = 2000;
    const pick = run.fork('sim:boss');
    let sawBoss = false, bossReward = null, steps = 0;
    const bossTrace = [];
    /* THE STEP BUDGET IS PER WING, not a constant. It was 60, which covered the
       four-wing ladder with room to spare and then silently failed the moment
       the Heart was added: a wing is 13-15 rows, so five of them is ~70 rooms
       and this block ran out of steps rather than out of Courage. It reported
       "expected victory, got null", which reads like a boss that cannot be
       beaten and was a loop that stopped early. */
    const stepBudget = RUN_LENGTH_REGIONS * 20;
    while (!run.result && steps++ < stepBudget) {
      run.courage = run.maxCourage;                 // straight to the point
      // Route around Big Scares — that is a legitimate thing a player does, and
      // it keeps this structural test from turning into a balance test.
      const all = run.legalNextIds();
      if (!all.length) break;
      const safe = all.filter(n => run.effectiveType(run.nodeById(n)) !== NodeType.BIG_SCARE);
      const legal = safe.length ? safe : all;
      const id = legal[pick.int(legal.length)];
      const node = run.nodeById(id);
      const bt = run.effectiveType(node);
      const isBoss = bt === NodeType.BOSS;
      await run.enterNode(id);
      if (run.combat) {
        const eng = run.combat;
        await playCombat(eng, 200, run);
        bossTrace.push(`${node.row}:${bt} ${eng.victory ? 'won' : 'LOST'} hp=${eng.player.hp}/${eng.player.maxHp}`);
      } else bossTrace.push(`${node.row}:${bt} hp=${run.courage}`);
      if (run.result) break;
      if (isBoss) {
        sawBoss = true;
        bossReward = run.pendingReward ? { ...run.pendingReward } : null;
      }
      if (run.pendingReward) {
        /* IT HAS TO DRAFT. This block claimed every reward and took nothing,
           so it walked the whole ladder on the ten-card starter deck. That was
           survivable while the run ended at the Confectioner — 2000 Courage
           grinds 305 down eventually — and stopped being survivable the moment
           the Heart was added: 120 turns against the Keeper left it at 281 of
           621 and the fight simply could not end. A structural test of
           boss -> reward -> completeRegion -> victory cannot reach the last
           boss on a tutorial deck. */
        if (run.pendingReward.cards?.length) {
          const take = P.draft(run.pendingReward.cards, POLICY, draftCtx(run));
          if (take) run.takeRewardCard(take); else run.skipRewardCards();
        }
        claimAndCross(run);
        continue;
      }
      if (run.pendingEvent) {
        const def = run.currentEvent();
        const open = (def?.options || []).filter(o => run.optionOpen(o) && !(o.cost?.lostThings > run.lostThings));
        if (open.length) run.chooseEventOption(open[0].id);
        if (run.result) break;
        run.leaveNode();
        continue;
      }
      run.leaveNode();
    }
    check(sawBoss, 'boss path: never reached the boss node');
    check(!!bossReward && bossReward.kind === 'boss', 'boss path: boss reward was not kind="boss"');
    /* A boss must drop a Keepsake UNLESS the player already owns every findable
       one in the game — which an eleven-wing expedition genuinely can, and which
       is a content shortfall rather than a run-layer defect.

       The bare `!!bossReward.keepsake` was true while the ladder was short
       enough that the pool outlasted it. It stopped being true when the ladder
       reached eleven wings: a full run takes a Keepsake from every boss, every
       treasure and every shop, and `rollKeepsake` correctly returns null rather
       than handing out a duplicate. Asserting the reason keeps the check
       meaningful instead of turning it into a countdown to the next region. */
    const findableLeft = R.allRelics().filter(
      r => ['common', 'uncommon', 'rare', 'boss'].includes(r.rarity) && !run.hasKeepsake(r.id),
    ).length;
    check(!!bossReward?.keepsake || findableLeft === 0,
      `boss path: boss dropped no Keepsake and ${findableLeft} were still available`);
    if (!bossReward?.keepsake) {
      say(`  note: the expedition owned every findable Keepsake by the last boss `
        + `(${run.keepsakes.length} held). The pool is shorter than the ladder.`, 'dim');
    }
    check(run.result === 'victory', `boss path: expected victory, got ${run.result}`);
    /* This used to assert `rescued.includes('marmalade')` — the Foyer's authored
       Companion. Marmalade is one of the four starters: she is at the clubhouse
       from the first expedition and was never in the house, so "freeing" her
       spent the run's emotional peak on nothing, and the assertion froze that
       into the suite. `Run.rescueTargetFor()` now substitutes somebody actually
       missing, and this checks the property that matters instead of the name. */
    const freedByBoss = run.companionsFreed[0];
    check(!!freedByBoss && run.rescued.includes(freedByBoss),
      `boss path: no Companion was freed (freed ${JSON.stringify(run.companionsFreed)})`);
    check(freedByBoss !== run.companion && !STARTER_SLUGS.has(freedByBoss),
      `boss path: freed ${freedByBoss}, who was never in the house`);
    check((Save.data.companionsRescued || []).includes(freedByBoss),
      'boss path: the rescue did not reach the meta save');
    check(Save.loadRun() === null, 'boss path: a finished run is still resumable');
    say('<pre class="ok">'
      + `walked ${run.visitedIds.length} rooms · ${run.result}`
      + ` · freed ${run.rescued.join(', ') || 'nobody'}`
      + ` · boss Keepsake ${bossReward?.keepsake || 'none'}` + '<br>'
      + bossTrace.join('<br>') + '</pre>');
  }

  // ── autosave / resume round-trip, mid-map ────────────────────────────────
  say('<h2>autosave / resume</h2>');
  let resumeOk = 0, resumeTried = 0;
  for (const seed of [4242, 9001, 31337]) {
    resumeTried++;
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed });
    const pick = run.fork('sim:path');
    // walk three rooms, stopping on something that is not a fight
    for (let i = 0; i < 3; i++) {
      const legal = run.legalNextIds();
      if (!legal.length) break;
      const id = legal[pick.int(legal.length)];
      await run.enterNode(id);
      if (run.combat) { await playCombat(run.combat, 200, run); if (run.pendingReward) claimAndCross(run); }
      else if (run.pendingEvent || run.pendingShop) run.leaveNode();
      else run.leaveNode();
      if (run.result) break;
    }
    const before = digest(run);
    const saved = JSON.parse(JSON.stringify(run.snapshot()));
    const back = Run.resume(saved);
    if (!back) { fail(`seed ${seed}: Run.resume returned null`); continue; }
    const after = digest(back);
    if (before !== after) {
      fail(`seed ${seed}: resume round-trip lost state`);
      say(`<pre class="err">before ${before.slice(0, 400)}\nafter  ${after.slice(0, 400)}</pre>`);
      continue;
    }
    // and it must still be playable from there
    const legal = back.legalNextIds();
    check(legal.length > 0 || back.result, `seed ${seed}: resumed run has nowhere to go`);
    /* THE ROUTE HAS TO SURVIVE THE SAVE. It is not derivable from the seed at
       resume time — a save from before routes existed walked all seventeen, so
       rebuilding one would drop that run into a wing it had never been in. The
       digest above compares `region`, which is only the CURRENT wing; this is
       the rest of the itinerary. */
    check((back.route || []).join('>') === (run.route || []).join('>'),
      `seed ${seed}: resume lost the route — ${(run.route || []).join('>')} became `
      + `${(back.route || []).join('>')}`);
    resumeOk++;
  }
  say(`<pre class="ok">${resumeOk}/${resumeTried} resumed identically and were still playable</pre>`);

  /* ── content registries on the REAL path ───────────────────────────────────
     scenes/combat.js registered STATUS_TRICK_DEFS on its standalone deep-link
     path and the run layer did not, so every `addCard('clutter')` an enemy made
     during an actual expedition logged "unknown card" and added nothing — Lost
     Luggage and the Grand Coatcheck had no deck interference at all in the
     shipped game while looking perfect in a deep-linked fight. Exactly the
     asymmetry CONTRACTS.md rule 9 is about, so it gets asserted against the
     real `run.buildCombat()`, not a mock.                                     */
  say('<h2>content registries (the real buildCombat path)</h2>');
  {
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed: 4242 });
    const node = run.map.nodes.find(n => run.sceneFor(n) === 'combat') || run.map.nodes[0];
    const eng = await run.buildCombat(node);
    // every id enemy content resolves by name
    for (const id of ['clutter', 'drowsy']) {
      check(!!eng.resolveCardDef(id),
        `buildCombat: addCard('${id}') would find no card — enemy deck interference is inert`);
    }
    for (const id of ['dust-bunny', 'coatrack-crawler']) {
      check(!!eng.enemyDefs.get(id), `buildCombat: summon('${id}') would find no enemy`);
    }
    check(eng.cardDefs.size > 100, `buildCombat: only ${eng.cardDefs.size} card defs registered`);
    say(`<pre class="ok">${eng.cardDefs.size} card defs · ${eng.enemyDefs.size} enemy defs`
      + ` · clutter/drowsy/dust-bunny/coatrack-crawler all resolve</pre>`);
  }

  /* ── quitting mid-Scuffle ──────────────────────────────────────────────────
     THE regression. Reloading during a fight used to hand the player the room:
     the node came back marked visited, at full Courage, with no reward and no
     damage — so any fight in the game, up to and including the Butler, could be
     skipped by pressing F5.  What must be true after a reload:

       · the node is NOT in visitedIds (it was entered, never cleared)
       · there is no pendingReward
       · Courage is what it was walking IN, never restored to full
       · the run resumes INTO the fight — same node, same encounter
       · the recorded actions replay onto the same board, or the identical
         encounter restarts from the top; never a skip either way            */
  say('<h2>quitting mid-Scuffle does not skip the fight</h2>');
  let resumeKeyed = 0, resumeKeyedTried = 0;
  let combatResume = 0, combatResumeTried = 0, replayed = 0;
  for (const seed of [5150, 8128, 60613]) {
    combatResumeTried++;
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed });
    const pick = run.fork('sim:path');

    // walk until we are standing in a fight
    let steps = 0;
    while (!run.combat && steps++ < 12) {
      const legal = run.legalNextIds();
      if (!legal.length) break;
      const ids = legal.filter(id => run.sceneFor(run.nodeById(id)) === 'combat');
      await run.enterNode((ids.length ? ids : legal)[pick.int((ids.length ? ids : legal).length)]);
      if (run.combat) break;
      if (run.pendingReward) claimAndCross(run);
      else run.leaveNode();
      if (run.result) break;
    }
    if (!run.combat) { fail(`seed ${seed}: never reached a Scuffle to interrupt`); continue; }

    const engine = run.combat;
    const nodeId = run.currentNodeId;
    const courageOnEntry = run.pendingCombat.courageOnEntry;
    const encounter = run.pendingCombat.encounter;

    check(!run.visitedIds.includes(nodeId),
      `seed ${seed}: a Scuffle in progress is already marked cleared`);

    // play part of a turn, take some damage, then "close the tab"
    await engine.startCombat();
    let played = 0;
    for (const card of [...engine.piles.hand]) {
      if (played >= 2 || engine.over) break;
      const t = pickTarget(engine, card);
      if (!engine.canPlay(card.uid, t).ok) continue;
      await engine.playCard(card.uid, t);
      played++;
    }
    if (!engine.over) await engine.endTurn();
    if (engine.over) { fail(`seed ${seed}: the fight resolved before it could be interrupted`); continue; }
    run._combatSave();

    const boardBefore = run._combatDigest(engine);
    const hpMidFight = engine.player.hp;
    const deckBefore = run.deck.length;

    // ── the reload ────────────────────────────────────────────────────────
    const saved = JSON.parse(JSON.stringify(Save.loadRun()));
    check(!!saved.pendingCombat, `seed ${seed}: the save does not know a fight was in progress`);
    check(!(saved.visitedIds || []).includes(nodeId),
      `seed ${seed}: the save marks the unfinished Scuffle's node as visited`);
    check(!saved.pendingReward, `seed ${seed}: the save carries a reward for a fight nobody won`);
    check(saved.scene === 'combat',
      `seed ${seed}: Continue would land on "${saved.scene}", not back in the fight`);

    const back = Run.resume(saved);
    if (!back) { fail(`seed ${seed}: Run.resume returned null mid-combat`); continue; }

    check(back.currentNodeId === nodeId, `seed ${seed}: resumed standing somewhere else`);
    check(!back.visitedIds.includes(nodeId),
      `seed ${seed}: THE BUG — the unfinished room came back cleared`);
    check(!back.pendingReward, `seed ${seed}: THE BUG — a reward was granted for an unfought fight`);
    check(back.resumeScene() === 'combat',
      `seed ${seed}: resumeScene() says "${back.resumeScene()}", not combat`);
    check(back.deck.length === deckBefore, `seed ${seed}: the deck changed across the reload`);

    const mode = await back.restoreInterruptedCombat();
    check(mode === 'replay' || mode === 'restart',
      `seed ${seed}: restoreInterruptedCombat() returned ${mode}`);
    check(!!back.combat, `seed ${seed}: resumed without an engine — the fight is gone`);
    check(back.combatMeta.encounter === encounter,
      `seed ${seed}: came back to a different encounter (${back.combatMeta.encounter} vs ${encounter})`);
    check(!back.visitedIds.includes(nodeId),
      `seed ${seed}: restoring the fight cleared the node`);
    check(!back.pendingReward, `seed ${seed}: restoring the fight granted a reward`);

    if (mode === 'replay') {
      replayed++;
      check(back._combatDigest(back.combat) === boardBefore,
        `seed ${seed}: the replayed board is not the board that was left`);
      check(back.combat.player.hp === hpMidFight,
        `seed ${seed}: replayed to ${back.combat.player.hp} Courage, left at ${hpMidFight}`);
    } else {
      check(back.courage === courageOnEntry,
        `seed ${seed}: restarted at ${back.courage} Courage, walked in with ${courageOnEntry}`);
      check(back.combat.player.hp === courageOnEntry,
        `seed ${seed}: the restarted fight did not start at the entry Courage`);
    }
    // Either way the fight is still ahead of the player, not behind them.
    check(back.combat.player.hp <= courageOnEntry,
      `seed ${seed}: THE BUG — resumed with more Courage than the room was entered with`);

    /**
     * AND THE RESUMED FIGHT CAN BE INTERRUPTED AGAIN.
     *
     * `_cardKeys` names every card from the DRAW PILE, which is the whole deck
     * only before `startCombat()`. On the resume path `_wireCombat` was
     * building a second map from a MID-FIGHT draw pile — the replay having
     * already moved cards to hand, discard and exhaust — so the cards in hand
     * had no key, and the first card played after a resume could not be
     * recorded. A second interruption then lost the fight.
     */
    if (mode === 'replay') {
      const keys = back._combatKeys;
      const seat = back.combat.players[0];
      const named = seat.piles.hand.filter(c => keys && keys.byUid.has(c.uid)).length;
      check(named === seat.piles.hand.length,
        `seed ${seed}: THE BUG — ${seat.piles.hand.length - named} of ${seat.piles.hand.length}`
        + ' cards in hand have no replay key after a resume');
      resumeKeyed += named === seat.piles.hand.length ? 1 : 0;
      resumeKeyedTried++;
    }
    combatResume++;
  }
  say(`<pre class="ok">${resumeKeyed}/${resumeKeyedTried} resumed fights can be interrupted AGAIN — every card in hand still has a replay key</pre>`);
  say(`<pre class="ok">${combatResume}/${combatResumeTried} interrupted Scuffles resumed`
    + ` (${replayed} replayed onto the exact board, ${combatResume - replayed} restarted)</pre>`);

  // ── the real localStorage seam, three short runs ─────────────────────────
  say('<h2>real Save / localStorage seam</h2>');
  useRealSave();
  let storeOk = 0;
  try {
    for (const seed of [11, 22, 33]) {
      resetMeta();
      const run = new Run({ companion: 'bones', kid: 'mateo', seed });
      const legal = run.legalNextIds();
      await run.enterNode(legal[0]);
      if (run.combat) { await playCombat(run.combat, 200, run); if (run.pendingReward) claimAndCross(run); }
      else run.leaveNode();
      const raw = Save.loadRun();
      if (raw && raw.seed === run.seed && Array.isArray(raw.deck)) storeOk++;
      else fail(`seed ${seed}: nothing usable came back out of localStorage`);
    }
  } finally {
    Save.clearRun();
    useMemorySave();
  }
  say(`<pre class="ok">${storeOk}/3 wrote and read back through localStorage</pre>`);

  // ── distributions ────────────────────────────────────────────────────────
  say('<h2>run length (rooms entered)</h2>');
  const hist = {};
  for (const n of lengths) { const b = Math.floor(n / 2) * 2; hist[b] = (hist[b] || 0) + 1; }
  let rows = '<table><tr><th>rooms</th><th>runs</th><th></th></tr>';
  for (const k of Object.keys(hist).map(Number).sort((a, b) => a - b)) {
    rows += `<tr><td>${k}&ndash;${k + 1}</td><td>${hist[k]}</td><td class="bar">${'#'.repeat(hist[k])}</td></tr>`;
  }
  rows += '</table>';
  const avg = lengths.reduce((a, b) => a + b, 0) / (lengths.length || 1);
  say(rows + `<pre>mean ${avg.toFixed(1)} rooms, min ${Math.min(...lengths)}, max ${Math.max(...lengths)}</pre>`);

  /* HOW FAR, not just how many. A defeat on row 3 and a defeat to the
     region boss on row 12 are different failures with different fixes, and
     "defeat/foyer 46" was hiding which of the two this harness was seeing. */
  /* HOW DEEP, and whether the run needed help getting there. Every fifth
     expedition is shepherded to full Courage each room so the back half of the
     ladder is structurally exercised; those runs say nothing about whether the
     game is reachable. Reporting one victory count over both kinds hid that. */
  /* WHAT A FIGHT COSTS, region by region.
     "Regions reached" says where runs stop. It cannot say WHY, and from
     region 8 onward it is a flat line that could equally mean "the back half is
     underpriced" or "the bot is simply good by then". This is the number that
     separates them: Courage spent per fight as a share of the pool it comes
     out of, beside the deck and Keepsakes the player is holding at the time.

     Shepherded runs are EXCLUDED. They are refilled to full Courage in every
     room specifically so the back half gets walked, so their cost-per-fight is
     an artefact of the harness and would flatten this table by construction.  */
  say('<h2>what a fight costs, by region</h2>');
  {
    const LED = results.filter(r => !r.shepherd).flatMap(r => r.ledger || []);
    const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);
    let lrows = '<table><tr><th>region</th><th>fights</th><th>mean cost</th>'
      + '<th>% of pool</th><th>turns</th><th>deck</th><th>keeps</th>'
      + '<th>scuffle</th><th>scare</th><th>boss</th></tr>';
    const seenRegions = RUN_REGIONS.filter(id => LED.some(x => x.region === id));
    for (const id of seenRegions) {
      const rows = LED.filter(x => x.region === id);
      const of = (t) => rows.filter(x => x.type === t);
      const pct = mean(rows.map(x => (x.max ? x.cost / x.max : 0))) * 100;
      lrows += `<tr><td>${id}</td><td>${rows.length}</td>`
        + `<td>${mean(rows.map(x => x.cost)).toFixed(1)}</td>`
        + `<td class="bar">${pct.toFixed(1)}%</td>`
        + `<td>${mean(rows.map(x => x.turns)).toFixed(1)}</td>`
        + `<td>${mean(rows.map(x => x.deck)).toFixed(1)}</td>`
        + `<td>${mean(rows.map(x => x.keeps)).toFixed(1)}</td>`
        + `<td>${mean(of('scuffle').map(x => x.cost)).toFixed(1)}</td>`
        + `<td>${mean(of('bigScare').map(x => x.cost)).toFixed(1)}</td>`
        + `<td>${mean(of('boss').map(x => x.cost)).toFixed(1)}</td></tr>`;
      LEDGER_TABLE.push({
        region: id, fights: rows.length,
        cost: +mean(rows.map(x => x.cost)).toFixed(1),
        pct: +pct.toFixed(1),
        turns: +mean(rows.map(x => x.turns)).toFixed(1),
        deck: +mean(rows.map(x => x.deck)).toFixed(1),
        keeps: +mean(rows.map(x => x.keeps)).toFixed(1),
        scuffle: +mean(of('scuffle').map(x => x.cost)).toFixed(1),
        scare: +mean(of('bigScare').map(x => x.cost)).toFixed(1),
        boss: +mean(of('boss').map(x => x.cost)).toFixed(1),
      });
    }
    lrows += '</table>';
    say(lrows + '<pre>unaided runs only. "% of pool" is the share of MAX Courage '
      + 'one fight takes off, which is the only cross-region comparison that '
      + 'survives the pool growing.</pre>');
  }

  /* THE FIRST WING, PRICED BY DEPTH.
     The region row above averages a row-0 Scuffle fought out of the starting
     twelve cards together with the Butler on row 12, and those are the two
     halves of the Foyer's 28 defeats: 16 at the boss, 12 before it at row 3.9.
     One number cannot separate them, and the two have opposite fixes.

     What this table decides: if `% of pool` is FLAT from row 0 to row 11 the
     content is uniformly overpriced, and if it FALLS the opening deck is the
     cause and the content is fine. `deck` beside it is the control — a cost
     that falls while the deck stands still is not the deck.  */
  say('<h2>the first wing, by depth</h2>');
  {
    const LED = results.filter(r => !r.shepherd).flatMap(r => r.ledger || [])
      .filter(x => x.region === 'foyer' && x.row >= 0);
    const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);
    let drows = '<table><tr><th>row</th><th>fights</th><th>what</th><th>mean cost</th>'
      + '<th>% of pool</th><th>turns</th><th>deck</th><th>keeps</th>'
      + '<th>Courage in</th><th>lost</th></tr>';
    const maxRow = Math.max(0, ...LED.map(x => x.row));
    for (let r = 0; r <= maxRow; r++) {
      const rows = LED.filter(x => x.row === r);
      if (!rows.length) continue;
      const pct = mean(rows.map(x => (x.max ? x.cost / x.max : 0))) * 100;
      const inPct = mean(rows.map(x => (x.max ? x.hpBefore / x.max : 0))) * 100;
      const kinds = {};
      for (const x of rows) kinds[x.type] = (kinds[x.type] || 0) + 1;
      const what = Object.entries(kinds).sort((a, b) => b[1] - a[1])
        .map(([k, n]) => k + ' ' + n).join(' · ');
      const lost = rows.filter(x => !x.won).length;
      drows += `<tr><td>${r}</td><td>${rows.length}</td><td>${what}</td>`
        + `<td>${mean(rows.map(x => x.cost)).toFixed(1)}</td>`
        + `<td class="bar">${pct.toFixed(1)}%</td>`
        + `<td>${mean(rows.map(x => x.turns)).toFixed(1)}</td>`
        + `<td>${mean(rows.map(x => x.deck)).toFixed(1)}</td>`
        + `<td>${mean(rows.map(x => x.keeps)).toFixed(1)}</td>`
        + `<td>${inPct.toFixed(0)}%</td><td>${lost}</td></tr>`;
      DEPTH_TABLE.push({
        row: r, fights: rows.length, what,
        cost: +mean(rows.map(x => x.cost)).toFixed(1), pct: +pct.toFixed(1),
        turns: +mean(rows.map(x => x.turns)).toFixed(1),
        deck: +mean(rows.map(x => x.deck)).toFixed(1),
        keeps: +mean(rows.map(x => x.keeps)).toFixed(1),
        inPct: +inPct.toFixed(0), lost,
      });
    }
    drows += '</table>';
    say(drows + '<pre>unaided runs only. "Courage in" is the share of the pool '
      + 'the player still had when the fight STARTED.</pre>');
  }

  /* IS THE SAFETY NET INSIDE REACHABLE PLAY?
     `combat/engine.js`'s `_losePatience` fires past turn 30. Its comment used
     to CLAIM "PATIENCE is deliberately far outside reachable play ... nothing a
     player will ever see is touched by this", nothing checked it, and this
     check is why the claim is gone: engine.js records the measurement now
     instead of a promise. The ledger already holds `turns` for every fight, so
     it costs nothing — and a safety net that starts firing during ordinary
     content stops being a safety net and becomes a difficulty mechanic nobody
     designed. Still failing, deliberately: see
     docs/notes/2026-09-06-the-other-half-of-the-fixture-farm.md. */
  {
    const ALLT = results.flatMap(r => r.ledger || []);
    /* WHO CAN EVEN ANSWER A WALL. `pierce` on the worst rows says whether THAT
       deck held an answer; this says how often ANY deck does, which is the
       number the stall rows are actually evidence about. Split by companion,
       because the answer is not evenly distributed - four cards, on two of the
       sixteen companions - so one low overall figure could mean "the drafter
       passes it" or "most companions cannot draft it at all", and those want
       completely different fixes. Note this sweep runs 5 companions, not 16. */
    const PC = {};
    for (const f of ALLT) {
      const k = f.companion || '?';
      (PC[k] || (PC[k] = { fights: 0, held: 0 })).fights++;
      if (f.pierce > 0) PC[k].held++;
    }
    PIERCE_ROW = {
      swept: COMPANIONS.length, fights: ALLT.length,
      held: ALLT.filter(f => f.pierce > 0).length,
      byCompanion: Object.entries(PC).sort((a, b) => b[1].fights - a[1].fights)
        .map(([name, v]) => ({ name, fights: v.fights, held: v.held })),
    };
    const longest = ALLT.reduce((m, f) => (f.turns > (m?.turns ?? -1) ? f : m), null);
    const over24 = ALLT.filter(f => f.turns > 24);
    const over30 = ALLT.filter(f => f.turns > 30);
    PATIENCE_ROW = {
      fights: ALLT.length,
      longest: longest ? longest.turns : 0,
      where: longest ? `${longest.region}/${longest.type}` : '-',
      over24: over24.length, over30: over30.length,
      worst: ALLT.slice().sort((a, b) => b.turns - a.turns).slice(0, 10)
        .map(f => ({ turns: f.turns, region: f.region, wing: f.wing, type: f.type,
                     /* WHO WAS HOLDING THE CONTROLLER. A row landing 0.3 a turn
                        is a wall only if the deck was trying; without this the
                        same row also reads as a bot that cannot play that
                        companion, and those are not the same defect. */
                     companion: f.companion,
                     enc: f.encId, seed: f.seed, won: !!f.won, cost: f.cost,
                     /* share of the board's Courage still standing at the end.
                        Near 0 is a GRIND and a pool or route change reaches it;
                        high is the Guard STALL engine.js describes, which
                        neither one can. */
                     leftPct: f.pool ? Math.round(100 * f.left / f.pool) : 0,
                     /* wall = Guard raised per turn; land = damage that actually
                        REACHED Courage per turn. wall > land is the stall: the
                        board re-raises more than the deck can get through, so
                        the bar cannot move and only `_losePatience` ends it. */
                     wall: f.turns ? +(f.guard / f.turns).toFixed(1) : 0,
                     land: f.turns ? +(f.dealt / f.turns).toFixed(1) : 0,
                     /* SUMMONED. Total Courage the player actually faced is what
                        they destroyed plus what was still standing; anything
                        above the board they STARTED against arrived mid-fight.
                        This is the third mechanism and it looks identical to the
                        other two in `turns`: the greenhouse boss lands 7.5 a
                        turn for 56 turns - 420 into a 464 board - and still
                        faces 68% of it, because the Head Gardener keeps
                        planting. A Guard wall is beaten by piercing it; a
                        treadmill is beaten by killing the summoner. */
                     /* SWING and ABSORBED separate the two readings `land` alone
                        collapses. A row at land 0.3 is a WALL if the deck swung
                        4.4 and the board ate 4.1 of it, and a DUD DECK if it
                        swung 0.3 and nothing was absorbed at all - identical in
                        `land`, opposite in what they ask for. `bones` lands 15.3
                        in one fight and 0.3 in another, so neither reading can
                        be assumed from the companion either. */
                     /* AND IS THE DECK EVEN PLAYING? swing 0.3 at abs 0% is a deck
                        that did nothing, but "could not act" and "acted and it
                        did not matter" are still different bugs. cpt near 0 is
                        a turn loop that never plays a card. */
                     cpt: f.turns ? +((f.played || 0) / f.turns).toFixed(1) : 0,
                     nerve: f.nerve || 0, hand: f.hand || 0, legal: f.legal || 0,
                     swing: f.turns ? +((f.dealt + f.blocked) / f.turns).toFixed(1) : 0,
                     absorbed: (f.dealt + f.blocked)
                       ? Math.round(100 * f.blocked / (f.dealt + f.blocked)) : 0,
                     summoned: Math.max(0, Math.round(f.dealt + f.left - f.pool)),
                     /* THE CONTROL on the wall reading. A stall with pierce 0
                        is a deck that never had the answer; a stall with pierce
                        held is an answer too small to matter, and only the
                        second one argues for changing the boss. */
                     pierce: f.pierce || 0, pierceIds: f.pierceIds || [] })),
    };
    /* WHERE THE COURAGE WENT, by region. Ranked by share, because the question
       is never "how much" - the cost table already says that - but WHICH BODY,
       and a boss that is expensive because of the thing standing next to it
       needs a completely different fix from one that is expensive itself. */
    SOURCE_ROWS = (() => {
      const byRegion = {};
      for (const f of ALLT) {
        const m = (byRegion[f.region] ||= {});
        for (const [k, v] of Object.entries(f.bySource || {})) m[k] = (m[k] || 0) + v;
      }
      return Object.entries(byRegion).map(([region, m]) => {
        const tot = Object.values(m).reduce((a, b) => a + b, 0) || 1;
        const top = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 4)
          .map(([name, v]) => ({ name, hp: Math.round(v), pct: Math.round(100 * v / tot) }));
        return { region, total: Math.round(tot), top };
      });
    })();

    if (over30.length) {
      /* NOT A BROKEN GATE - a real defect, named here so the next session does
         not spend a round deciding whether it broke something.

         THE CAUSE IS THE GUARD WALL, NOT DEPTH, and this message said otherwise
         until 2026-09-01. It blamed boss pools "authored by LADDER position, met
         at ROUTE position since EXPEDITION_WINGS = 6" - an attribution written
         without measuring, on a ledger that did not even record the route slot.
         Adding `wing` and `left` refuted it: only FOUR of the nine over-30
         fights are at wing two, the rest are wings three and four, and the four
         LONGEST ended with the boss 64-69% ALIVE.

         That is exactly what `_losePatience`'s own note (engine.js ~2918)
         already described with numbers: an enemy's Guard is wiped and re-granted
         every turn, so what the player must beat is Guard PER TURN, not Courage.
         The Groundskeeper "sat at 203 of 350 Courage for the last hundred and
         forty" turns. A pool cut, a route ceiling and a re-authoring all move
         Courage, and none of them can move a bar the deck cannot dent.

         So `_losePatience` is not a net that never fires. It is the resolution
         mechanism for a stall the game still has, and it resolves it AGAINST the
         player: nine of nine over-30 fights but one were LOST. */
      const stalls = over30.filter(f => f.pool && f.left / f.pool > 0.4).length;
      fail(`_losePatience fired in reachable play: ${over30.length} of ${ALLT.length} `
         + `fights ran past turn 30 (longest ${PATIENCE_ROW.longest}, ${PATIENCE_ROW.where}). `
         + `\`PATIENCE\` is meant to be a tail stop, not a difficulty mechanic. ${stalls} of them ended with the board `
         + `over 40% ALIVE, which is the Guard-per-turn stall engine.js ~2918 describes - `
         + `not a Courage pool and not a route-depth problem.`);
    }
    say('<h2>the longest fight anyone had</h2>');
    say(`<pre>${ALLT.length} fights. Longest ${PATIENCE_ROW.longest} turns `
      + `(${PATIENCE_ROW.where}). Past 24 turns: ${over24.length}. `
      + `Past 30, where <code>_losePatience</code> fires: ${over30.length}.
`
      + `engine.js used to claim PATIENCE was outside reachable play; it records the `
      + `measurement instead now, and this is what keeps the two honest.</pre>`);
  }

  /* HOW MUCH OF THE AUTHORED CONTENT A RUN CAN ACTUALLY REACH.
     `tierFor` asks for 'early' on rows 0-1, 'standard' up to rows-2, and
     'advanced' only on the last walkable row — which on a 13-row wing is ONE
     row, and that row is 11% Scuffles because it is the boss's door row, given
     over to the guaranteed Safe Room, a shop or a treasure. So an enemy that
     lives only in `advanced` formations is not rare, it is unreachable.

     This is a CONTENT question, not a balance one: a formation nobody rolls is
     a formation nobody wrote. Counted across all 50 expeditions, shepherded
     included, because reachability is about the sheet and not about skill. */
  say('<h2>which authored formations a run ever rolls</h2>');
  {
    const ALL = results.flatMap(r => r.ledger || []);
    const rolled = new Map();
    for (const f of ALL) if (f.encId) rolled.set(f.encId, (rolled.get(f.encId) || 0) + 1);
    let rrows = '<table><tr><th>region</th><th>tier</th><th>authored</th>'
      + '<th>ever rolled</th><th>never rolled</th><th>the unreachable ones</th></tr>';
    const TIERS = ['early', 'standard', 'advanced', 'elite', 'boss'];
    for (const id of RUN_REGIONS) {
      for (const tier of TIERS) {
        const pool = ENCOUNTER_LIST.filter(e => e.region === id && e.tier === tier);
        if (!pool.length) continue;
        const hit = pool.filter(e => rolled.has(e.id));
        const miss = pool.filter(e => !rolled.has(e.id));
        if (!miss.length) continue;                       // only report holes
        rrows += `<tr><td>${id}</td><td>${tier}</td><td>${pool.length}</td>`
          + `<td>${hit.length}</td><td class="bar">${miss.length}</td>`
          + `<td>${miss.map(e => e.id).join(' ')}</td></tr>`;
        REACHABLE_TABLE.push({ region: id, tier, authored: pool.length, rolled: hit.length,
                               never: miss.length, ids: miss.map(e => e.id) });
      }
    }
    rrows += '</table>';
