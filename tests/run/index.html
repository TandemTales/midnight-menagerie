    /* THE CONFOUND, AND THE CONTROL FOR IT. A wing late in the route is ENTERED
       rarely, so its holes could be sampling rather than structure. This table
       is immune to that: it asks, of the fights that DID happen, which tier
       band they came from. `tierFor` gives 'advanced' only on row rows-2 — the
       boss's DOOR row, which is 26% Safe Room and 11% Scuffle — so if the band
       is structurally starved it shows up here whatever the reach was. */
    const tierN = {};
    for (const f of ALL) if (f.encTier) tierN[f.encTier] = (tierN[f.encTier] || 0) + 1;
    const totF = Object.values(tierN).reduce((a, b) => a + b, 0) || 1;
    let trs = '<table><tr><th>tier</th><th>fights</th><th>share of all fights</th>'
      + '<th>formations authored</th></tr>';
    for (const t of TIERS) {
      const authored = ENCOUNTER_LIST.filter(e => RUN_REGIONS.includes(e.region) && e.tier === t).length;
      trs += `<tr><td>${t}</td><td>${tierN[t] || 0}</td>`
        + `<td class="bar">${(100 * (tierN[t] || 0) / totF).toFixed(1)}%</td>`
        + `<td>${authored}</td></tr>`;
      TIER_TABLE.push({ tier: t, fights: tierN[t] || 0,
                        pct: +(100 * (tierN[t] || 0) / totF).toFixed(1), authored });
    }
    trs += '</table>';
    say(trs + '<pre>Which tier the fights that DID happen were drawn from. Immune to '
      + 'how often a wing was reached.</pre>');
    const tot = ENCOUNTER_LIST.filter(e => RUN_REGIONS.includes(e.region)).length;
    const seen = ENCOUNTER_LIST.filter(e => RUN_REGIONS.includes(e.region) && rolled.has(e.id)).length;
    say(rrows + `<pre>${seen} of ${tot} authored formations were rolled at least once `
      + `across all 50 expeditions. Rows with no hole are omitted.</pre>`);
  }

  /* DOES THE TUTORIAL REGION TEACH WHAT IT SAYS IT TEACHES?
     `docs/design/regions/01-foyer.md` §33 is a CONTRACT, and an unusually
     checkable one: "By the time they defeat The Butler, the player has been
     taught, PRIMARILY THROUGH COMBAT RATHER THAN POP UP TUTORIALS" — ten
     lessons, each carried by one of the wing's six ordinary enemies. The
     chapter rejects pop-ups outright, which means the encounter ladder IS the
     onboarding and the only way it can teach is by the player MEETING the
     bodies. So: of the six, how many does a run actually see before the door?

     Counted by `defId` on the built board, before the fight. */
  const FOYER_TEACHERS = [
    ['dust-bunny',        'some enemies become dangerous when ignored'],
    ['coatrack-crawler',  'attacks can be weakened before they happen'],
    ['lost-luggage',      'deck pollution exists'],
    ['calling-bell',      'small support enemies are priority targets'],
    ['red-carpet-runner', 'large attacks are telegraphed'],
    ['door-greeter',      'a rule can alter sequencing, and breaking it can be right'],
  ];
  say('<h2>what the first wing actually teaches</h2>');
  {
    const byRun = new Map();
    for (const r of results.filter(x => !x.shepherd)) {
      for (const f of r.ledger || []) {
        if (f.region !== 'foyer' || f.type === 'boss') continue;
        if (!byRun.has(f.seed)) byRun.set(f.seed, new Set());
        for (const d of f.met || []) byRun.get(f.seed).add(d);
      }
    }
    const runs = [...byRun.values()];
    const seen = (id) => runs.filter(s => s.has(id)).length;
    let trows = '<table><tr><th>the enemy</th><th>the lesson it carries</th>'
      + '<th>runs that met it</th><th>share</th></tr>';
    for (const [id, lesson] of FOYER_TEACHERS) {
      const n = seen(id);
      const pct = runs.length ? (100 * n / runs.length) : 0;
      trows += `<tr><td>${id}</td><td>${lesson}</td>`
        + `<td>${n} / ${runs.length}</td>`
        + `<td class="bar">${pct.toFixed(0)}%</td></tr>`;
      TEACH_TABLE.push({ id, lesson, met: n, of: runs.length, pct: +pct.toFixed(0) });
    }
    trows += '</table>';
    const cover = runs.map(s => FOYER_TEACHERS.filter(([id]) => s.has(id)).length);
    const hist = {};
    for (const c of cover) hist[c] = (hist[c] || 0) + 1;
    TEACH_COVER = { hist, mean: cover.length ? cover.reduce((a, b) => a + b, 0) / cover.length : 0,
                    runs: runs.length };
    let crows = '<table><tr><th>of the six, met</th><th>runs</th></tr>';
    for (let k = 0; k <= 6; k++) if (hist[k]) crows += `<tr><td>${k}</td><td>${hist[k]}</td></tr>`;
    crows += '</table>';
    say(trows + '<pre>a run meets ' + TEACH_COVER.mean.toFixed(1)
      + ' of the six on average, before the Butler</pre>' + crows);
  }

  /* WHAT THE PLAYER BRINGS TO THE DOOR.
     `hpBefore` has been recorded for every fight since this ledger existed and
     never printed, and it is the whole difference between "the boss costs too
     much" and "the player arrives broke" — which are, again, opposite fixes.
     A boss that costs 65% of a pool is fine if you meet it at 100% and fatal
     if you meet it at 60%, and only this column can tell you which. */
  say('<h2>what the player brings to each boss door</h2>');
  {
    const LED = results.filter(r => !r.shepherd).flatMap(r => r.ledger || [])
      .filter(x => x.type === 'boss');
    const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);
    let arows = '<table><tr><th>region</th><th>bosses</th><th>Courage in</th>'
      + '<th>arrives at</th><th>boss costs</th><th>of pool</th>'
      + '<th>margin</th><th>lost</th>'
      + '<th>won: hp/deck</th><th>lost: hp/deck</th></tr>';
    for (const id of RUN_REGIONS.filter(id => LED.some(x => x.region === id))) {
      const rows = LED.filter(x => x.region === id);
      const inPct = mean(rows.map(x => (x.max ? x.hpBefore / x.max : 0))) * 100;
      const costPct = mean(rows.map(x => (x.max ? x.cost / x.max : 0))) * 100;
      const lost = rows.filter(x => !x.won).length;
      /* THE DISCRIMINATOR. Two runs at the same door, one wins and one does
         not: if the loser arrived with the same COURAGE and a smaller DECK,
         the wing starved it of cards, and no amount of boss tuning is the fix.
         If it arrived with less Courage, the wing bled it and the boss is
         merely where the bill came due. */
      const W = rows.filter(x => x.won), L = rows.filter(x => !x.won);
      const pair = (xs) => xs.length
        ? mean(xs.map(x => (x.max ? x.hpBefore / x.max : 0)) ).toFixed(2).slice(1)
          + ' / ' + mean(xs.map(x => x.deck)).toFixed(1)
        : '-';
      arows += `<tr><td>${id}</td><td>${rows.length}</td>`
        + `<td>${mean(rows.map(x => x.hpBefore)).toFixed(1)}</td>`
        + `<td class="bar">${inPct.toFixed(0)}%</td>`
        + `<td>${mean(rows.map(x => x.cost)).toFixed(1)}</td>`
        + `<td>${costPct.toFixed(0)}%</td>`
        + `<td>${(inPct - costPct).toFixed(0)}pp</td><td>${lost}</td>`
        + `<td>${pair(W)}</td><td>${pair(L)}</td></tr>`;
      ARRIVAL_TABLE.push({
        region: id, bosses: rows.length,
        hpIn: +mean(rows.map(x => x.hpBefore)).toFixed(1), inPct: +inPct.toFixed(0),
        cost: +mean(rows.map(x => x.cost)).toFixed(1), costPct: +costPct.toFixed(0),
        margin: +(inPct - costPct).toFixed(0), lost,
        wonHp: W.length ? +(mean(W.map(x => (x.max ? x.hpBefore / x.max : 0))) * 100).toFixed(0) : null,
        wonDeck: W.length ? +mean(W.map(x => x.deck)).toFixed(1) : null,
        lostHp: L.length ? +(mean(L.map(x => (x.max ? x.hpBefore / x.max : 0))) * 100).toFixed(0) : null,
        lostDeck: L.length ? +mean(L.map(x => x.deck)).toFixed(1) : null,
      });
    }
    arows += '</table>';
    say(arows + '<pre>unaided runs only. "margin" is arrival minus price, in '
      + 'points of the pool: below zero the average run cannot pay.</pre>');
  }

  /* WHERE THE FIFTY-FIVE KEEPSAKES COME FROM. Priced at the source rather than
     inferred from the room census: a Shop that SELLS three and a Treasure that
     GIVES one are the same row in that census and completely different
     economies. */
  say('<h2>what each kind of room hands over</h2>');
  {
    const P2 = results.filter(r => !r.shepherd).flatMap(r => r.purse || []);
    const runs = results.filter(r => !r.shepherd).length || 1;
    const kinds = [...new Set(P2.map(x => x.type))];
    let prows = '<table><tr><th>room</th><th>visits</th><th>keepsakes</th>'
      + '<th>per visit</th><th>per run</th><th>cards</th></tr>';
    for (const k of kinds.sort()) {
      const rows = P2.filter(x => x.type === k);
      const keeps = rows.reduce((a, b) => a + b.keeps, 0);
      const cards = rows.reduce((a, b) => a + b.cards, 0);
      prows += `<tr><td>${k}</td><td>${rows.length}</td><td>${keeps}</td>`
        + `<td>${(keeps / (rows.length || 1)).toFixed(2)}</td>`
        + `<td class="bar">${(keeps / runs).toFixed(2)}</td>`
        + `<td>${(cards / runs).toFixed(2)}</td></tr>`;
      PURSE_TABLE.push({ type: k, visits: rows.length, keeps,
                         per: +(keeps / (rows.length || 1)).toFixed(2),
                         perRun: +(keeps / runs).toFixed(2),
                         cardsPerRun: +(cards / runs).toFixed(2) });
    }
    prows += '</table>';
    say(prows + `<pre>${runs} unaided runs.</pre>`);
  }

  /* WINGS DEEP, not "which region is number 3".
     An expedition is a ROUTE now — the Foyer, the Heart, and a seeded selection
     between — so wing 3 is a different wing in different runs and naming it off
     `RUN_REGIONS[k-1]` would print a region most of those runs never entered.
     Depth is the thing this table was always measuring; the census below says
     which wings the fifty expeditions actually opened. */
  say('<h2>wings reached</h2>');
  {
    const deepest = (r) => (r.run.regionIndex ?? 0) + 1;
    let rrows = '<table><tr><th>wing</th><th>unaided</th><th>shepherded</th></tr>';
    for (let k = 1; k <= Math.max(...results.map(deepest), 1); k++) {
      const un = results.filter(r => !r.shepherd && deepest(r) >= k).length;
      const sh = results.filter(r => r.shepherd && deepest(r) >= k).length;
      // The wings that WERE wing k, across the fifty routes.
      const names = [...new Set(results.map(r => (r.run.route || RUN_REGIONS)[k - 1])
                                       .filter(Boolean))].sort();
      rrows += `<tr><td>${k} ${names.join(' / ')}</td><td>${un}</td><td>${sh}</td></tr>`;
      REACH.push({ region: k, id: names.join(' / '), unaided: un, shepherded: sh });
    }
    const vU = results.filter(r => !r.shepherd && r.run.result === 'victory').length;
    const vS = results.filter(r => r.shepherd && r.run.result === 'victory').length;
    VICTORIES = { unaided: vU, shepherded: vS,
                  unaidedOf: results.filter(r => !r.shepherd).length,
                  shepherdedOf: results.filter(r => r.shepherd).length };
    say(rrows + '</table>'
      + `<pre>victories: ${vU}/${VICTORIES.unaidedOf} unaided, ${vS}/${VICTORIES.shepherdedOf} shepherded</pre>`);
  }

  /* WHICH WINGS THE HOUSE OPENED.
     A region nothing ever routes through is unreachable content, which is the
     class this project has spent whole sessions on — so this is gated. But it
     is NOT gated on these fifty any more, and that change is the point:

     fifty expeditions is a tiny sample of a graph, and half of them die before
     the third wing, so the wings that sit three doors from the front hall were
     failing this check for the arithmetic of the sample rather than for
     anything about the router. The fifty are still PRINTED, because how deep a
     real run gets is worth seeing beside where it went.

     The gate is the sweep below: four thousand routes off the real
     `wingOffer`, with a player who picks uniformly among what the house opens.
     That is strictly stronger than "at least one of fifty" — it asserts a
     FLOOR under every wing, so a wing quietly falling to 2% would fail here
     while still passing the old check. */
  say('<h2>which wings the routes opened</h2>');
  {
    const seen = {};
    for (const r of results) for (const id of (r.run.route || [])) seen[id] = (seen[id] || 0) + 1;
    let wrows = '<table><tr><th>wing</th><th>of the 50</th></tr>';
    for (const id of RUN_REGIONS) {
      wrows += `<tr><td>${id}</td><td>${seen[id] || 0}</td></tr>`;
      ROUTED.push({ id, runs: seen[id] || 0 });
    }
    say(wrows + '</table>');
  }

  say('<h2>where four thousand routes go</h2>');
  {
    const N = 4000, W = EXPEDITION_WINGS;
    /** The floor every wing has to clear. Measured; see the note. */
    const FLOOR = 0.07;
    const runs = {}, slots = {};
    for (const id of RUN_REGIONS) { runs[id] = 0; slots[id] = new Array(W).fill(0); }
    let bad = 0, empty = 0;
    /* THE PICKER HAS TO BE UNBIASED OR THIS TABLE MEASURES THE PICKER.
       It was a hand-rolled LCG sharing one state across every route and step:
       `s = (s * 1103515245 + 12345) & 0x7fffffff`. Its period is 10466 against
       the ~20000 draws this sweep takes, and its low bits are correlated across
       the interleaved moduli the fork uses (15, 14, 13, 12 as wings are spent).
       In isolation it looks fine — 6000 draws of `rnd(15)` land 375-428 against
       an expected 400 — so it survived every eyeball it got while offers were
       only two or three wide.

       Measured against the game's own RNG on the SAME offers, once every wing
       became reachable and the moduli got large:

         nursery       51.3%  ->  27.4%        bathhouse   15.1%  ->  24.9%
         pumpkin       14.1%  ->  26.9%        greenhouse  17.1%  ->  26.8%

       Uniform over four middle slots drawn from fifteen candidates is 4/15 =
       26.7%, which is what the right-hand column is. The left-hand column was
       this generator, and the floor assertion below plus the distribution
       quoted in the 2026-09-06 handoff were both read off it. */
    for (let i = 0; i < N; i++) {
      const seed = 5000 + i;
      const route = [RUN_REGIONS[0]];
      for (let step = 0; step < W - 1; step++) {
        const off = wingOffer(seed, route[route.length - 1], route, step, W);
        if (!off.length) { empty++; break; }
        const to = off[new RNG(`sweep|${seed}|${step}`).int(off.length)].to;
        if (route.includes(to)) bad++;
        route.push(to);
      }
      route.forEach((id, k) => { runs[id]++; slots[id][k]++; });
    }
    let rows = '<table><tr><th>wing</th><th>% of routes</th><th>wing 1..6</th></tr>';
    const starved = [];
    for (const id of RUN_REGIONS) {
      const pct = runs[id] / N;
      const mid = id !== RUN_REGIONS[0] && id !== RUN_REGIONS[RUN_REGIONS.length - 1];
      if (mid && pct < FLOOR) starved.push(`${id} ${(pct * 100).toFixed(1)}%`);
      rows += `<tr><td>${id}</td><td class="${mid && pct < FLOOR ? 'err' : ''}">`
        + `${(pct * 100).toFixed(1)}%</td><td>${slots[id].join(' · ')}</td></tr>`;
      ROUTE_SWEEP.push({ id, pct: +(pct * 100).toFixed(1), slots: slots[id].slice(), mid });
    }
    say(rows + '</table>');
    check(!empty, `${empty} forks offered the party nowhere to go`);
    check(!bad, `${bad} crossings walked into a wing the party had already cleared`);
    check(!starved.length, `wings under the ${(FLOOR * 100).toFixed(0)}% floor: ${starved.join(', ')}`);

    /* And the doors themselves: tonight's open set must be a real subset of the
       architecture, never empty, and never the Heart — which is reached from
       wherever the party happens to be standing on the last crossing, not
       through a door. */
    let doorErr = 0;
    for (const id of RUN_REGIONS) {
      const open = openExitsFor(11, id);
      const arch = new Set((REGION_EXITS[id] || []).map(e => e.to));
      if (id !== RUN_REGIONS[RUN_REGIONS.length - 1] && !open.length) doorErr++;
      if (open.some(x => !arch.has(x) || x === RUN_REGIONS[RUN_REGIONS.length - 1])) doorErr++;
    }
    check(!doorErr, `${doorErr} wings opened a door the blueprint does not have`);

    /* EVERY WING IS REACHABLE FROM EVERY FORK, which is the whole point of the
       2026-09-06 routing change and exactly the kind of thing that rots back to
       "two or three doors" without anything failing. The offer must be the set
       of wings the party has NOT walked, minus the Heart — no more, no less.

       The Heart is checked from the other side too: it may only ever be offered
       on the last crossing, and there it must be the only thing offered. */
    const HEART_ID = RUN_REGIONS[RUN_REGIONS.length - 1];
    let offerErr = 0, heartErr = 0, offerSample = '';
    for (let t = 0; t < 200; t++) {
      const seed = 90000 + t;
      const walked = [RUN_REGIONS[0]];
      for (let step = 0; step < EXPEDITION_WINGS - 1; step++) {
        const from = walked[walked.length - 1];
        const off = wingOffer(seed, from, walked, step, EXPEDITION_WINGS);
        const got = new Set(off.map(o => o.to));
        const last = step + 1 >= EXPEDITION_WINGS - 1;
        if (last) {
          if (off.length !== 1 || off[0].to !== HEART_ID) heartErr++;
        } else {
          const want = RUN_REGIONS.filter(r =>
            r !== HEART_ID && r !== from && !walked.includes(r));
          if (got.size !== want.length || want.some(r => !got.has(r))) {
            if (!offerErr) {
              offerSample = `seed ${seed} step ${step} from ${from}: `
                + `offered ${want.length ? [...got].length : 0} of ${want.length}`;
            }
            offerErr++;
          }
          if (got.has(HEART_ID)) heartErr++;
        }
        walked.push(off[Math.abs(seed + step) % off.length].to);
      }
    }
    check(!offerErr, `${offerErr} forks did not offer every unwalked wing — ${offerSample}`);
    check(!heartErr, `${heartErr} forks handled the Heart wrongly `
      + `(it is the last crossing and nothing else)`);

    /* THE BLUEPRINT ITSELF. `REGION_EDGES` is a transcription of
       `docs/design/01-mansion-structure.md`, and a transcription is exactly the
       kind of thing that rots by one line without anything failing — so the
       shape it has to have is asserted rather than assumed:
         every edge reads both ways (a staircase is a staircase from both ends);
         every edge carries the doc's reason, because the atlas prints it;
         no wing is a dead end;
         and the whole house is one connected building. */
    {
      const bad = [];
      for (const [id, exits] of Object.entries(REGION_EXITS)) {
        if (!RUN_REGIONS.includes(id)) bad.push(`${id} is not a wing`);
        for (const e of exits) {
          if (!e.why || !e.why.trim()) bad.push(`${id} -> ${e.to} has no reason`);
          if (!(REGION_EXITS[e.to] || []).some(x => x.to === id)) {
            bad.push(`${id} -> ${e.to} is one-way`);
          }
        }
        // The Heart is allowed its single deep route; everything else joins twice.
        if (id !== RUN_REGIONS[RUN_REGIONS.length - 1] && exits.length < 2) {
          bad.push(`${id} has ${exits.length} exit(s)`);
        }
      }
      const seen2 = new Set([RUN_REGIONS[0]]), q = [RUN_REGIONS[0]];
      for (let i = 0; i < q.length; i++) {
        for (const e of (REGION_EXITS[q[i]] || [])) {
          if (!seen2.has(e.to)) { seen2.add(e.to); q.push(e.to); }
        }
      }
      const cut = RUN_REGIONS.filter(id => !seen2.has(id));
      if (cut.length) bad.push(`unreachable from the Foyer on the blueprint: ${cut.join(', ')}`);
      say(`<pre>blueprint: ${Object.values(REGION_EXITS).reduce((n, v) => n + v.length, 0) / 2} `
        + `edges across ${RUN_REGIONS.length} wings, all two-way, all reasoned</pre>`);
      check(!bad.length, `blueprint graph: ${bad.slice(0, 6).join('; ')}`);
    }
  }

  say('<h2>rooms entered, by kind</h2>');
  {
    let vrows = '<table><tr><th>kind</th><th>entered</th><th></th></tr>';
    for (const [k, v] of Object.entries(VISITED).sort((a, b) => b[1] - a[1])) {
      vrows += `<tr><td>${k}</td><td>${v}</td><td class="bar">${'#'.repeat(Math.ceil(v / 2))}</td></tr>`;
    }
    say(vrows + '</table>');
  }

  say('<h2>how far each run got</h2>');
  {
    const depth = [];
    let drows = '<table><tr><th>outcome</th><th>room</th><th>depth</th><th>deck</th><th>runs</th></tr>';
    const buckets = {};
    for (const r of results) {
      const L = r.lastRoom; if (!L) continue;
      const frac = L.rows > 1 ? L.row / (L.rows - 1) : 0;
      if (r.run.result !== 'victory') depth.push(frac);
      const k = `${r.run.result === 'victory' ? 'victory' : 'defeat/' + L.region}|${L.type}`;
      const b = buckets[k] || (buckets[k] = { n: 0, row: 0, rows: L.rows, deck: 0 });
      b.n++; b.row += L.row; b.deck += L.deck;
    }
    for (const [k, b] of Object.entries(buckets).sort((a, c) => c[1].n - a[1].n)) {
      const [end, type] = k.split('|');
      drows += `<tr><td>${end}</td><td>${type}</td>`
        + `<td>row ${(b.row / b.n).toFixed(1)} of ${b.rows - 1}</td>`
        + `<td>${(b.deck / b.n).toFixed(1)}</td><td>${b.n}</td></tr>`;
    }
    const mean = depth.length ? depth.reduce((a, b) => a + b, 0) / depth.length : 0;
    say(drows + '</table>'
      + `<pre>a losing run gets ${(mean * 100).toFixed(0)}% of the way through its region</pre>`);
    ENDS_DETAIL = Object.entries(buckets).map(([k, b]) => {
      const [end, type] = k.split('|');
      return { end, type, n: b.n, row: +(b.row / b.n).toFixed(1), rows: b.rows - 1,
               deck: +(b.deck / b.n).toFixed(1) };
    }).sort((a, b) => b.n - a.n);
    DEPTH_FRAC = +(mean).toFixed(3);
  }

  say('<h2>end state</h2>');
  let erows = '<table><tr><th>outcome</th><th>runs</th><th></th></tr>';
  for (const [k, v] of Object.entries(ends).sort((a, b) => b[1] - a[1])) {
    erows += `<tr><td>${k}</td><td>${v}</td><td class="bar">${'#'.repeat(v)}</td></tr>`;
  }
  say(erows + '</table>');

  say('<h2>deck and purse at the end</h2>');
  const decks = results.map(r => r.run.deck.length);
  const purses = results.map(r => r.run.lostThings);
  const keeps = results.map(r => r.run.keepsakes.length);
  const stat = (a) => `min ${Math.min(...a)} / mean ${(a.reduce((x, y) => x + y, 0) / a.length).toFixed(1)} / max ${Math.max(...a)}`;
  say(`<pre>deck      ${stat(decks)}
purse     ${stat(purses)}
keepsakes ${stat(keeps)}
autosaves ${saveCount}</pre>`);

  if (errors.length) {
    say('<h2>errors</h2>');
    for (const e of errors.slice(0, 60)) say(`<pre class="err">${e}</pre>`);
  }

  const ms = Math.round(performance.now() - t0);
  const line = `RESULT: ${results.length} runs, ${errors.length} errors`;
  sum.className = errors.length ? 'fail' : 'pass';
  sum.textContent = `${line}  ·  ${ms} ms`;
  console.log(line);
  if (PROBE.on) {
    const r0 = results[0];
    window.__PROBE_RESULT__ = {
      index: PROBE.index, seed: 1000 + PROBE.index * 7717,
      companion: r0 && r0.companion, kid: r0 && r0.kid, haunt: r0 && r0.haunt,
      shepherd: r0 && r0.shepherd, elitist: r0 && r0.elitist,
      fights: (r0 && r0.ledger || []).map(f => ({
        region: f.region, type: f.type, wing: f.wing, encId: f.encId,
        encTier: f.encTier, turns: f.turns, won: f.won, pool: f.pool,
        left: f.left, dealt: f.dealt, blocked: f.blocked, guard: f.guard,
        played: f.played, deckSize: f.deck, met: f.met,
        cost: f.cost, hpBefore: f.hpBefore, hpAfter: f.hpAfter,
        pierce: f.pierce, bySource: f.bySource, probe: f.probe,
      })),
    };
  }
  window.__RUN_RESULT__ = {
    runs: results.length, errors: errors.length, errorList: errors.slice(0, 60),
    ms, meanRooms: +avg.toFixed(1), ends,
    lengths, decks, purses, keeps, saveCount,
    endsDetail: ENDS_DETAIL, depthFrac: DEPTH_FRAC, visited: VISITED,
    reach: REACH, routed: ROUTED, routeSweep: ROUTE_SWEEP, routeFloor: 7, victories: VICTORIES, draws: DRAWS, ledger: LEDGER_TABLE, purse: PURSE_TABLE,
    depth: DEPTH_TABLE, arrival: ARRIVAL_TABLE,
    teach: TEACH_TABLE, teachCover: TEACH_COVER, reachable: REACHABLE_TABLE,
    tiers: TIER_TABLE, patience: PATIENCE_ROW, pierceCover: PIERCE_ROW,
    sources: SOURCE_ROWS,
    determinism: detOk, resume: resumeOk, storage: storeOk,
    combatResume: combatResume, combatResumeTried: combatResumeTried, replayed,
  };
}

main().catch((e) => {
  sum.className = 'fail';
  sum.textContent = 'RESULT: 0 runs, 1 errors (harness crashed)';
  say(`<pre class="err">${e && e.stack ? e.stack : e}</pre>`);
  window.__RUN_RESULT__ = { runs: 0, errors: 1, errorList: [String(e && e.stack || e)] };
});
</script>
</body>
</html>
