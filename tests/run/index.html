<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Menagerie — run layer simulation</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 28px 60px; background: #0d0b16; color: #c3bbcd;
         font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  h1 { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: #f4efe4; margin: 0 0 4px; }
  .sub { color: #8b839a; margin-bottom: 18px; font-size: 12px; }
  #summary { position: sticky; top: 0; z-index: 5; padding: 12px 14px; margin: 0 0 18px;
             border-radius: 8px; background: #14111f; border: 1px solid #2a2442; font-size: 15px; }
  #summary.pass { border-color: #3fb4d0; color: #a8ecf7; }
  #summary.fail { border-color: #cf3c28; color: #ff9c8a; }
  h2 { font-size: 13px; color: #f4efe4; margin: 20px 0 6px; letter-spacing: .06em; }
  pre { margin: 0; white-space: pre-wrap; }
  .err { color: #ff9c8a; background: #1a0f12; padding: 8px 10px; border-radius: 6px; margin: 6px 0; }
  .ok  { color: #6fd9ec; }
  table { border-collapse: collapse; margin: 4px 0 0; }
  td, th { padding: 1px 14px 1px 0; text-align: left; font-weight: 400; }
  th { color: #8b839a; }
  .bar { color: #f8c96b; }
</style>
</head>
<body>
<h1>Run layer — headless simulation</h1>
<div class="sub">
  50 seeded expeditions driven straight through <code>state/run.js</code>: map &rarr; combat &rarr;
  reward &rarr; next node &rarr; &hellip; &rarr; boss. No scenes, no DOM, no rendering.
  Asserts determinism, autosave/resume round-trips and resource sanity.
</div>
<div id="summary">running&hellip;</div>
<div id="out"></div>

<script type="module">
import { RNG, hashSeed } from '../../game/src/core/rng.js';
import { Save } from '../../game/src/core/save.js';
import { Run, STARTER_SLUGS } from '../../game/src/state/run.js';
import { NodeType, REGION_ORDER } from '../../game/src/data/schema.js';
import { cardById } from '../../game/src/data/cards.js';
import * as P from '../critic-design/lib/policy.js';
import { competentTurn } from '../critic-design/lib/bot.js';

const out = document.getElementById('out');
const sum = document.getElementById('summary');
const say = (html, cls = '') => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; out.appendChild(d); };

const errors = [];
let ENDS_DETAIL = [], DEPTH_FRAC = 0;
/* Which kinds of room the 50 expeditions actually enter. A deliberate router
   is a better player and a WORSE sampler, and the trade is only acceptable if
   it is watched: a harness that quietly stopped entering Big Scares would keep
   printing green while covering less than the random one it replaced. */
const VISITED = {};
const REACH = [];
let VICTORIES = null;
const fail = (msg) => { errors.push(msg); };
const check = (cond, msg) => { if (!cond) fail(msg); return !!cond; };

/* ────────────────────────────────────────────────────────────────────────────
   An in-memory stand-in for localStorage.

   The run autosaves after every state change and a snapshot carries the whole
   region map, so 50 expeditions against the real localStorage is tens of
   thousands of multi-kilobyte string writes and the harness spends its life in
   the storage layer rather than in the code under test.  Three runs at the end
   go through the REAL Save/localStorage path to prove that seam works.
   ──────────────────────────────────────────────────────────────────────────── */
const realSaveRun = Save.saveRun.bind(Save);
const realLoadRun = Save.loadRun.bind(Save);
const realClear   = Save.clearRun.bind(Save);
let MEM = null;
let saveCount = 0;
function useMemorySave() {
  Save.saveRun = (s) => { saveCount++; MEM = JSON.stringify(s); };
  Save.loadRun = () => (MEM ? JSON.parse(MEM) : null);
  Save.clearRun = () => { MEM = null; };
}
function useRealSave() {
  Save.saveRun = realSaveRun; Save.loadRun = realLoadRun; Save.clearRun = realClear;
}

/* ────────────────────────────────────────────────────────────────────────────
   Meta-progression isolation.

   A seed reproduces a run *given the same meta state* — and that is on purpose:
   `generateRegionMap` is handed `rescued`, because the design doc's premise is
   that "the house reacts differently to different Kids and Companions".  A run
   that ends writes its rescues into Save.data, so run #2 of a batch legitimately
   gets a different Foyer from run #1 with the same seed.  Every simulation here
   therefore starts from a pristine meta save, and the determinism test restores
   it before replaying.
   ──────────────────────────────────────────────────────────────────────────── */
const PRISTINE_META = JSON.parse(JSON.stringify(Save.data));
function resetMeta() { Save.data = JSON.parse(JSON.stringify(PRISTINE_META)); }

/* ── deck-building ────────────────────────────────────────────────
   The combat bot below scores every PLAY with the engine's own `preview()`.
   Until 2026-08-30 it then built its DECK with a die: a random one of the three
   offered cards 70% of the time, and three independent coin-flips at the shop.
   So it played a considered game with a random pile — it reached the Butler on
   about fourteen cards holding a mean of 177 unspent Lost Things, 46 of 50 runs
   died inside the Foyer, and no content past region 1 was exercised by anything.

   `tests/critic-design/lib/policy.js` is this project's existing answer to
   "what would a player take": `draft`, `shopPlan`, `restChoice`, `pickUpgrade`
   and `pickEventOption`, driven off each Companion's own declared archetypes.
   `expedition.js` has drafted with it since the balance sim was built, so
   reusing it here also stops the two harnesses disagreeing about what a run is.

   It is a HEURISTIC and not a solver, which is exactly the bar this harness
   needs: deck-building as considered as the combat already was, so that
   reaching the Nursery is ordinary. It is not trying to be a good player.
   Every function in it is pure, so the run stays reproducible off its seed.  */
const POLICY = 'balanced';
const draftCtx = (run) => ({
  core: P.coreSets(run.companion), deckSize: run.deck.length, skipFloor: 4,
});
/** The card in `cards` a player would pay Mr. Moth to forget. */
function leastValuable(run, cards) {
  const ctx = draftCtx(run);
  let worst = null;
  for (const c of cards) {
    const def = cardById(c.id);
    if (!def) continue;
    const v = P.cardValue(def, POLICY, ctx);
    if (!worst || v < worst.v) worst = { uid: c.uid, v };
  }
  return worst?.uid || null;
}

/* ── the combat bot ─────────────────────────────────────────────────────────
   `competentTurn` from the balance harness — the SAME bot the Butler's 64.6%
   and every tuned number in tests/critic-design were measured against.

   Until 2026-08-30 this was a private greedy bot: score each card with
   `preview()`, play the best, repeat. It won about one fight in six against
   the Butler where the balance bot wins two in three, and it never ate a Snack,
   so the run layer bought them, carried them and threw them away unopened. TWO
   BOTS THAT DISAGREE ABOUT WHAT A PLAYER IS produce two pictures of the game
   and neither can be believed over the other; this harness's was the
   pessimistic one, which is how "46 of 50 runs die in the Foyer" came to read
   as a fact about the content rather than about the harness.

   It is a beam search that scores a whole turn by simulating the enemy phase
   that follows it, so it is far slower per turn than what it replaces. That is
   paid once, here, and it buys every region past the first.

   `budgetTurns` stays at 80 rather than the balance harness's 60: this one has
   to resolve every fight the run layer can produce, and an unresolved fight is
   reported as a failure rather than hidden as a timeout.                      */
async function playCombat(engine, budgetTurns = 80, run = null) {
  await engine.startCombat();
  // Per-fight running estimates the bot projects the rest of the fight from.
  // One object per fight, never shared between fights.
  const fc = { dps: 10, threat: 8, guard: 4, peak: 0, turns: 0 };
  const onSnack = (i, s) => {
    if (run && Array.isArray(run.snacks)) {
      const at = run.snacks.indexOf(s);
      if (at >= 0) run.snacks.splice(at, 1);
    }
  };
  let turns = 0;
  while (!engine.over && turns++ < budgetTurns) {
    await competentTurn(engine, { snacks: run ? run.snacks : null, onSnack, fc });
    if (engine.over) break;
    await engine.endTurn();
  }
  if (!engine.over) {
    // A fight that will not resolve is a real failure, not a timeout to hide.
    fail(`combat did not resolve in ${budgetTurns} turns`);
    return false;
  }
  return true;
}

/**
 * Every fourth expedition hunts elites.
 *
 * `pickNode` scores a Big Scare at -40 below 82% Courage, which is a correct
 * thing for a player to do and cost this harness most of its elite coverage
 * the moment it started routing deliberately: Big Scares entered across 50
 * runs went from roughly one a room to 10. A deliberate router is a better
 * player and a WORSE sampler. This is the part of the old random sampler that
 * is worth keeping, made explicit and counted rather than hoped for.
 */
function preferBigScare(run, nodes) {
  if (run.courage / run.maxCourage < 0.5) return null;
  return nodes.find(n => run.effectiveType(n) === NodeType.BIG_SCARE) || null;
}

/** Lowest-Courage living enemy, so the board actually thins out. */
function pickTarget(engine, card) {
  const alive = engine.livingEnemies();
  if (!alive.length) return null;
  let t = alive[0];
  for (const e of alive) if (e.hp < t.hp) t = e;
  return t.id;
}

/* ── drive one whole expedition ─────────────────────────────────────────── */
async function simulate(seed, { companion = 'marmalade', kid = 'maya', haunt = 0, trace = null,
  shepherd = false, elitist = false } = {}) {
  resetMeta();
  const run = new Run({ companion, kid, seed, hauntLevel: haunt });
  const pick = run.fork('sim:path');
  const dice = run.fork('sim:choices');
  const t = trace || [];
  let steps = 0;
  /* WHERE a run ends is the whole diagnosis and the harness never recorded it.
     "46 defeats in the Foyer" reads as a bot that cannot fight; the Foyer is
     13 rows deep, so it mattered enormously whether those were row 3 or the
     Butler on row 12, and nothing here could tell them apart. */
  let lastRoom = null;

  const log = (s) => t.push(s);
  log(`seed ${run.seed} ${companion}/${kid} h${haunt}`);

  while (!run.result && steps++ < 400) {
    // `shepherd` runs exist to exercise the *back half* of an expedition —
    // the boss fight, the boss reward, completeRegion() and the victory end —
    // which a bot this crude would otherwise never reach.
    if (shepherd) run.courage = run.maxCourage;

    /* ROUTING. This was a uniform random pick over the legal nodes, which is
       not what a player does and is the other half of why the bot never left
       the Foyer: fifteen of thirty-eight Foyer defeats were at a Big Scare it
       had walked into at whatever Courage it happened to have. `pickNode` is
       the balance harness's own router — Safe Rooms deep in the region, shops
       when rich, Big Scares only when healthy, and the boss when it appears.
       The 50 maps are still 50 different maps, so path diversity survives; the
       node-type census below is here to prove it rather than assume it. */
    const legalNodes = run.legalNodes();
    if (!legalNodes.length) { fail(`seed ${seed}: stranded with no legal nodes at ${run.currentNodeId}`); break; }
    const chosen = (elitist ? preferBigScare(run, legalNodes) : null)
      || P.pickNode(run, legalNodes)
      || legalNodes[pick.int(legalNodes.length)];
    const id = chosen.id;
    const node = run.nodeById(id);
    const type = run.effectiveType(node);
    VISITED[type] = (VISITED[type] || 0) + 1;
    lastRoom = { id, type, row: node?.row ?? -1, region: run.region,
                 rows: run.map?.rows ?? 0, deck: run.deck.length };
    log(`> ${id} ${type}`);

    await run.enterNode(id);

    if (run.combat) {
      const engine = run.combat;
      const ok = await playCombat(engine, 80, run);
      if (!ok) break;
      log(`  fight ${engine.victory ? 'won' : 'lost'} hp=${run.courage}`);
    }

    if (run.result) break;

    if (run.pendingReward) {
      const r = run.pendingReward;
      if (r.cards.length) {
        // `draft` returns null when the best of the three is worse than the
        // dilution it costs, so skipping is still a live branch here.
        const take = P.draft(r.cards, POLICY, draftCtx(run));
        if (take) { run.takeRewardCard(take); log(`  took ${take}`); }
        else { run.skipRewardCards(); log('  skipped'); }
      }
      run.claimReward();
      continue;
    }

    if (run.pendingEvent) {
      if (run.pendingEvent.rescue) {
        run.rescueCompanion(run.pendingEvent.companion);
      } else {
        const def = run.currentEvent();
        const open = (def?.options || []).filter(o => run.optionOpen(o)
          && !(o.cost?.lostThings > run.lostThings));
        if (open.length) {
          // `pickEventOption` filters on `optionOpen` but not on the purse, so
          // its answer is looked up in the affordable set rather than trusted.
          const want = P.pickEventOption(run, def);
          const o = open.find(x => x.id === want) || open[0];
          const res = run.chooseEventOption(o.id);
          log(`  curiosity ${def.id}/${o.id}`);
          const p = res?.pending;
          if (p?.upgradeCard) {
            const up = run.upgradeableCards();
            for (let i = 0; i < p.upgradeCard && up.length; i++) run.upgradeCard(up[i % up.length].uid);
          }
          if (p?.removeCard) {
            for (let i = 0; i < p.removeCard; i++) {
              const rem = run.removableCards();
              if (rem.length) run.removeCard(rem[dice.int(rem.length)].uid);
            }
          }
          if (p?.combat) {
            await run.eventCombat(p.combat);
            if (run.combat) { await playCombat(run.combat, 80, run); }
            if (run.result) break;
            if (run.pendingReward) { run.claimReward(); continue; }
          }
        }
      }
      if (run.result) break;
      run.leaveNode();
      continue;
    }

    if (type === NodeType.SHOP) {
      const { buys } = P.shopPlan(run, POLICY);
      for (const b of buys) {
        if (run.lostThings < b.price) continue;
        if (b.kind === 'snack') run.buySnack(b.snack, b.price);
        else if (b.kind === 'keepsake') run.buyKeepsake(b.id, b.price);
        else if (b.kind === 'card') run.buyCard(b.id, b.price);
      }
      // Thinning is the other half of deck-building, and `shopPlan` does not
      // cover it: once the deck is thick, a Basic forgotten is worth more than
      // most cards bought. The price rises 25 a time, so this self-limits.
      if (run.deck.length > 12 && run.lostThings >= run.removalPrice) {
        const worst = leastValuable(run, run.removableCards());
        if (worst) run.buyRemoval(worst);
      }
      log(`  shop, purse ${run.lostThings}`);
      run.leaveNode();
      continue;
    }

    if (type === NodeType.SAFE) {
      const choice = P.restChoice(run);
      if (choice.kind === 'rest' && run.restHealAmount() > 0) run.rest();
      else {
        const uid = P.pickUpgrade(run, POLICY);
        if (uid) run.upgradeCard(uid);
        else run.rest();
      }
      /* Forging is still exercised, because it is a real Safe Room action and
         a doubled opener pays every remaining fight. But it is paid for in
         MAXIMUM Courage, which is the health pool: the old roll forged down to
         a floor of 10, and forged Keepsakes with no opener to double, so it
         bought nothing with the pool it spent. `forgePreview().worthwhile` is
         the run layer's own answer to which ones those are. */
      const worthForging = run.forgeableKeepsakes()
        .find(k => run.forgePreview(k.id)?.worthwhile);
      if (worthForging && run.courage / run.maxCourage > 0.8
          && run.maxCourage - run.forgeCost() >= 40) {
        run.forgeKeepsake(worthForging.id);
      }
      log(`  safe room, hp ${run.courage}/${run.maxCourage}`);
      run.leaveNode();
      continue;
    }

    // treasure and anything else already left a pendingReward or is a no-op
    run.leaveNode();
  }

  if (!run.result && steps >= 400) fail(`seed ${seed}: run never terminated (400 steps)`);
  return { run, trace: t, steps, lastRoom };
}

/* ── a stable digest of everything a run ended up being ─────────────────── */
function digest(run) {
  return JSON.stringify({
    result: run.result,
    hp: run.courage, max: run.maxCourage, gold: run.lostThings,
    deck: run.deck.map(c => `${c.id}${c.upgraded ? '+' : ''}`).sort(),
    keeps: run.keepsakes.map(k => `${k.id}${k.forged ? '*' : ''}`).sort(),
    region: run.region, clues: run.cluesFound,
    path: run.pathIds, seen: run.seenEvents,
    stats: run.stats,
  });
}

/* ── the suite ──────────────────────────────────────────────────────────── */
const COMPANIONS = ['marmalade', 'bones', 'pipkin', 'taffy', 'wink'];
const KIDS = ['maya', 'mateo', 'amina', 'eli', 'priya', 'jordan', 'lena', 'samir'];

async function main() {
  const t0 = performance.now();
  useMemorySave();

  const N = 50;
  const results = [];
  const lengths = [];
  const ends = {};

  for (let i = 0; i < N; i++) {
    const seed = 1000 + i * 7717;
    const companion = COMPANIONS[i % COMPANIONS.length];
    const kid = KIDS[i % KIDS.length];
    const haunt = i % 4;
    // Every fifth expedition is shepherded, so ~10 of the 50 walk the full
    // ladder into the Butler and out the other side.
    const shepherd = i % 5 === 0;
    const elitist = i % 4 === 1;
    let r;
    try {
      r = await simulate(seed, { companion, kid, haunt, shepherd, elitist });
    } catch (e) {
      fail(`seed ${seed} threw: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`);
      continue;
    }
    const run = r.run;
    results.push({ seed, companion, kid, haunt, shepherd, elitist, run, steps: r.steps,
                   trace: r.trace, lastRoom: r.lastRoom });

    // ── sanity ──────────────────────────────────────────────────────────────
    check(run.result === 'victory' || run.result === 'defeat',
      `seed ${seed}: ended with result=${run.result}`);
    check(run.deck.length >= 5 && run.deck.length <= 60,
      `seed ${seed}: deck size out of range (${run.deck.length})`);
    check(run.deck.every(c => !!cardById(c.id)),
      `seed ${seed}: deck holds an unknown card id`);
    check(run.lostThings >= 0, `seed ${seed}: negative ${'Lost Things'} (${run.lostThings})`);
    check(run.lostThings < 5000, `seed ${seed}: implausible purse (${run.lostThings})`);
    check(run.courage >= 0 && run.courage <= run.maxCourage,
      `seed ${seed}: courage ${run.courage}/${run.maxCourage}`);
    check(run.maxCourage >= 10, `seed ${seed}: max courage collapsed to ${run.maxCourage}`);
    check(new Set(run.keepsakes.map(k => k.id)).size === run.keepsakes.length,
      `seed ${seed}: duplicate Keepsake`);
    check(new Set(run.deck.map(c => c.uid)).size === run.deck.length,
      `seed ${seed}: duplicate card uid in deck`);

    lengths.push(run.visitedIds.length);
    const key = run.result === 'victory' ? 'victory' : `defeat/${run.region}`;
    ends[key] = (ends[key] || 0) + 1;
  }

  // ── determinism: the same seed twice, byte-identical ─────────────────────
  say('<h2>determinism</h2>');
  let detOk = 0;
  for (const pickIdx of [0, 7, 19, 33, 44]) {
    const r0 = results[pickIdx];
    if (!r0) continue;
    const again = await simulate(r0.seed, {
      companion: r0.companion, kid: r0.kid, haunt: r0.haunt, shepherd: r0.shepherd,
      elitist: r0.elitist,
    });
    const a = digest(r0.run), b = digest(again.run);
    if (a === b) { detOk++; }
    else {
      fail(`seed ${r0.seed}: replay diverged`);
      say(`<pre class="err">seed ${r0.seed}\n A ${a.slice(0, 400)}\n B ${b.slice(0, 400)}</pre>`);
    }
  }
  say(`<pre class="ok">${detOk}/5 replayed identically</pre>`);

  // ── the boss path, end to end, asserted explicitly ───────────────────────
  say('<h2>boss and victory</h2>');
  {
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed: 777 });
    // This block asserts the *shape* of the back half of an expedition — boss
    // node, boss reward, completeRegion, victory, meta write, save cleared.
    // It is not a balance test, so the Kid is given enough Courage that the
    // bot's play quality cannot make the structural assertions flaky.
    //
    // 400 STOPPED BEING ENOUGH ON 2026-08-30, when the Curses in data/neutral.js
    // started doing what they print. The bot takes `open[0]` at every Curiosity,
    // so it walks into the boss holding Night Terror ("lose 1 Courage whenever
    // you play a Trick"), and a 34-turn boss fight at three Tricks a turn is a
    // hundred Courage of self-inflicted damage that simply did not exist before.
    // Measured on seed 777: 121 Courage to `curse/night-terror` across the run.
    // That is the card working — Slay the Spire's Pain is the same card and the
    // same price — but it is exactly the "play quality" noise this number exists
    // to drown out, so the number moved. The 50-run batch above is where balance
    // is actually observed; this block only ever cared about the chain.
    run.maxCourage = 2000; run.courage = 2000;
    const pick = run.fork('sim:boss');
    let sawBoss = false, bossReward = null, steps = 0;
    const bossTrace = [];
    while (!run.result && steps++ < 60) {
      run.courage = run.maxCourage;                 // straight to the point
      // Route around Big Scares — that is a legitimate thing a player does, and
      // it keeps this structural test from turning into a balance test.
      const all = run.legalNextIds();
      if (!all.length) break;
      const safe = all.filter(n => run.effectiveType(run.nodeById(n)) !== NodeType.BIG_SCARE);
      const legal = safe.length ? safe : all;
      const id = legal[pick.int(legal.length)];
      const node = run.nodeById(id);
      const bt = run.effectiveType(node);
      const isBoss = bt === NodeType.BOSS;
      await run.enterNode(id);
      if (run.combat) {
        const eng = run.combat;
        await playCombat(eng, 80, run);
        bossTrace.push(`${node.row}:${bt} ${eng.victory ? 'won' : 'LOST'} hp=${eng.player.hp}/${eng.player.maxHp}`);
      } else bossTrace.push(`${node.row}:${bt} hp=${run.courage}`);
      if (run.result) break;
      if (isBoss) {
        sawBoss = true;
        bossReward = run.pendingReward ? { ...run.pendingReward } : null;
      }
      if (run.pendingReward) { run.claimReward(); continue; }
      if (run.pendingEvent) {
        const def = run.currentEvent();
        const open = (def?.options || []).filter(o => run.optionOpen(o) && !(o.cost?.lostThings > run.lostThings));
        if (open.length) run.chooseEventOption(open[0].id);
        if (run.result) break;
        run.leaveNode();
        continue;
      }
      run.leaveNode();
    }
    check(sawBoss, 'boss path: never reached the boss node');
    check(!!bossReward && bossReward.kind === 'boss', 'boss path: boss reward was not kind="boss"');
    check(!!bossReward?.keepsake, 'boss path: boss dropped no Keepsake');
    check(run.result === 'victory', `boss path: expected victory, got ${run.result}`);
    /* This used to assert `rescued.includes('marmalade')` — the Foyer's authored
       Companion. Marmalade is one of the four starters: she is at the clubhouse
       from the first expedition and was never in the house, so "freeing" her
       spent the run's emotional peak on nothing, and the assertion froze that
       into the suite. `Run.rescueTargetFor()` now substitutes somebody actually
       missing, and this checks the property that matters instead of the name. */
    const freedByBoss = run.companionsFreed[0];
    check(!!freedByBoss && run.rescued.includes(freedByBoss),
      `boss path: no Companion was freed (freed ${JSON.stringify(run.companionsFreed)})`);
    check(freedByBoss !== run.companion && !STARTER_SLUGS.has(freedByBoss),
      `boss path: freed ${freedByBoss}, who was never in the house`);
    check((Save.data.companionsRescued || []).includes(freedByBoss),
      'boss path: the rescue did not reach the meta save');
    check(Save.loadRun() === null, 'boss path: a finished run is still resumable');
    say('<pre class="ok">'
      + `walked ${run.visitedIds.length} rooms · ${run.result}`
      + ` · freed ${run.rescued.join(', ') || 'nobody'}`
      + ` · boss Keepsake ${bossReward?.keepsake || 'none'}` + '<br>'
      + bossTrace.join('<br>') + '</pre>');
  }

  // ── autosave / resume round-trip, mid-map ────────────────────────────────
  say('<h2>autosave / resume</h2>');
  let resumeOk = 0, resumeTried = 0;
  for (const seed of [4242, 9001, 31337]) {
    resumeTried++;
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed });
    const pick = run.fork('sim:path');
    // walk three rooms, stopping on something that is not a fight
    for (let i = 0; i < 3; i++) {
      const legal = run.legalNextIds();
      if (!legal.length) break;
      const id = legal[pick.int(legal.length)];
      await run.enterNode(id);
      if (run.combat) { await playCombat(run.combat, 80, run); if (run.pendingReward) run.claimReward(); }
      else if (run.pendingEvent || run.pendingShop) run.leaveNode();
      else run.leaveNode();
      if (run.result) break;
    }
    const before = digest(run);
    const saved = JSON.parse(JSON.stringify(run.snapshot()));
    const back = Run.resume(saved);
    if (!back) { fail(`seed ${seed}: Run.resume returned null`); continue; }
    const after = digest(back);
    if (before !== after) {
      fail(`seed ${seed}: resume round-trip lost state`);
      say(`<pre class="err">before ${before.slice(0, 400)}\nafter  ${after.slice(0, 400)}</pre>`);
      continue;
    }
    // and it must still be playable from there
    const legal = back.legalNextIds();
    check(legal.length > 0 || back.result, `seed ${seed}: resumed run has nowhere to go`);
    resumeOk++;
  }
  say(`<pre class="ok">${resumeOk}/${resumeTried} resumed identically and were still playable</pre>`);

  /* ── content registries on the REAL path ───────────────────────────────────
     scenes/combat.js registered STATUS_TRICK_DEFS on its standalone deep-link
     path and the run layer did not, so every `addCard('clutter')` an enemy made
     during an actual expedition logged "unknown card" and added nothing — Lost
     Luggage and the Grand Coatcheck had no deck interference at all in the
     shipped game while looking perfect in a deep-linked fight. Exactly the
     asymmetry CONTRACTS.md rule 9 is about, so it gets asserted against the
     real `run.buildCombat()`, not a mock.                                     */
  say('<h2>content registries (the real buildCombat path)</h2>');
  {
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed: 4242 });
    const node = run.map.nodes.find(n => run.sceneFor(n) === 'combat') || run.map.nodes[0];
    const eng = await run.buildCombat(node);
    // every id enemy content resolves by name
    for (const id of ['clutter', 'drowsy']) {
      check(!!eng.resolveCardDef(id),
        `buildCombat: addCard('${id}') would find no card — enemy deck interference is inert`);
    }
    for (const id of ['dust-bunny', 'coatrack-crawler']) {
      check(!!eng.enemyDefs.get(id), `buildCombat: summon('${id}') would find no enemy`);
    }
    check(eng.cardDefs.size > 100, `buildCombat: only ${eng.cardDefs.size} card defs registered`);
    say(`<pre class="ok">${eng.cardDefs.size} card defs · ${eng.enemyDefs.size} enemy defs`
      + ` · clutter/drowsy/dust-bunny/coatrack-crawler all resolve</pre>`);
  }

  /* ── quitting mid-Scuffle ──────────────────────────────────────────────────
     THE regression. Reloading during a fight used to hand the player the room:
     the node came back marked visited, at full Courage, with no reward and no
     damage — so any fight in the game, up to and including the Butler, could be
     skipped by pressing F5.  What must be true after a reload:

       · the node is NOT in visitedIds (it was entered, never cleared)
       · there is no pendingReward
       · Courage is what it was walking IN, never restored to full
       · the run resumes INTO the fight — same node, same encounter
       · the recorded actions replay onto the same board, or the identical
         encounter restarts from the top; never a skip either way            */
  say('<h2>quitting mid-Scuffle does not skip the fight</h2>');
  let resumeKeyed = 0, resumeKeyedTried = 0;
  let combatResume = 0, combatResumeTried = 0, replayed = 0;
  for (const seed of [5150, 8128, 60613]) {
    combatResumeTried++;
    resetMeta();
    const run = new Run({ companion: 'marmalade', kid: 'maya', seed });
    const pick = run.fork('sim:path');

    // walk until we are standing in a fight
    let steps = 0;
    while (!run.combat && steps++ < 12) {
      const legal = run.legalNextIds();
      if (!legal.length) break;
      const ids = legal.filter(id => run.sceneFor(run.nodeById(id)) === 'combat');
      await run.enterNode((ids.length ? ids : legal)[pick.int((ids.length ? ids : legal).length)]);
      if (run.combat) break;
      if (run.pendingReward) run.claimReward();
      else run.leaveNode();
      if (run.result) break;
    }
    if (!run.combat) { fail(`seed ${seed}: never reached a Scuffle to interrupt`); continue; }

    const engine = run.combat;
    const nodeId = run.currentNodeId;
    const courageOnEntry = run.pendingCombat.courageOnEntry;
    const encounter = run.pendingCombat.encounter;

    check(!run.visitedIds.includes(nodeId),
      `seed ${seed}: a Scuffle in progress is already marked cleared`);

    // play part of a turn, take some damage, then "close the tab"
    await engine.startCombat();
    let played = 0;
    for (const card of [...engine.piles.hand]) {
      if (played >= 2 || engine.over) break;
      const t = pickTarget(engine, card);
      if (!engine.canPlay(card.uid, t).ok) continue;
      await engine.playCard(card.uid, t);
      played++;
    }
    if (!engine.over) await engine.endTurn();
    if (engine.over) { fail(`seed ${seed}: the fight resolved before it could be interrupted`); continue; }
    run._combatSave();

    const boardBefore = run._combatDigest(engine);
    const hpMidFight = engine.player.hp;
    const deckBefore = run.deck.length;

    // ── the reload ────────────────────────────────────────────────────────
    const saved = JSON.parse(JSON.stringify(Save.loadRun()));
    check(!!saved.pendingCombat, `seed ${seed}: the save does not know a fight was in progress`);
    check(!(saved.visitedIds || []).includes(nodeId),
      `seed ${seed}: the save marks the unfinished Scuffle's node as visited`);
    check(!saved.pendingReward, `seed ${seed}: the save carries a reward for a fight nobody won`);
    check(saved.scene === 'combat',
      `seed ${seed}: Continue would land on "${saved.scene}", not back in the fight`);

    const back = Run.resume(saved);
    if (!back) { fail(`seed ${seed}: Run.resume returned null mid-combat`); continue; }

    check(back.currentNodeId === nodeId, `seed ${seed}: resumed standing somewhere else`);
    check(!back.visitedIds.includes(nodeId),
      `seed ${seed}: THE BUG — the unfinished room came back cleared`);
    check(!back.pendingReward, `seed ${seed}: THE BUG — a reward was granted for an unfought fight`);
    check(back.resumeScene() === 'combat',
      `seed ${seed}: resumeScene() says "${back.resumeScene()}", not combat`);
    check(back.deck.length === deckBefore, `seed ${seed}: the deck changed across the reload`);

    const mode = await back.restoreInterruptedCombat();
    check(mode === 'replay' || mode === 'restart',
      `seed ${seed}: restoreInterruptedCombat() returned ${mode}`);
    check(!!back.combat, `seed ${seed}: resumed without an engine — the fight is gone`);
    check(back.combatMeta.encounter === encounter,
      `seed ${seed}: came back to a different encounter (${back.combatMeta.encounter} vs ${encounter})`);
    check(!back.visitedIds.includes(nodeId),
      `seed ${seed}: restoring the fight cleared the node`);
    check(!back.pendingReward, `seed ${seed}: restoring the fight granted a reward`);

    if (mode === 'replay') {
      replayed++;
      check(back._combatDigest(back.combat) === boardBefore,
        `seed ${seed}: the replayed board is not the board that was left`);
      check(back.combat.player.hp === hpMidFight,
        `seed ${seed}: replayed to ${back.combat.player.hp} Courage, left at ${hpMidFight}`);
    } else {
      check(back.courage === courageOnEntry,
        `seed ${seed}: restarted at ${back.courage} Courage, walked in with ${courageOnEntry}`);
      check(back.combat.player.hp === courageOnEntry,
        `seed ${seed}: the restarted fight did not start at the entry Courage`);
    }
    // Either way the fight is still ahead of the player, not behind them.
    check(back.combat.player.hp <= courageOnEntry,
      `seed ${seed}: THE BUG — resumed with more Courage than the room was entered with`);

    /**
     * AND THE RESUMED FIGHT CAN BE INTERRUPTED AGAIN.
     *
     * `_cardKeys` names every card from the DRAW PILE, which is the whole deck
     * only before `startCombat()`. On the resume path `_wireCombat` was
     * building a second map from a MID-FIGHT draw pile — the replay having
     * already moved cards to hand, discard and exhaust — so the cards in hand
     * had no key, and the first card played after a resume could not be
     * recorded. A second interruption then lost the fight.
     */
    if (mode === 'replay') {
      const keys = back._combatKeys;
      const seat = back.combat.players[0];
      const named = seat.piles.hand.filter(c => keys && keys.byUid.has(c.uid)).length;
      check(named === seat.piles.hand.length,
        `seed ${seed}: THE BUG — ${seat.piles.hand.length - named} of ${seat.piles.hand.length}`
        + ' cards in hand have no replay key after a resume');
      resumeKeyed += named === seat.piles.hand.length ? 1 : 0;
      resumeKeyedTried++;
    }
    combatResume++;
  }
  say(`<pre class="ok">${resumeKeyed}/${resumeKeyedTried} resumed fights can be interrupted AGAIN — every card in hand still has a replay key</pre>`);
  say(`<pre class="ok">${combatResume}/${combatResumeTried} interrupted Scuffles resumed`
    + ` (${replayed} replayed onto the exact board, ${combatResume - replayed} restarted)</pre>`);

  // ── the real localStorage seam, three short runs ─────────────────────────
  say('<h2>real Save / localStorage seam</h2>');
  useRealSave();
  let storeOk = 0;
  try {
    for (const seed of [11, 22, 33]) {
      resetMeta();
      const run = new Run({ companion: 'bones', kid: 'mateo', seed });
      const legal = run.legalNextIds();
      await run.enterNode(legal[0]);
      if (run.combat) { await playCombat(run.combat, 80, run); if (run.pendingReward) run.claimReward(); }
      else run.leaveNode();
      const raw = Save.loadRun();
      if (raw && raw.seed === run.seed && Array.isArray(raw.deck)) storeOk++;
      else fail(`seed ${seed}: nothing usable came back out of localStorage`);
    }
  } finally {
    Save.clearRun();
    useMemorySave();
  }
  say(`<pre class="ok">${storeOk}/3 wrote and read back through localStorage</pre>`);

  // ── distributions ────────────────────────────────────────────────────────
  say('<h2>run length (rooms entered)</h2>');
  const hist = {};
  for (const n of lengths) { const b = Math.floor(n / 2) * 2; hist[b] = (hist[b] || 0) + 1; }
  let rows = '<table><tr><th>rooms</th><th>runs</th><th></th></tr>';
  for (const k of Object.keys(hist).map(Number).sort((a, b) => a - b)) {
    rows += `<tr><td>${k}&ndash;${k + 1}</td><td>${hist[k]}</td><td class="bar">${'#'.repeat(hist[k])}</td></tr>`;
  }
  rows += '</table>';
  const avg = lengths.reduce((a, b) => a + b, 0) / (lengths.length || 1);
  say(rows + `<pre>mean ${avg.toFixed(1)} rooms, min ${Math.min(...lengths)}, max ${Math.max(...lengths)}</pre>`);

  /* HOW FAR, not just how many. A defeat on row 3 and a defeat to the
     region boss on row 12 are different failures with different fixes, and
     "defeat/foyer 46" was hiding which of the two this harness was seeing. */
  /* HOW DEEP, and whether the run needed help getting there. Every fifth
     expedition is shepherded to full Courage each room so the back half of the
     ladder is structurally exercised; those runs say nothing about whether the
     game is reachable. Reporting one victory count over both kinds hid that. */
  say('<h2>regions reached</h2>');
  {
    const deepest = (r) => (r.run.regionIndex ?? 0) + 1;
    let rrows = '<table><tr><th>region</th><th>unaided</th><th>shepherded</th></tr>';
    for (let k = 1; k <= Math.max(...results.map(deepest), 1); k++) {
      const un = results.filter(r => !r.shepherd && deepest(r) >= k).length;
      const sh = results.filter(r => r.shepherd && deepest(r) >= k).length;
      rrows += `<tr><td>${k} ${REGION_ORDER[k - 1] || ''}</td><td>${un}</td><td>${sh}</td></tr>`;
      REACH.push({ region: k, id: REGION_ORDER[k - 1] || '', unaided: un, shepherded: sh });
    }
    const vU = results.filter(r => !r.shepherd && r.run.result === 'victory').length;
    const vS = results.filter(r => r.shepherd && r.run.result === 'victory').length;
    VICTORIES = { unaided: vU, shepherded: vS,
                  unaidedOf: results.filter(r => !r.shepherd).length,
                  shepherdedOf: results.filter(r => r.shepherd).length };
    say(rrows + '</table>'
      + `<pre>victories: ${vU}/${VICTORIES.unaidedOf} unaided, ${vS}/${VICTORIES.shepherdedOf} shepherded</pre>`);
  }

  say('<h2>rooms entered, by kind</h2>');
  {
    let vrows = '<table><tr><th>kind</th><th>entered</th><th></th></tr>';
    for (const [k, v] of Object.entries(VISITED).sort((a, b) => b[1] - a[1])) {
      vrows += `<tr><td>${k}</td><td>${v}</td><td class="bar">${'#'.repeat(Math.ceil(v / 2))}</td></tr>`;
    }
    say(vrows + '</table>');
  }

  say('<h2>how far each run got</h2>');
  {
    const depth = [];
    let drows = '<table><tr><th>outcome</th><th>room</th><th>depth</th><th>deck</th><th>runs</th></tr>';
    const buckets = {};
    for (const r of results) {
      const L = r.lastRoom; if (!L) continue;
      const frac = L.rows > 1 ? L.row / (L.rows - 1) : 0;
      if (r.run.result !== 'victory') depth.push(frac);
      const k = `${r.run.result === 'victory' ? 'victory' : 'defeat/' + L.region}|${L.type}`;
      const b = buckets[k] || (buckets[k] = { n: 0, row: 0, rows: L.rows, deck: 0 });
      b.n++; b.row += L.row; b.deck += L.deck;
    }
    for (const [k, b] of Object.entries(buckets).sort((a, c) => c[1].n - a[1].n)) {
      const [end, type] = k.split('|');
      drows += `<tr><td>${end}</td><td>${type}</td>`
        + `<td>row ${(b.row / b.n).toFixed(1)} of ${b.rows - 1}</td>`
        + `<td>${(b.deck / b.n).toFixed(1)}</td><td>${b.n}</td></tr>`;
    }
    const mean = depth.length ? depth.reduce((a, b) => a + b, 0) / depth.length : 0;
    say(drows + '</table>'
      + `<pre>a losing run gets ${(mean * 100).toFixed(0)}% of the way through its region</pre>`);
    ENDS_DETAIL = Object.entries(buckets).map(([k, b]) => {
      const [end, type] = k.split('|');
      return { end, type, n: b.n, row: +(b.row / b.n).toFixed(1), rows: b.rows - 1,
               deck: +(b.deck / b.n).toFixed(1) };
    }).sort((a, b) => b.n - a.n);
    DEPTH_FRAC = +(mean).toFixed(3);
  }

  say('<h2>end state</h2>');
  let erows = '<table><tr><th>outcome</th><th>runs</th><th></th></tr>';
  for (const [k, v] of Object.entries(ends).sort((a, b) => b[1] - a[1])) {
    erows += `<tr><td>${k}</td><td>${v}</td><td class="bar">${'#'.repeat(v)}</td></tr>`;
  }
  say(erows + '</table>');

  say('<h2>deck and purse at the end</h2>');
  const decks = results.map(r => r.run.deck.length);
  const purses = results.map(r => r.run.lostThings);
  const keeps = results.map(r => r.run.keepsakes.length);
  const stat = (a) => `min ${Math.min(...a)} / mean ${(a.reduce((x, y) => x + y, 0) / a.length).toFixed(1)} / max ${Math.max(...a)}`;
  say(`<pre>deck      ${stat(decks)}
purse     ${stat(purses)}
keepsakes ${stat(keeps)}
autosaves ${saveCount}</pre>`);

  if (errors.length) {
    say('<h2>errors</h2>');
    for (const e of errors.slice(0, 60)) say(`<pre class="err">${e}</pre>`);
  }

  const ms = Math.round(performance.now() - t0);
  const line = `RESULT: ${results.length} runs, ${errors.length} errors`;
  sum.className = errors.length ? 'fail' : 'pass';
  sum.textContent = `${line}  ·  ${ms} ms`;
  console.log(line);
  window.__RUN_RESULT__ = {
    runs: results.length, errors: errors.length, errorList: errors.slice(0, 60),
    ms, meanRooms: +avg.toFixed(1), ends,
    lengths, decks, purses, keeps, saveCount,
    endsDetail: ENDS_DETAIL, depthFrac: DEPTH_FRAC, visited: VISITED,
    reach: REACH, victories: VICTORIES,
    determinism: detOk, resume: resumeOk, storage: storeOk,
    combatResume: combatResume, combatResumeTried: combatResumeTried, replayed,
  };
}

main().catch((e) => {
  sum.className = 'fail';
  sum.textContent = 'RESULT: 0 runs, 1 errors (harness crashed)';
  say(`<pre class="err">${e && e.stack ? e.stack : e}</pre>`);
  window.__RUN_RESULT__ = { runs: 0, errors: 1, errorList: [String(e && e.stack || e)] };
});
</script>
</body>
</html>
