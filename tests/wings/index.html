<!doctype html>
<meta charset="utf-8">
<title>Wing conditions — which of the eight actually do anything</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; background: #14121a; color: #d8d4e0; padding: 20px; }
  .pass { color: #7fd08a; } .fail { color: #ff8080; } h2 { color: #c9a9ff; margin: 18px 0 6px; }
  .gap { color: #f8c96b; }
</style>
<h1>Wing conditions</h1>
<div id="out"></div>
<script type="module">
/**
 * `state/mapgen.js` HAZARDS declares eight wing conditions. Every blueprint
 * places two to four of them, `scenes/map.js` draws the marked area, names the
 * wing in the footer, lists it in the legend and shows its `rule` text in the
 * hover card.
 *
 * **On the morning of 2026-08-29 only two of the eight did anything at all.**
 * A repo-wide search for each id found references in `state/mapgen.js` and
 * nowhere else, for six of them. The player was told "Guard is halved at the
 * start of each of your turns while you are inside the marked area" and nothing
 * halved anything. All eight are wired now; the history stays because it is
 * what this suite is for (CONTRACTS 54).
 *
 * This suite exists to (a) assert every wing's EFFECT actually happens, and
 * (b) keep the list of which is which HONEST. The manifest below is asserted
 * against `HAZARDS`, so a wing that quietly stops doing anything fails, and so
 * does one implemented without being recorded here.
 */
import { Run } from '../../game/src/state/run.js';
import { HAZARDS } from '../../game/src/state/mapgen.js';

const passes = [], fails = [];
const out = document.getElementById('out');
const check = (ok, what, detail = '') => {
  (ok ? passes : fails).push(what + (detail ? ` — ${detail}` : ''));
  const d = document.createElement('div');
  d.className = ok ? 'pass' : 'fail';
  d.textContent = (ok ? 'PASS  ' : 'FAIL  ') + what + (detail ? ` — ${detail}` : '');
  out.appendChild(d);
};
const head = (t) => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };
const note = (t) => { const d = document.createElement('div'); d.className = 'gap'; d.textContent = t; out.appendChild(d); };

/**
 * What is actually wired, and where. Keep this true.
 *
 * Every value is now a place, not a `null`. It used to hold five nulls — what a
 * search for each id returned that morning: mapgen and nothing else. The shape
 * is kept rather than simplified away, because a `null` here is the one thing
 * that makes "declared but doing nothing" visible, and the assertion below
 * still reads the count. If a wing is ever gutted, this is where it shows.
 */
const WIRED = {
  /* ROOM effects — state/run.js enterNode */
  'sagging':      'run.js enterNode — every living Kid pays 3 Courage',
  'paw-prints':   'run.js enterNode — one shared Clue',
  'moonlit':      'run.js enterNode — leaving the wing restores 8 to each Kid',
  /* FIGHT effects — data/wings.js, applied before startCombat() */
  'lights-out':   'wings.js — every enemy starts with 2 Lurking; intents unreadable',
  'dust-sheets':  'wings.js — intents concealed on the first turn',
  'cold-draught': 'wings.js — every Kid starts with 2 Chill',
  'pipes':        'wings.js addPipesEnemy — one extra copy of the smallest enemy',
  'long-shadows': 'wings.js — Guard GAINED is halved (see the note in wings.js)',
};

const PARTY = [{ companion: 'marmalade', kid: 'maya' },
               { companion: 'bones', kid: 'eli' }];

function atTheDoor(seed) {
  const run = Run.mock({ seed, kids: PARTY });
  run.currentNodeId = null; run.pathIds = []; run.visitedIds = [];
  run.pendingVote = null;
  for (const n of run.map.nodes) n.visited = false;
  return run;
}
const stamp = (run, id, hazard) => {
  const n = run.nodeById(id);
  n.payload = { ...(n.payload || {}), hazard };
  return n;
};

async function main() {

  // ── the manifest ───────────────────────────────────────────────────────
  head('Eight wings declared, and what each one does');
  const declared = HAZARDS.map(h => h.id).sort();
  check(declared.join(',') === Object.keys(WIRED).sort().join(','),
    'this file knows about exactly the wings mapgen declares',
    declared.join(','));

  const live = Object.entries(WIRED).filter(([, v]) => v).map(([k]) => k);
  const dead = Object.entries(WIRED).filter(([, v]) => !v).map(([k]) => k);
  check(live.length === 8 && dead.length === 0,
    'ALL EIGHT are implemented — six of them were not, on the morning of '
    + '2026-08-29', `${live.length} of 8`);
  if (dead.length) {
    note(`   still doing nothing: ${dead.join(', ')}`);
    for (const id of dead) {
      const h = HAZARDS.find(x => x.id === id);
      note(`      ${h.name}: "${h.rule}"`);
    }
  }

  // ── sagging ────────────────────────────────────────────────────────────
  head('The Floor Sags');
  {
    const run = atTheDoor(4242);
    const to = run.legalNextIds()[0];
    stamp(run, to, 'sagging');
    const before = run.kids.map(k => k.courage);
    await run.enterNode(to);
    const after = run.kids.map(k => k.courage);
    check(after.every((c, i) => c === before[i] - 3),
      'EVERY Kid who walks in pays 3 — "do not crowd"',
      `${before.join('/')} -> ${after.join('/')}`);
    /* It used to charge `this.local`, which is whoever the screen was showing.
       Once the route became a vote that was the Kid who voted LAST, and on a
       wire each client charged a DIFFERENT Kid — a desync nothing reported. */
    check(run.localSeat === 0,
      'and the blueprint has handed the next room to the first Kid',
      String(run.localSeat));
  }

  // ── paw-prints ─────────────────────────────────────────────────────────
  head('Fresh Paw Prints');
  {
    const run = atTheDoor(4242);
    const to = run.legalNextIds()[0];
    stamp(run, to, 'paw-prints');
    /* NOT `before + 1`. `addClues` applies `flags.clueBonus`, which the mock's
       Keepsakes supply, so the wing pays 2 here — the first version of this
       check asserted the literal 1 and failed on the run layer working. What
       the wing must do is grant it ONCE, so it is measured against one direct
       `addClues(1)` on an identical run rather than against a number. */
    const yardstick = atTheDoor(4242);
    const y0 = yardstick.cluesFound;
    yardstick.addClues(1);
    const oneGrant = yardstick.cluesFound - y0;
    const before = run.cluesFound;
    await run.enterNode(to);
    check(run.cluesFound === before + oneGrant,
      'one Clue, ONCE — Clues are shared, not per Kid',
      `${before} -> ${run.cluesFound}, one grant is ${oneGrant}`);
  }

  // ── moonlit ────────────────────────────────────────────────────────────
  head('Moonlit Rooms');
  {
    const run = atTheDoor(4242);
    const inWing = run.legalNextIds()[0];
    stamp(run, inWing, 'moonlit');
    await run.enterNode(inWing);
    for (const k of run.kids) k.courage = Math.max(1, k.maxCourage - 20);
    const before = run.kids.map(k => k.courage);

    const onward = run.legalNextIds()[0];
    stamp(run, onward, null);
    await run.enterNode(onward);
    const after = run.kids.map(k => k.courage);
    check(after.every((c, i) => c === before[i] + 8),
      'LEAVING the wing restores 8 to every Kid',
      `${before.join('/')} -> ${after.join('/')}`);
  }
  {
    const run = atTheDoor(4242);
    const a = run.legalNextIds()[0];
    stamp(run, a, 'moonlit');
    await run.enterNode(a);
    for (const k of run.kids) k.courage = Math.max(1, k.maxCourage - 20);
    const before = run.kids.map(k => k.courage);
    const b = run.legalNextIds()[0];
    stamp(run, b, 'moonlit');
    await run.enterNode(b);
    check(run.kids.every((k, i) => k.courage === before[i]),
      'and moving WITHIN it pays nothing — it is leaving that is worth 8',
      `${before.join('/')} -> ${run.kids.map(k => k.courage).join('/')}`);
  }
  {
    const run = atTheDoor(4242);
    const a = run.legalNextIds()[0];
    stamp(run, a, 'moonlit');
    await run.enterNode(a);
    // `Run.mock` starts the Kids part-way down, so they have to be topped up
    // deliberately — the first version of this check assumed "entered" meant
    // "full" and was measuring nothing.
    for (const k of run.kids) k.courage = k.maxCourage;
    const full = run.kids.map(k => k.courage);
    const b = run.legalNextIds()[0];
    stamp(run, b, null);
    await run.enterNode(b);
    check(run.kids.every((k, i) => k.courage === full[i] && k.courage <= k.maxCourage),
      'a Kid already at full Courage is not pushed over their maximum',
      run.kids.map(k => `${k.courage}/${k.maxCourage}`).join(' '));
  }


  // ── the five FIGHT wings ───────────────────────────────────────────────
  /* Each is driven through `enterNode` into a real Scuffle rather than by
     poking `applyWing` at a bare engine, because the thing that has broken
     every previous version of a wing is the wiring, not the effect. */
  async function fightIn(seed, hazard) {
    const run = atTheDoor(seed);
    const to = run.legalNextIds().find(id => run.sceneFor(run.nodeById(id)) === 'combat');
    if (!to) return null;
    stamp(run, to, hazard);
    await run.enterNode(to);
    /* `_startCombat` BUILDS the engine and hands it to the scene; the scene is
       what calls `startCombat()`. Headless there is no scene, so the fight sits
       at turn 0 with no hand and no intents — which is exactly how the first
       version of this suite reported five failures that were all one missing
       line. `applyWing` has already run by here, which is the ordering that
       matters: the wing is installed before the opening intents are rolled. */
    if (run.combat) await run.combat.startCombat();
    return run;
  }

  head('The Lights Are Out');
  {
    const run = await fightIn(4242, 'lights-out');
    check(!!run?.combat, 'the fight is built', String(!!run?.combat));
    if (run?.combat) {
      const e = run.combat;
      check(e.enemies.every(en => (en.status('lurking') || 0) === 2),
        'every creature starts with 2 Unseen',
        e.enemies.map(en => en.status('lurking')).join('/'));
      check(e.enemies.every(en => en.intent && en.intent.revealed === false),
        'and not one of their intents can be read',
        e.enemies.map(en => en.intent && en.intent.name).join(', '));

      /* Two events bring it into the light. Hurting it is one of them. */
      const first = e.enemies[0];
      e.dealDamage({ attacker: e.players[0], defender: first, amount: 4,
                     kind: 'attack', skipModifiers: true });
      check(first.status('lurking') === 1, 'hurting one takes a stack off it',
        String(first.status('lurking')));
      e.dealDamage({ attacker: e.players[0], defender: first, amount: 4,
                     kind: 'attack', skipModifiers: true });
      check(first.status('lurking') === 0, 'and a second brings it into the light',
        String(first.status('lurking')));
      const { refreshIntents } = await import('../../game/src/combat/intents.js');
      refreshIntents(e, 'test');
      check(first.intent && first.intent.revealed !== false,
        'so its intent is readable again',
        String(first.intent && first.intent.name));
      const others = e.enemies.slice(1).filter(en => en.alive);
      if (others.length) {
        check(others.every(en => en.intent && en.intent.revealed === false),
          'while anything still hidden stays unreadable',
          others.map(en => en.intent && en.intent.revealed).join(','));
      }
    }
  }

  head('Under Dust Sheets');
  {
    const run = await fightIn(4242, 'dust-sheets');
    check(!!run?.combat, 'the fight is built', String(!!run?.combat));
    if (run?.combat) {
      const e = run.combat;
      check(e.enemies.every(en => en.intent && en.intent.revealed === false),
        'intents are hidden on turn 1', String(e.turn));
      check(e.enemies.every(en => (en.status('lurking') || 0) === 0),
        'and it is the TURN doing it, not a status on the creatures');
      await e.endTurn();
      const { refreshIntents } = await import('../../game/src/combat/intents.js');
      refreshIntents(e, 'test');
      check(e.turn > 1, 'the turn moved on', String(e.turn));
      check(e.enemies.some(en => en.alive && en.intent && en.intent.revealed !== false),
        'and from turn 2 the sheets are off');
    }
  }

  head('A Cold Draught');
  {
    const run = await fightIn(4242, 'cold-draught');
    check(!!run?.combat, 'the fight is built', String(!!run?.combat));
    if (run?.combat) {
      const e = run.combat;
      const me = e.players[0];
      check(e.players.every(pl => pl.status('chill') === 2),
        'every Kid starts with 2 Chill',
        e.players.map(pl => pl.status('chill')).join('/'));
      const hand = me.piles.list('hand');
      const card = hand.find(c => (c.def?.cost ?? 1) >= 1);
      if (card) {
        const base = card.def.cost;
        check(e.costOf(card) === base + 1,
          'the FIRST Trick of the turn costs 1 more Nerve',
          `${base} -> ${e.costOf(card)}`);
        me.stats.cardsPlayedThisTurn = 1;
        check(e.costOf(card) === base,
          'and the second costs what it says on it',
          `${base} -> ${e.costOf(card)}`);
      } else {
        check(false, 'a costed Trick in hand to price', 'none — check did NOT run');
      }
    }
  }

  head('Long Shadows');
  {
    const run = await fightIn(4242, 'long-shadows');
    check(!!run?.combat, 'the fight is built', String(!!run?.combat));
    if (run?.combat) {
      const e = run.combat;
      const me = e.players[0];
      check(me.status('long-shadows') > 0, 'the wing is on every Kid',
        e.players.map(pl => pl.status('long-shadows')).join('/'));
      check(e.previewBlockValue(me, 10) === 5,
        'Guard gained is halved', `10 -> ${e.previewBlockValue(me, 10)}`);
      check(e.previewBlockValue(me, 7) === 3,
        'and it rounds DOWN, so odd Guard loses the remainder',
        `7 -> ${e.previewBlockValue(me, 7)}`);
      const other = await fightIn(4242, null);
      check(other?.combat
        && other.combat.previewBlockValue(other.combat.players[0], 10) === 10,
        'the same fight outside the wing gains all of it',
        String(other?.combat && other.combat.previewBlockValue(other.combat.players[0], 10)));
    }
  }

  head('The Pipes Rattle');
  {
    const plain = await fightIn(4242, null);
    const noisy = await fightIn(4242, 'pipes');
    check(!!plain?.combat && !!noisy?.combat, 'both fights are built');
    if (plain?.combat && noisy?.combat) {
      check(noisy.combat.enemies.length === plain.combat.enemies.length + 1,
        'the noise brings one more creature',
        `${plain.combat.enemies.length} -> ${noisy.combat.enemies.length}`);
      /* A COPY of the smallest thing already there — the encounter's own roster
         is the only list guaranteed to be region- and tier-appropriate. */
      const smallest = Math.min(...plain.combat.enemies.map(en => en.maxHp));
      const extra = noisy.combat.enemies[noisy.combat.enemies.length - 1];
      check(extra.maxHp === smallest,
        'and it is a copy of the SMALLEST one already in the room',
        `${extra.name} at ${extra.maxHp}, smallest was ${smallest}`);
    }
  }

  // ── the cues those rooms play ──────────────────────────────────────────
  head('Sounds that had no caller');
  {
    const played = [];
    const run = atTheDoor(77);
    run.attach({ audio: { play: (id) => played.push(id),
                          stinger: (id) => played.push('sting/' + id) } });
    run.addLostThings(25);
    check(played.includes('world:coin'), 'gaining Lost Things rings');
    const n = played.filter(x => x === 'world:coin').length;
    run.addLostThings(-5);
    check(played.filter(x => x === 'world:coin').length === n,
      'and SPENDING them does not — a coin sound is for getting paid');
    const mendable = run.local.deck.find(c => !c.upgraded);
    if (mendable) run.upgradeCard(mendable.uid);
    check(played.includes('card:upgrade'), 'a mended Trick sounds mended');
    run.rescueCompanion('pipkin');
    check(played.includes('sting/sting:rescue'),
      'and a Companion coming home gets its sting — the whole point of the game, '
      + 'silent until now');
  }

  window.__RESULT = { passes, fails, passed: passes.length, failed: fails.length };
  window.__DONE = true;
}

main().catch((e) => {
  check(false, 'THREW', String(e && e.stack || e));
  window.__RESULT = { passes, fails, passed: passes.length, failed: fails.length };
  window.__DONE = true;
});
</script>
