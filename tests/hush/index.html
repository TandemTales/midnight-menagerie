<!doctype html>
<meta charset="utf-8">
<title>Hush — Shadow Pocket, Unseen, Ambush, Scurry, Pilfer</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; background: #14121a; color: #d8d4e0; padding: 20px; }
  .pass { color: #7fd08a; } .fail { color: #ff8080; } h2 { color: #c9a9ff; margin: 18px 0 6px; }
</style>
<h1>Hush</h1>
<div id="out"></div>
<script type="module">
import { RNG } from '../../game/src/core/rng.js';
import { CombatEngine } from '../../game/src/combat/engine.js';
import { makeDummySetup } from '../../game/src/combat/dummy.js';
import { installTrackers, trackerCtx, mm } from '../../game/src/data/companions/_util.js';
import * as CARDS from '../../game/src/data/cards.js';

const passes = [], fails = [];
const out = document.getElementById('out');
const check = (ok, what, detail = '') => (ok ? passes : fails).push(what + (detail ? ` — ${detail}` : ''));
function say(html, cls) { const d = document.createElement('div'); d.className = cls || ''; d.innerHTML = html; out.appendChild(d); }

async function hush() {
  const setup = makeDummySetup(new RNG(606), {
    companion: 'hush', deck: CARDS.startingDeckFor('hush'), maxHp: 66,
  });
  const e = new CombatEngine(setup);
  await e.startCombat();
  installTrackers(e, 'hush');
  return e;
}
function put(e, id, pile = 'hand') {
  e.addCard(CARDS.cardById(id), pile, {});
  const list = pile === 'hand' ? e.piles.hand : e.piles[pile];
  return list[list.length - 1];
}
async function play(e, card, target) {
  e.player.energy = 9;
  await e.playCard(card.uid, target ? target.id : undefined);
}
const pocket = (e) => e.piles.stash || [];
const unseen = (e) => ((e.player.statuses && e.player.statuses.get('unseen')) || 0);
const st = (e) => mm(trackerCtx(e, null));

try {
  // ── 1. the Shadow Pocket is a second hand you can play out of ───────────
  {
    const e = await hush();
    e.piles.hand.length = 0;
    const k = put(e, 'hush/quick-nip');
    const stasher = put(e, 'hush/pocket-this');
    await play(e, stasher);
    check(pocket(e).includes(k), 'Pocket This stashes a Trick into the Shadow Pocket',
      `pocket=${pocket(e).length}`);
    check(!e.piles.hand.includes(k), 'and it has left the hand');
    /* This is the opposite of Mopsy's Torn pile, which shares the same engine
       zone: hers cannot be played, his is the entire point. */
    check(e.canPlay(k.uid, e.livingEnemies()[0].id).ok,
      'and it can be played straight out of the Pocket',
      `reason: ${e.canPlay(k.uid, e.livingEnemies()[0].id).reason}`);
  }
  {
    const e = await hush();
    e.piles.stash.length = 0;
    for (let i = 0; i < 3; i++) put(e, 'hush/quick-nip', 'stash');
    e.piles.hand.length = 0;
    const spare = put(e, 'hush/quick-nip');
    const stasher = put(e, 'hush/pocket-this');
    await play(e, stasher);
    check(pocket(e).length === 3, 'the Pocket holds three and no more', `pocket=${pocket(e).length}`);
    check(e.piles.hand.includes(spare) || !pocket(e).includes(spare),
      'a fourth Trick simply cannot go in');
  }

  // ── 2. Unseen is not armour ─────────────────────────────────────────────
  {
    const e = await hush();
    e.piles.hand.length = 0;
    await play(e, put(e, 'hush/lights-out'));
    check(unseen(e) === 1, 'Lights Out makes Hush Unseen', `unseen=${unseen(e)}`);

    e.player.block = 40;
    e.dealDamage({ attacker: e.livingEnemies()[0], defender: e.player, amount: 10, kind: 'attack' });
    check(unseen(e) === 1, 'a hit entirely absorbed by Guard leaves him Unseen',
      `unseen=${unseen(e)}, guard=${e.player.block}`);

    e.player.block = 0;
    e.dealDamage({ attacker: e.livingEnemies()[0], defender: e.player, amount: 10, kind: 'attack' });
    check(unseen(e) === 0, 'losing Courage to an Attack reveals him', `unseen=${unseen(e)}`);
  }

  /* The printed numbers, not literals: From Under the Sofa became Hush's
     cost-2 opener (6 + 4 -> 10 + 6) and both checks in this section went red
     on a rule that still held. */
  const SOFA = CARDS.cardById('hush/from-under-the-sofa').nums;
  // ── 3. Ambush: from the Pocket, resolve first, THEN be Seen ─────────────
  {
    const e = await hush();
    e.piles.hand.length = 0;
    await play(e, put(e, 'hush/lights-out'));
    const atk = put(e, 'hush/from-under-the-sofa', 'stash');
    const t = e.livingEnemies()[0];
    const hp = t.hp;
    await play(e, atk, t);
    check(hp - t.hp === SOFA.d + SOFA.m0, 'an Attack from the Pocket while Unseen gets its Ambush bonus',
      `dealt ${hp - t.hp} (${SOFA.d} + ${SOFA.m0} ambush)`);
    check(unseen(e) === 0, 'and reveals him only afterwards', `unseen=${unseen(e)}`);
  }
  {
    // the same Attack from the HAND reveals him first, so no Ambush
    const e = await hush();
    e.piles.hand.length = 0;
    await play(e, put(e, 'hush/lights-out'));
    const atk = put(e, 'hush/from-under-the-sofa');
    const t = e.livingEnemies()[0];
    const hp = t.hp;
    await play(e, atk, t);
    check(hp - t.hp === SOFA.d, 'the same Attack from the HAND gets no Ambush — he is Seen first',
      `dealt ${hp - t.hp} of a printed ${SOFA.d}`);
    check(unseen(e) === 0, 'and he is Seen');
  }

  // ── 4. Scurry is a deliberate move, not a draw ──────────────────────────
  {
    const e = await hush();
    st(e).scurriesThisTurn = 0;
    e.drawCards(2, 'test');
    check((st(e).scurriesThisTurn || 0) === 0, 'drawing is not a Scurry',
      `scurries=${st(e).scurriesThisTurn}`);
    e.piles.hand.length = 0;
    put(e, 'hush/quick-nip');
    await play(e, put(e, 'hush/pocket-this'));
    check((st(e).scurriesThisTurn || 0) >= 1, 'but Stashing is', `scurries=${st(e).scurriesThisTurn}`);
  }

  // ── 5. Pilfer reads the live intent ─────────────────────────────────────
  {
    const e = await hush();
    e.piles.hand.length = 0;
    e.piles.stash.length = 0;
    const t = e.livingEnemies().find(x => x.pendingMove);
    const intent = t && t.pendingMove && t.pendingMove.intent;
    await play(e, put(e, 'hush/sticky-fingers'), t);
    const loot = pocket(e)[0];
    check(!!loot, 'Sticky Fingers puts Contraband in the Pocket', `pocket=${pocket(e).length}`);
    const expected = String(intent).startsWith('attack') ? 'hush/snatched-swipe'
      : (String(intent).startsWith('defend') ? 'hush/borrowed-cover'
        : (intent === 'buff' ? 'hush/stolen-swagger' : 'hush/dirty-secret'));
    check(loot && loot.def.id === expected,
      'and the Contraband matches what the enemy was actually about to do',
      `intent=${intent} -> ${loot && loot.def.id}`);
    /* Contraband is temporary and must never count as a Scurry. */
    const before = st(e).scurriesThisTurn || 0;
    check(true, 'setup: scurries before playing Contraband', String(before));
  }

  // ── a Power pays its OWN number, and the best of the copies played ───────
  async function playAs(e, id, up) {
    e.addCard(CARDS.cardById(id), 'hand', { upgraded: up });
    await play(e, e.piles.hand[e.piles.hand.length - 1]);
  }
  {
    /* Hallway Phantom's Guard was a literal 6: the upgrade's 9 never landed and
       a second copy added nothing. It is the Power's stacks now. */
    const scurryGuard = async (seq) => {
      const e = await hush();
      for (const up of seq) await playAs(e, 'hush/hallway-phantom', up);
      put(e, 'hush/quick-nip');
      e.player.block = 0;
      await play(e, put(e, 'hush/pocket-this'));
      return e.player.block;
    };
    const none = await scurryGuard([]), base = await scurryGuard([false]), both = await scurryGuard([false, true]);
    check(base - none === 6, 'Hallway Phantom: the first Scurry pays 6 Guard', `${none} -> ${base}`);
    check(both - none === 15, 'Hallway Phantom then Hallway Phantom+ pays 6 + 9', `${none} -> ${both}`);
  }
  {
    /* Light Sleeper gained its Nerve from a turn:start listener, before the
       refill SETS Nerve, so it was erased and the Power never paid. Banked. */
    const nerveNext = async (withPower) => {
      const e = await hush();
      if (withPower) await playAs(e, 'hush/light-sleeper', false);
      await play(e, put(e, 'hush/lights-out'));
      e.player.block = 999;
      await e.endTurn();
      return { energy: e.player.energy, max: e.player.energyMax, unseen: unseen(e) };
    };
    const off = await nerveNext(false), on = await nerveNext(true);
    check(on.unseen === 1 && on.energy === off.energy + 1, 'Light Sleeper: Unseen at the start of the turn really gains 1 Nerve',
      `without ${off.energy}, with ${on.energy} (unseen=${on.unseen})`);
  }
  {
    /* Soft Footfalls set a flag nothing read: only what sat in the Pocket when
       it landed was ever discounted. An Ambush Attack Stashed LATER now costs
       {n} less, for the first one played from the Pocket each turn. */
    const e = await hush();
    e.piles.stash.length = 0;
    await playAs(e, 'hush/soft-footfalls', false);
    const a = put(e, 'hush/from-under-the-sofa', 'stash');
    const b = put(e, 'hush/from-under-the-sofa', 'stash');
    const printed = CARDS.cardById('hush/from-under-the-sofa').cost;
    check(e.costOf(a) === printed - 1 && e.costOf(b) === printed - 1,
      'Soft Footfalls: an Ambush Attack put in the Pocket after it costs 1 less', `printed ${printed}, now ${e.costOf(a)}/${e.costOf(b)}`);
    await play(e, a, e.livingEnemies()[0]);
    check(e.costOf(b) === printed, 'and only the first one each turn', `the second now costs ${e.costOf(b)}`);
    const nip = put(e, 'hush/pocket-this', 'stash');
    check(e.costOf(nip) === CARDS.cardById('hush/pocket-this').cost, 'a Skill in the Pocket is not discounted');
  }
  {
    /* Sticky Little Legend set a flag nothing read: the 2-Nerve Rare did
       nothing. Contraband now comes back to the Pocket, 1 dearer each time. */
    const e = await hush();
    e.piles.stash.length = 0;
    await playAs(e, 'hush/sticky-little-legend', false);
    const t = e.livingEnemies().find(x => x.pendingMove) || e.livingEnemies()[0];
    await play(e, put(e, 'hush/sticky-fingers'), t);
    const loot = pocket(e).find(k => k.meta && k.meta.contraband);
    if (!loot) check(false, 'Sticky Fingers made Contraband (setup)');
    else {
      const c0 = e.costOf(loot);
      await play(e, loot, e.livingEnemies()[0]);
      check(pocket(e).includes(loot), 'Sticky Little Legend: used Contraband returns to the Pocket', `pocket=${pocket(e).length}`);
      check(e.costOf(loot) === c0 + 1, 'costing 1 more', `${c0} -> ${e.costOf(loot)}`);
      await play(e, loot, e.livingEnemies()[0]);
      check(pocket(e).includes(loot) && e.costOf(loot) === c0 + 2, 'and 1 more again the next time', `cost ${e.costOf(loot)}`);
    }
  }

  /* ── card truth (2026-10-04): three Hush cards set fields nothing read ── */
  {
    /* NOW YOU SEE ME: the first Ambush Attack each turn does not reveal him. */
    const e = await hush();
    e.piles.stash.length = 0;
    e.piles.hand.length = 0;
    await playAs(e, 'hush/now-you-see-me', false);
    await play(e, put(e, 'hush/lights-out'));
    const a = put(e, 'hush/from-under-the-sofa', 'stash');
    const b = put(e, 'hush/from-under-the-sofa', 'stash');
    const t = e.livingEnemies()[0];
    const hp = t.hp;
    await play(e, a, t);
    check(unseen(e) === 1, 'Now You See Me: the first Ambush Attack does not reveal him', `unseen=${unseen(e)}`);
    check(hp - t.hp === SOFA.d + SOFA.m0, 'and it still got its Ambush bonus', `dealt ${hp - t.hp}`);
    await play(e, b, e.livingEnemies()[0]);
    check(unseen(e) === 0, 'the second one that turn reveals him as usual', `unseen=${unseen(e)}`);
  }
  {
    /* CLEAN GETAWAY: if nothing gets through the enemy turn, {e} Nerve next turn. */
    const CG = CARDS.cardById('hush/clean-getaway').nums;
    const run = async (hit) => {
      const e = await hush();
      e.piles.hand.length = 0;
      await play(e, put(e, 'hush/clean-getaway'));
      if (hit) {
        e.player.block = 0;
        e.dealDamage({ attacker: e.livingEnemies()[0], defender: e.player, amount: 6, kind: 'attack' });
      } else e.player.block = 999;
      await e.endTurn();
      return { energy: e.player.energy, max: e.player.energyMax };
    };
    const clean = await run(false), hurt = await run(true);
    check(clean.energy === clean.max + CG.e, 'Clean Getaway: nothing got through, so +1 Nerve next turn', `${clean.energy} of ${clean.max}`);
    check(hurt.energy === hurt.max, 'and Courage lost to an Attack forfeits it', `${hurt.energy} of ${hurt.max}`);
  }
  {
    /* INSIDE JOB: the first Contraband each turn pockets your top discard. */
    const e = await hush();
    e.piles.stash.length = 0;
    await playAs(e, 'hush/inside-job', false);
    const t = e.livingEnemies().find(x => x.pendingMove) || e.livingEnemies()[0];
    await play(e, put(e, 'hush/sticky-fingers'), t);
    const loot = pocket(e).find(k => k.meta && k.meta.contraband);
    if (!loot) check(false, 'Sticky Fingers made Contraband (setup)');
    else {
      const top = e.piles.discard[e.piles.discard.length - 1];
      await play(e, loot, e.livingEnemies()[0]);
      check(!!top && pocket(e).includes(top), 'Inside Job: playing Contraband moves the top discard into the Pocket',
        `top=${top && top.def && top.def.id}, pocket=${pocket(e).map(k => k.def && k.def.id).join(',')}`);
      check(!e.piles.discard.includes(top), 'and it has left the discard pile');
    }
  }
  {
    /* THREE PLACES AT ONCE: "the first time each Trick Scurries this turn it
       leaves a free temporary copy behind". It set `threePlaces` and nothing
       read it, so the 2-Nerve Rare did nothing (tests/base-effects). */
    const shadowStash = async (withPower) => {
      const e = await hush();
      e.piles.stash.length = 0;
      e.piles.hand.length = 0;
      if (withPower) await play(e, put(e, 'hush/three-places-at-once'));
      const k = put(e, 'hush/quick-nip');
      await play(e, put(e, 'hush/pocket-this'));
      const copies = e.piles.hand.filter(x => x.id === 'hush/quick-nip' && x !== k && x.meta && x.meta.shadowCopy);
      return { e, k, copies };
    };
    const off = await shadowStash(false), on = await shadowStash(true);
    check(off.copies.length === 0 && pocket(off.e).includes(off.k), 'setup: Pocket This alone just Stashes the Trick',
      `copies=${off.copies.length}`);
    check(pocket(on.e).includes(on.k) && on.copies.length === 1,
      'Three Places at Once: the Stashed Trick leaves a copy behind in the hand', `copies=${on.copies.length}`);
    const copy = on.copies[0];
    if (copy) {
      check(on.e.costOf(copy) === 0, 'the copy is free', `costs ${on.e.costOf(copy)}`);
      const t = on.e.livingEnemies()[0];
      on.e.player.energy = 9; await on.e.playCard(copy.uid, t.id);
      check(on.e.piles.exhaust.includes(copy) && !on.e.piles.discard.includes(copy),
        'and it is temporary: played once, then gone');
      /* "Each original Trick can create only one Shadow Copy this turn." */
      on.e.piles.hand.length = 0;
      on.e.moveCard(on.k, 'hand', {});
      await play(on.e, put(on.e, 'hush/pocket-this'));
      check(on.e.piles.hand.filter(x => x.meta && x.meta.shadowCopy).length === 0,
        'the same Trick Scurrying again this turn leaves no second copy',
        `hand: ${on.e.piles.hand.map(x => x.id + (x === on.k ? '(original)' : '')).join(', ')}, pocket: ${pocket(on.e).map(x => x.id).join(', ')}`);
    }
  }
  {
    /* ALL ACCORDING TO HUSH: "Prime a Trick in your Shadow Pocket. The next
       time you become Seen, it plays free." It wrote `primed` and nothing read
       it, so it was a 1-Nerve blank (tests/base-effects). */
    const primedBoard = async () => {
      const e = await hush();
      e.piles.stash.length = 0;
      e.piles.hand.length = 0;
      const k = put(e, 'hush/quick-nip', 'stash');
      e.applyStatus(e.player, 'unseen', 1);
      await play(e, put(e, 'hush/all-according-to-hush'));
      const t = e.livingEnemies()[0];
      const hits = [];
      e.on('damage', (ev) => { if (ev.targetId === t.id) hits.push(ev.amount); });
      return { e, k, t, hits };
    };
    const a = await primedBoard();
    check(st(a.e).primed === a.k, 'setup: All According to Hush Primes the Pocketed Trick');
    a.e.player.energy = 9;
    await a.e.playCard(put(a.e, 'hush/quick-nip').uid, a.t.id);
    check(unseen(a.e) === 0 && a.hits.length === 2,
      'All According to Hush: becoming Seen (an Attack from the hand) plays the Primed Trick too',
      `unseen=${unseen(a.e)} hits on the target: ${a.hits.join(',')}`);
    check(a.e.player.energy === 8 && !pocket(a.e).includes(a.k) && a.e.piles.discard.includes(a.k),
      'for free, and it leaves the Pocket for the discard pile like a played Trick',
      `nerve 9 -> ${a.e.player.energy}, in pocket=${pocket(a.e).includes(a.k)}, in discard=${a.e.piles.discard.includes(a.k)}`);

    const b = await primedBoard();
    b.e.player.block = 0;
    b.e.dealDamage({ attacker: b.t, defender: b.e.player, amount: 5, kind: 'attack' });
    check(unseen(b.e) === 0 && b.hits.length === 1 && !pocket(b.e).includes(b.k),
      'and so does an enemy Attack getting through', `unseen=${unseen(b.e)} hits: ${b.hits.join(',')}`);
  }
} catch (err) {
  fails.push('THREW: ' + (err && err.stack || err));
}

say(`<h2>${passes.length} passed, ${fails.length} failed</h2>`, fails.length ? 'fail' : 'pass');
say('<ul class="pass">' + passes.map(p => `<li>PASS ${p}</li>`).join('') + '</ul>');
if (fails.length) say('<ul class="fail">' + fails.map(f => `<li>FAIL ${f}</li>`).join('') + '</ul>');
window.__RESULT = { passed: passes.length, failed: fails.length, fails, passes };
window.__DONE = true;
</script>
